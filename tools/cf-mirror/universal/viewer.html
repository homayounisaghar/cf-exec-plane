<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__MIRROR_TITLE__ · CF Universal Mirror</title>
<style>
:root{color-scheme:dark;font-family:system-ui;color:#eaf1ff;background:#0e1420}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
#browserControls{display:none;flex:none;background:#243247;border-bottom:1px solid #4b5b70}
#tabs{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:5px 7px 0;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:3px;min-width:72px;max-width:200px;padding:6px 5px;background:#34465d;border-radius:7px 7px 0 0;border:1px solid transparent}
.tab.selected{background:#111c2c;border-color:#617892}
.tab button{background:none;border:0;color:#eaf1ff;font:12px system-ui;cursor:pointer}
.tabName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:25px;max-width:165px;text-align:left}
#newTab{border:0;color:white;background:#475f7f;border-radius:6px;padding:6px 11px;cursor:pointer}
#nav{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#101b2b}
#address{flex:1;min-width:0;border:1px solid #576e8c;border-radius:12px;background:#26384e;color:white;padding:8px;font:13px system-ui}
#nav button{background:#3a526f;color:white;border:0;border-radius:6px;padding:8px}
#status{font:11px system-ui;color:#b6c8df;max-width:100px;overflow:hidden}
#mirror{border:0;display:block;flex:1;width:100%;min-height:0;background:#101822}
@media(max-width:540px){#status{display:none}.tab{max-width:120px}.tabName{max-width:90px}}
</style></head>
<body>
<div id="browserControls">
 <div id="tabs"><button id="newTab" title="New browser tab">＋</button></div>
 <form id="nav"><button type="button" id="back" title="Back">←</button><input type="text" id="address" autocomplete="off" spellcheck="false" placeholder="Browse to any URL"><button type="submit">Go</button><span id="status"></span></form>
</div>
<iframe id="mirror" title="Interactive remote window" src="/view/" allow="fullscreen; microphone"></iframe>
<script>
'use strict';
const BROWSER_MODE=__BROWSER_MODE__,CONTROL_CSRF='__CONTROL_CSRF__';
const controls=document.getElementById('browserControls'),tabs=document.getElementById('tabs'),frame=document.getElementById('mirror'),address=document.getElementById('address'),status=document.getElementById('status');
if(BROWSER_MODE)controls.style.display='block';
let busy=false,selectedId=null,previousIds=null;
async function api(action,data){
 const r=await fetch('/api/'+action,{
  method:data===undefined?'GET':'POST',
  headers:data===undefined?{}:{'Content-Type':'application/json','X-CF-Mirror-CSRF':CONTROL_CSRF},
  body:data===undefined?undefined:JSON.stringify(data),cache:'no-store'
 });
 const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Tab action failed');return j;
}
const btn=(text,cls,fn,title)=>{
 const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;if(title)b.title=title;b.addEventListener('click',fn);return b;
};
async function act(f){
 if(busy)return;busy=true;status.textContent='Switching…';
 try{await f();frame.src='/view/?t='+Date.now();await refresh();}catch(e){status.textContent=e.message;}
 finally{busy=false;}
}
async function refresh(){
 if(!BROWSER_MODE)return;
 try{
  const j=await api('tabs'),ids=new Set(j.tabs.map(t=>t.id));
  if(previousIds&&!busy){
   const popup=j.tabs.find(t=>!previousIds.has(t.id)&&t.openerId===selectedId);
   if(popup){previousIds=ids;await act(()=>api('select',{id:popup.id}));return;}
  }
  previousIds=ids;selectedId=j.selectedId;tabs.replaceChildren();
  for(const t of j.tabs){
   const el=document.createElement('div');el.className='tab'+(selectedId===t.id?' selected':'');
   el.append(btn((t.title||t.url||'New tab').slice(0,85),'tabName',()=>act(()=>api('select',{id:t.id})),t.url));
   el.append(btn('×','tabClose',()=>act(()=>api('close',{id:t.id})),'Close tab'));
   tabs.append(el);
  }
  tabs.append(btn('＋','',()=>act(()=>api('new',{})),'New tab'));
  const current=j.tabs.find(t=>t.id===selectedId);
  if(current&&document.activeElement!==address)address.value=current.url||'';
  status.textContent=j.tabs.length+' tabs';
 }catch(e){status.textContent=e.message;}
}
if(BROWSER_MODE){
 document.getElementById('nav').addEventListener('submit',e=>{e.preventDefault();if(address.value.trim())act(()=>api('go',{url:address.value.trim()}));});
 document.getElementById('back').addEventListener('click',()=>act(()=>api('back',{})));
 refresh();setInterval(refresh,2600);
}
</script>
</body></html>
