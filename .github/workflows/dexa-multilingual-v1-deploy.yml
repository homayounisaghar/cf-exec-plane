name: Dexa Multilingual Memory Writer V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-multilingual-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-multilingual-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and exact public snapshot
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-multilingual-v1/dexa-multilingual-v1-20261102-v2.request
          dir=qualification/dexa-multilingual-v1-20261102
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(cat "$req")" == "request_id=dexa-multilingual-v1-20261102-v2" ]]
          while read -r name expected; do
            [[ "$(git hash-object "$dir/$name")" == "$expected" ]]
          done <<'HASHES'
          changes.patch 5efcfe9e795935c5845366e34423ed852d1efe70
          baseline.sha256 3ec907bdfca6abdf67c4a5e3dc4304b1928bc7a0
          dexa_memory_read_v1.mjs de3a6c71b9446468d6e93fc19c61c79e6b3f4df0
          dexa_outgoing_language_policy_v1.mjs 92028ea4fc5ff0097fafe85806636535fdd18a90
          test_dexa_memory_to_writer_translation_v1.mjs 330b8f5918bae0654ed0c806c910adf79ea2b66a
          test_dexa_outgoing_language_policy_v1.mjs e7a0f50cab193a78c8fa1deaa09432274f794190
          deploy.sh f8327b13466d60039a4d9a38adff4ce2ef281328
          HASHES
          bash -n "$dir/deploy.sh"
      - name: Establish pinned owner VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mkdir -m 700 "$RUNNER_TEMP/dexa-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/dexa-ssh/key"
          chmod 600 "$RUNNER_TEMP/dexa-ssh/key"
          read -r alg key extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$alg" == ssh-ed25519 && -n "$key" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$key" > "$RUNNER_TEMP/dexa-ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$key" >> "$RUNNER_TEMP/dexa-ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Transfer bounded snapshot and run guarded Dexa release
        shell: bash
        run: |
          set -euo pipefail
          d=qualification/dexa-multilingual-v1-20261102
          remote=/tmp/dexa-multilingual-v1-20261102
          opts=(-i "$RUNNER_TEMP/dexa-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dexa-ssh/known_hosts")
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 700 $remote"
          for f in changes.patch baseline.sha256 dexa_memory_read_v1.mjs dexa_outgoing_language_policy_v1.mjs test_dexa_memory_to_writer_translation_v1.mjs test_dexa_outgoing_language_policy_v1.mjs deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "$d/$f" "$VPS_SSH_USER@$VPS_HOST:$remote/$f"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "if [ \$(id -u) -eq 0 ]; then chown -R cfserver:cfserver $remote /home/cfserver/dexa-multilingual-release-20261102; runuser -u cfserver -- bash $remote/deploy.sh; else bash $remote/deploy.sh; fi" </dev/null
          echo DEPLOY_REQUEST_SENT_CHECK_LIVE_SERVICE
