name: Onshape Static Bootstrap Proof

on:
  push:
    branches:
      - main
    paths:
      - server-bootstrap/control/onshape-static-diagnostic-requests/**

permissions:
  contents: read

concurrency:
  group: personal-server-onshape-static-bootstrap-proof
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prove:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable static diagnostic request
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "static diagnostic trigger commit must add exactly one request file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "static diagnostic request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/onshape-static-diagnostic-requests/*.request ]] || { echo "unexpected static diagnostic request path" >&2; exit 12; }

      - name: Mask host and login
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)

      - name: Probe current Onshape static bootstrap assets
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/85-onshape-static-bootstrap-proof.sh
