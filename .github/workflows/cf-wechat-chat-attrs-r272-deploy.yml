name: CF WeChat Conversation Attributes r272 Guarded Release
on:
  push:
    branches: [main]
    paths: [server-bootstrap/control/cf-wechat-chat-attrs-r272/*.request]
permissions: {contents: read}
concurrency: {group: cf-wechat-chat-attrs-r272, cancel-in-progress: false}
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNAP: qualification/cf-wechat-chat-attrs-r272/20261101
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Admit exact immutable request
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/cf-wechat-chat-attrs-r272/cf-wechat-chat-attrs-r272-20261101-v1.request
          [[ "$(git diff --name-status HEAD^ HEAD)" == "$(printf 'A\t%s' "$req")" ]] || exit 10
          [[ "$(wc -l < "$req")" == 4 ]] || exit 11
          grep -Fxq 'request_id=cf-wechat-chat-attrs-r272-20261101-v1' "$req"
          grep -Fxq 'source_commit=4143b30a2929b76e4df47a9233607458a0d81276' "$req"
          grep -Fxq 'expected_sequence=272' "$req"
          grep -Fxq 'expected_release=onshape-vps-fast-r100-direct-orbit1-paa-storage-r272-wechat-chat-attrs-20261101' "$req"
      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SNAP"
          [[ "$(git hash-object activate-r272.sh)" == 'fec494027c1fd21cf45ccfcb0f95f67c5f39a865' ]]
          [[ "$(git hash-object projection.json)" == '667242add0c56474cf63eefe228d0615c103e00c' ]]
          [[ "$(git hash-object test_cf_chat_attrs.mjs)" == 'f3f91a8b52ca64e0d9618d2e5a924794c305cb76' ]]
          bash -n activate-r272.sh
      - name: Scoped authenticated release and rollback
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 21
          dir="$RUNNER_TEMP/r272-ssh"; install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"; chmod 0600 "$dir/key"
          read -r kt kd extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$kt" == ssh-ed25519 && -n "$kd" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$kt" "$kd" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$kt" "$kd" >> "$dir/known_hosts"
          chmod 0600 "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 755 /tmp/cf-wechat-chat-r272-payload"
          for f in activate-r272.sh projection.json test_cf_chat_attrs.mjs; do
            scp "${transport[@]}" -P "$port" "$SNAP/$f" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-wechat-chat-r272-payload/$f"
          done
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" 'set +e; bash /tmp/cf-wechat-chat-r272-payload/activate-r272.sh > /tmp/cf-wechat-r272-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/cf-wechat-r272-diagnostic.log; chmod 0640 /tmp/cf-wechat-r272-diagnostic.log; exit "$rc"' </dev/null
          echo CF_WECHAT_CHAT_ATTRS_R272_REQUEST_EXECUTED_VERIFY_LIVE_SERVER
