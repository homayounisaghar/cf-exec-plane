name: Onshape A2 Fence Guard Test

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-a2-fence-test/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-a2-fence-test
  cancel-in-progress: false

jobs:
  test:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable A2 test request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/onshape-a2-fence-test/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$action" == "test-a2-monotonic-fence" ]] || exit 14
      - name: Test monotonic authority guard
        shell: bash
        run: |
          set -euo pipefail
          python3 server-bootstrap/pull-agent/test_runtime_control_guard.py server-bootstrap/pull-agent/runtime_control_guard.py
          bash -n server-bootstrap/pull-agent/cf-pull-agent.sh
          grep -Fq 'capability-fabric-runtime-control-guard' server-bootstrap/pull-agent/cf-pull-agent.sh
          grep -Fq 'CF_RUNTIME_CONTROL_TRANSITION_REJECTED' server-bootstrap/pull-agent/cf-pull-agent.sh
          echo CF_A2_PULL_AGENT_GUARD_INTEGRATION=pass
      - name: Prove installed Android fence projection source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat >"$tmp/askpass" <<'ASK'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$CF_REPO_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASK
          chmod 0700 "$tmp/askpass"
          git init --bare "$tmp/repo.git" >/dev/null
          commit=173425a5e2e0daef953812837e67b925816bded8
          GIT_ASKPASS="$tmp/askpass" GIT_TERMINAL_PROMPT=0 git --git-dir="$tmp/repo.git" fetch --quiet --depth=1             https://github.com/homayounisaghar/capability-fabric.git "$commit"
          got="$(git --git-dir="$tmp/repo.git" rev-parse FETCH_HEAD)"
          [[ "$got" == "$commit" ]]
          base=android/onshape-session-bridge
          git --git-dir="$tmp/repo.git" show "$got:$base/app/src/main/java/dev/capabilityfabric/onshapebridge/OnshapeRuntimeControl.java" >"$tmp/runtime.java"
          git --git-dir="$tmp/repo.git" show "$got:$base/app/src/main/java/dev/capabilityfabric/onshapebridge/GitHubMailboxBridgeService.java" >"$tmp/service.java"
          git --git-dir="$tmp/repo.git" show "$got:$base/ci/patch_v067_dynamic_mailbox.py" >"$tmp/patch.py"
          grep -Fq 'BUS_GENERATION_MISMATCH' "$tmp/runtime.java"
          grep -Fq 'materialCommandsAllowed' "$tmp/runtime.java"
          grep -Fq 'preClaimControl.validateCommand(command)' "$tmp/service.java"
          grep -Fq 'preEffectControl.validateCommand(command)' "$tmp/service.java"
          grep -Fq 'if (generation <= currentGeneration || issue == currentIssue) return false;' "$tmp/patch.py"
          grep -Fq 'if (!"FREE".equals(safe(control.lease.state))) return false;' "$tmp/patch.py"
          if grep -Fq 'productionEpoch' "$tmp/runtime.java"; then
            echo CF_A2_ANDROID_LITERAL_PRODUCTION_EPOCH=present
            exit 20
          fi
          echo CF_A2_ANDROID_LITERAL_PRODUCTION_EPOCH=absent
          echo CF_A2_ANDROID_STALE_BUS_REJECTION_SOURCE=pass
          echo CF_A2_ANDROID_PRECLAIM_REREAD=pass
          echo CF_A2_ANDROID_PREEFFECT_REREAD=pass
          echo CF_A2_ANDROID_MONOTONIC_ROUTE_SOURCE=pass
          echo CF_A2_ANDROID_PROJECTION=busGeneration
