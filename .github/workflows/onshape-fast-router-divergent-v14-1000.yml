name: Onshape Fast Router Divergent V14 1000

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-divergent-v14-1000/control/*.request

permissions:
  contents: write

concurrency:
  group: onshape-fast-router-divergent-v14-1000
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-divergent-v14-1000/evidence_v06.py
          python -m py_compile qualification/onshape-fast-router-divergent-v14-1000/evidence_architecture_selftest.py
          python -m py_compile qualification/onshape-fast-router-divergent-v14-1000/fresh_holdout_v14_1000.py
          python -m py_compile qualification/onshape-fast-router-divergent-v14-1000/run_v14_1000.py
      - name: Run architecture selftest
        run: |
          mkdir -p artifacts/onshape-fast-router-divergent-v14-1000
          cd qualification/onshape-fast-router-divergent-v14-1000
          python evidence_architecture_selftest.py > "${{ github.workspace }}/artifacts/onshape-fast-router-divergent-v14-1000/architecture-selftest.json"
      - name: Require Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"
      - name: Run frozen divergent v14 1000-case stress holdout
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: '10'
          MAX_BATCH_RETRIES: '2'
          OUT_DIR: ${{ github.workspace }}/artifacts/onshape-fast-router-divergent-v14-1000
        run: |
          set -o pipefail
          cd qualification/onshape-fast-router-divergent-v14-1000
          python run_v14_1000.py 2>&1 | tee "${{ github.workspace }}/artifacts/onshape-fast-router-divergent-v14-1000/run.log"
      - name: Publish direct readback
        if: always()
        run: |
          set -eu
          src="artifacts/onshape-fast-router-divergent-v14-1000"
          dst="reports/onshape-fast-router-divergent-v14-1000"
          mkdir -p "$dst"
          test -f "$src/architecture-selftest.json" && cp "$src/architecture-selftest.json" "$dst/architecture-selftest.json" || true
          test -f "$src/corpus-manifest.json" && cp "$src/corpus-manifest.json" "$dst/corpus-manifest.json" || true
          test -f "$src/run.log" && cp "$src/run.log" "$dst/run.log" || true
          if test -f "$src/summary.json"; then
            cp "$src/summary.json" "$dst/summary.json"
            cp "$src/rows.json" "$dst/rows.json"
            rm -f "$dst/latest-error.json"
          else
            printf '{"state":"NO_SUMMARY"}\n' > "$dst/latest-error.json"
          fi
          printf '{"run_id":"%s","head_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: Onshape divergent v14 1000" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
