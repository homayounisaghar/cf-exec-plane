name: Onshape Session Pool Five Session Additive Lab
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-session-pool-five-session-lab/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-session-pool-five-session-lab
  cancel-in-progress: false
jobs:
  lab:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-session-pool-five-session-lab/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-session-pool-five-session-additive-lab-v1 ]]
          [[ "$(awk -F= '$1=="candidate_commit"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == 774434bd3f442c7d8ec570e66f6620c59add3813 ]]
          bash -n server-bootstrap/280-onshape-session-pool-five-session-additive-lab.sh
      - name: Mask endpoint
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Run additive five-session lab
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/280-onshape-session-pool-five-session-additive-lab.sh
