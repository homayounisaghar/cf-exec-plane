name: Onshape IN_DOUBT Failure Locus

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-indoubt-failure-locus/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-indoubt-failure-locus
  cancel-in-progress: false

jobs:
  inspect:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable failure-locus request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/onshape-indoubt-failure-locus/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$action" == "inspect-remaining-attempt-failure-locus" ]] || exit 14
      - name: Inspect durable failure locus without replay
        id: locus
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/127-onshape-indoubt-failure-locus.sh)"
          printf '%s\n' "$out"
          locus="$(printf '%s\n' "$out" | awk -F= '$1=="CF_FAILURE_LOCUS"{print $2}' | tail -n1)"
          timeout="$(printf '%s\n' "$out" | awk -F= '$1=="CF_FAILURE_TIMEOUT"{print $2}' | tail -n1)"
          fill="$(printf '%s\n' "$out" | awk -F= '$1=="CF_FAILURE_FILL_HINT"{print $2}' | tail -n1)"
          press="$(printf '%s\n' "$out" | awk -F= '$1=="CF_FAILURE_PRESS_HINT"{print $2}' | tail -n1)"
          [[ -n "$locus" && -n "$timeout" && -n "$fill" && -n "$press" ]] || exit 20
          echo "locus=$locus" >> "$GITHUB_OUTPUT"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          echo "fill=$fill" >> "$GITHUB_OUTPUT"
          echo "press=$press" >> "$GITHUB_OUTPUT"
      - name: Failure STEP0
        if: steps.locus.outputs.locus == 'STEP0'
        run: echo matched
      - name: Failure STEP1
        if: steps.locus.outputs.locus == 'STEP1'
        run: echo matched
      - name: Failure STEP2
        if: steps.locus.outputs.locus == 'STEP2'
        run: echo matched
      - name: Failure STEP3
        if: steps.locus.outputs.locus == 'STEP3'
        run: echo matched
      - name: Failure MULTI_SELECTOR_MATCH
        if: steps.locus.outputs.locus == 'MULTI_SELECTOR_MATCH'
        run: echo matched
      - name: Failure UNKNOWN
        if: steps.locus.outputs.locus == 'UNKNOWN'
        run: echo matched
      - name: Timeout YES
        if: steps.locus.outputs.timeout == 'yes'
        run: echo matched
      - name: Fill hint YES
        if: steps.locus.outputs.fill == 'yes'
        run: echo matched
      - name: Press hint YES
        if: steps.locus.outputs.press == 'yes'
        run: echo matched
