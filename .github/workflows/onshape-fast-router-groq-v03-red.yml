name: Onshape Fast Router Groq V03 Red Team

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-groq-v03-red/control/*.request

permissions:
  contents: read

concurrency:
  group: onshape-fast-router-groq-v03-red
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-groq-v03-red/benchmark.py
          python -m py_compile qualification/onshape-fast-router-groq-v03-red/corpus_v02.py
          python -m py_compile qualification/onshape-fast-router-groq-v03-red/red_team.py

      - name: Require Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"

      - name: Run focused red team
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CASE_DELAY: '8.2'
          OUT_DIR: artifacts/onshape-fast-router-groq-v03-red
        run: python qualification/onshape-fast-router-groq-v03-red/red_team.py

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onshape-fast-router-groq-v03-red-${{ github.run_id }}
          path: artifacts/onshape-fast-router-groq-v03-red/
          if-no-files-found: warn
          retention-days: 14
