name: PCG Private Branch CI

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/pcg-ci-requests/*.request'

permissions:
  contents: read

concurrency:
  group: pcg-private-branch-ci
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pcg-core-tests:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: request
        name: Validate immutable PCG CI request
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "PCG CI trigger must add exactly one request file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "PCG CI request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/pcg-ci-requests/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]] || exit 14
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exact private candidate then scrub credential
        env:
          CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
          CANDIDATE_COMMIT: ${{ steps.request.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          : "${CF_REPO_READ_TOKEN:?missing private repository read token}"
          work="${RUNNER_TEMP}/pcg-private"
          rm -rf "$work"
          mkdir -m 700 "$work"
          git init "$work" >/dev/null
          askpass="${RUNNER_TEMP}/pcg-askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$CF_REPO_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$work" fetch --quiet --depth=1 \
            https://github.com/homayounisaghar/capability-fabric.git "$CANDIDATE_COMMIT"
          actual="$(git -C "$work" rev-parse FETCH_HEAD)"
          [[ "$actual" == "$CANDIDATE_COMMIT" ]] || { echo "private candidate commit mismatch" >&2; exit 20; }
          git -C "$work" checkout --quiet --detach FETCH_HEAD
          rm -f "$askpass"
          unset CF_REPO_READ_TOKEN
          if git -C "$work" remote -v | grep -E 'x-access-token|github_pat_|ghp_' >/dev/null; then
            echo "credential material persisted in git remote" >&2
            exit 21
          fi
          echo "PCG_PRIVATE_WORKTREE=$work" >> "$GITHUB_ENV"

      - name: Compile changed PCG modules without repository credentials
        run: |
          set -euo pipefail
          test -n "${PCG_PRIVATE_WORKTREE:-}"
          cd "$PCG_PRIVATE_WORKTREE"
          python -m compileall -q \
            src/capability_fabric/telegram_correlation.py \
            src/capability_fabric/telegram_execution.py \
            src/capability_fabric/telegram_runtime.py \
            src/capability_fabric/telegram_payload_bound.py \
            src/capability_fabric/telegram_host.py \
            src/capability_fabric/pcg_live.py \
            src/capability_fabric/pcg_live_unified.py \
            src/capability_fabric/pcg_provision.py \
            server-deploy/channels/pcg/current/pcg_core_stub.py \
            server-deploy/channels/pcg/current/pcg_telegram_tdlib_unprovisioned.py \
            server-deploy/channels/pcg/current/pcg_telegram_provisioning_runtime.py
          bash -n server-bootstrap/42-pcg-pull-agent.sh
          bash -n server-bootstrap/43-pcg-provisioning-ssh.sh
          bash -n server-bootstrap/44-pcg-provisioning-window.sh
          bash -n server-deploy/channels/pcg/current/health.sh

      - name: Enforce Telegram V1 no-presence-manipulation invariant
        run: |
          set -euo pipefail
          cd "$PCG_PRIVATE_WORKTREE"
          if grep -R -n -E 'setOption.{0,120}online|online.{0,120}setOption' src/capability_fabric server-deploy/channels/pcg/current --include='*.py'; then
            echo "Telegram V1 must not manipulate the online option" >&2
            exit 31
          fi
          echo "PCG_TDLIB_PRESENCE_MUTATION=absent"

      - name: Smoke real single-writer provisioning runtime without credentials
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pcg-final-smoke"
          rm -rf "$work"
          mkdir -p "$work"/{run,state,api,db,provision}
          chmod 0777 "$work/run" "$work/state" "$work/api"
          chmod 0755 "$work/db" "$work/provision"
          printf '%s\n' 'T0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJK' > "$work/provision/token"
          chmod 0640 "$work/provision/token"
          sudo chown 65534:65534 "$work/provision/token"
          image='ghcr.io/homayounisaghar/pcg-tdlib-python@sha256:eccb8b5e73ac504aafd8a8b316e2fda951bd7cb23280cccf99c5e6206c4826e4'
          docker pull "$image" >/dev/null
          cid="$(docker run -d --rm --network none \
            --user 65534:65534 \
            -v "$PCG_PRIVATE_WORKTREE/server-deploy/channels/pcg/current:/release:ro" \
            -v "$work/run:/run/pcg:rw" \
            -v "$work/state:/state:rw" \
            -v "$work/api:/api-credentials:rw" \
            -v "$work/db:/db-key:ro" \
            -v "$work/provision:/provision:ro" \
            "$image" python /release/pcg_telegram_provisioning_runtime.py)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$cid" python -c "import json,socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/pcg/telegram.sock'); s.sendall(b'{\"op\":\"health\"}'); d=json.loads(s.recv(4096)); s.close(); assert d['mode']=='REAL_TDLIB_PROVISIONABLE'; assert d['authorization']=='PROVISIONING_REQUIRED'; assert d['tdlib_client']=='NOT_CREATED'; assert d['material_send_admission']=='CLOSED'; assert d['model_content_admission']=='CLOSED'" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "$cid" python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8766/healthz',timeout=2); assert r.status==200; assert b'one-time-loopback-same-writer' in r.read()"

          # Prove host-side window/token rotation invalidates the stale in-memory session
          # without restarting the TDLib-owning process.
          token1='T0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJK'
          docker exec "$cid" python -c "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8766,timeout=2); c.request('POST','/session',body=sys.argv[1],headers={'Content-Type':'text/plain'}); r=c.getresponse(); raise SystemExit(0 if r.status==204 else 1)" "$token1"
          token2='U9876543210zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQ'
          printf '%s\n' "$token2" > "$work/provision/token.next"
          chmod 0640 "$work/provision/token.next"
          sudo chown 65534:65534 "$work/provision/token.next"
          mv -f "$work/provision/token.next" "$work/provision/token"

          rotated=no
          for i in $(seq 1 10); do
            if docker exec "$cid" python -c "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8766,timeout=2); c.request('POST','/session',body=sys.argv[1],headers={'Content-Type':'text/plain'}); r=c.getresponse(); raise SystemExit(0 if r.status==204 else 1)" "$token2" >/dev/null 2>&1; then
              rotated=yes
              break
            fi
            sleep 1
          done
          [[ "$rotated" == yes ]]
          docker exec "$cid" python -c "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8766,timeout=2); c.request('POST','/session',body=sys.argv[1],headers={'Content-Type':'text/plain'}); r=c.getresponse(); raise SystemExit(0 if r.status==403 else 1)" "$token1"

          test ! -e "$work/api/telegram-api.json"
          echo "PCG_FINAL_TOKEN_ROTATION_SMOKE=pass"
          echo "PCG_FINAL_SINGLE_WRITER_SMOKE=pass"
          docker rm -f "$cid" >/dev/null
          trap - EXIT

      - name: Install PCG live package without private-repo credential
        run: |
          set -euo pipefail
          python -m pip install -e "$PCG_PRIVATE_WORKTREE[pcg-live]"

      - name: Run PCG correlation and material-effect regression probes
        run: |
          set -euo pipefail
          cd "$PCG_PRIVATE_WORKTREE"
          python tests/test_telegram_material_effect_v01.py
          python tests/test_telegram_recovery_correlation_v02.py
          python tests/test_telegram_kernel_integration_v01.py
          python tests/test_communications_runtime_v01.py
          python tests/test_telegram_host_v01.py
          python tests/test_pcg_live_host_v01.py
          python tests/test_pcg_provision_v02.py
          python tests/test_telegram_payload_bound.py
