name: Exit Button APK Build

on:
  push:
    branches:
      - exit-button-apk-build
    paths:
      - 'exit-button-app/**'
      - '.github/workflows/exit-button-apk-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android SDK
        shell: bash
        run: |
          set -eu
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDKROOT"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        working-directory: exit-button-app
        run: gradle --no-daemon assembleRelease

      - name: Hash artifact
        shell: bash
        run: sha256sum exit-button-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: exit-button-unsigned-apk
          path: exit-button-app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
