name: Onshape Phase 5 Orphan Takeover Recovery
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-phase5-orphan-takeover-recover/*.request']
permissions: {contents: read}
jobs:
  recover:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-phase5-orphan-takeover-recover/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-phase5-orphan-takeover-recover-v1 ]]
          expected="$(awk -F= '$1=="expected_script_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/307-onshape-phase5-orphan-takeover-recover.sh")" == "$expected" ]]
          bash -n server-bootstrap/307-onshape-phase5-orphan-takeover-recover.sh
      - name: Restore orphaned production and reconcile exact Attempt
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/307-onshape-phase5-orphan-takeover-recover.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_PHASE5_ORPHAN_PROOF=no-owner-lock-free' <<<"$out"
          grep -Fxq 'CF_PHASE5_ORPHAN_PRODUCTION_RESTORED=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_DURABLE_TERMINAL=ABSENT' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_RESTORE=production-green' <<<"$out"
