name: Onshape Session Pool Semantic Live
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-session-pool-semantic-live/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-session-pool-maintenance
  cancel-in-progress: false
jobs:
  qualify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-session-pool-semantic-live/*.request ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-session-pool-semantic-live-v1 ]]
          bash -n server-bootstrap/283-onshape-session-pool-semantic-live.sh
          node --check server-bootstrap/helpers/283-onshape-session-pool-semantic-client.mjs
      - name: Run live semantic five-context qualification
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/283-onshape-session-pool-semantic-live.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_POOL_SEMANTIC_TEST=pass' <<<"$out"
