name: PCG Scoped ASR Error Code Diagnostic
on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-audio-diagnostic/*.request
permissions:
  contents: read
concurrency:
  group: pcg-code-diagnostic-v1
  cancel-in-progress: false
jobs:
  read:
    if: github.repository_owner == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit one diagnostic request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-status HEAD^ HEAD)" == $'A\tserver-bootstrap/control/pcg-audio-diagnostic/pcg-asr-codes-20261027.request' ]]
          grep -Fxq 'request_id=pcg-asr-codes-20261027-v1' server-bootstrap/control/pcg-audio-diagnostic/pcg-asr-codes-20261027.request
          [[ "$(wc -l < server-bootstrap/control/pcg-audio-diagnostic/pcg-asr-codes-20261027.request)" == 1 ]]
      - name: Prepare authorized root SSH identity
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_HOST_KEY" ]] || exit 21
          [[ "$VPS_SSH_USER" == root ]] || { echo PCG_ASR_DIAGNOSTIC_ROOT_REQUIRED;exit 22; }
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 23
          ssh_dir="$RUNNER_TEMP/pcg-error-codes-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          chmod 0600 "$ssh_dir/key"
          read -r algorithm material extra <<< "${VPS_HOST_KEY//$'\r'/}"
          [[ "$algorithm" == ssh-ed25519 && -n "$material" && -z "${extra:-}" ]] || exit 24
          printf '%s %s %s\n' "$VPS_HOST" "$algorithm" "$material" > "$ssh_dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$algorithm" "$material" >> "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Capture only PCG provider error-code tokens, no private content
        shell: bash
        run: |
          set -euo pipefail
          sshopts=(-i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          ssh "${sshopts[@]}" -p "$SSH_PORT" "${VPS_SSH_USER}@${VPS_HOST}" 'python3 -' <<'PY'
          import datetime,json,pathlib,re,subprocess,collections
          bins=['capability-fabric-pcg-web','capability-fabric-pcg-perplexity-asr','capability-fabric-pcg-audio-transform']
          pattern=re.compile(r'\\b(?:WEBK|PCG|PERPLEXITY_ASR|MATERIAL|MEDIA|ASR|BROWSER|CATALOG|FILE|LOCAL_ASR)_[A-Z0-9_]{3,}\\b')
          out={'schema':'pcg.audio-diagnostics.codes-only.v1','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'containers':{}}
          for name in bins:
            p=subprocess.run(['docker','logs','--since','2026-10-27T08:51:00Z','--until','2026-10-27T09:45:00Z','--tail','3000',name],capture_output=True,text=True,timeout=14)
            counts=collections.Counter();samples=[];lines=p.stdout.splitlines()+p.stderr.splitlines()
            for i,line in enumerate(lines):
              codes=sorted(set(pattern.findall(line)))
              if codes:
                counts.update(codes)
                if len(samples)<32:samples.append({'sequence':i,'codes':codes[:8]})
            out['containers'][name]={'exit_code':p.returncode,'lines_scanned':len(lines),'codes':dict(counts),'samples':samples}
          target=pathlib.Path('/tmp/pcg-audio-diagnostic-20261027.json')
          target.write_text(json.dumps(out,indent=2)+'\\n')
          target.chmod(0o644)
          print('PCG_ASR_REDACTED_DIAGNOSTIC_WRITTEN',len(out['containers']))
          PY
