name: Dexa Previous List Native Chat Navigation V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-first-chat-navigation-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-first-chat-navigation-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and secret-free source
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-first-chat-navigation-v1-20261102
          req=server-bootstrap/control/dexa-first-chat-navigation-v1/dexa-first-chat-navigation-v1-20261102-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == "A"$'\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 4 ]]
          grep -Fxq 'request_id=dexa-first-chat-navigation-v1-20261102-v1' "$req"
          grep -Fxq 'source_commit=c598d56c5a5752704f43a63f2f23552c94f3eff6' "$req"
          grep -Fxq "manifest_sha=$(git hash-object "$dir/manifest.json")" "$req"
          grep -Fxq "deploy_sha=$(git hash-object "$dir/deploy.sh")" "$req"
          [[ "$(git hash-object "$dir/dexa/dexa_provider_identity_closure_v1.mjs")" == "a574e0132df06d0619e3dec4972ee8603dec309d" ]]
          [[ "$(git hash-object "$dir/dexa/dexa_general_plan_cycle_v2.mjs")" == "b5ed11432ff473d05ea2568856b2298bab6f6d32" ]]
          [[ "$(git hash-object "$dir/dexa/dexa_typed_planner_prompt_v3.mjs")" == "ee1ff1ab382649ef6cf964d0bcc84a90f4f32210" ]]
          [[ "$(git hash-object "$dir/dexa/test_dexa_wechat_previous_first_navigation_v1.mjs")" == "c907b1b87256527080df44e2e8508d8fef0b14ca" ]]
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('qualification/dexa-first-chat-navigation-v1-20261102')
          doc=json.loads((root/'manifest.json').read_text())
          assert doc['schema']=='dexa.first-chat-navigation.v1'
          assert doc['source_commit']=='c598d56c5a5752704f43a63f2f23552c94f3eff6'
          assert doc['scope']=='dexa-main-only'
          assert doc['no_cf_server_change'] and doc['no_connector_refresh'] and doc['no_wechat_gui_restart']
          assert len(doc['files'])==4
          for file,rec in doc['files'].items():
           assert hashlib.sha256((root/'dexa'/file).read_bytes()).hexdigest()==rec['after'],file
          PY
          bash -n "$dir/deploy.sh"
      - name: Establish pinned SSH target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Install Dexa-only policy and verify live rollback gate
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-first-chat-navigation-v1-20261102
          remote=/tmp/dexa-first-chat-navigation-v1-20261102
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 755 $remote/dexa"
          for file in manifest.json deploy.sh dexa/dexa_provider_identity_closure_v1.mjs dexa/dexa_general_plan_cycle_v2.mjs dexa/dexa_typed_planner_prompt_v3.mjs dexa/test_dexa_wechat_previous_first_navigation_v1.mjs;do
            scp -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -P "$SSH_PORT" "$dir/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "bash $remote/deploy.sh" </dev/null
          echo DEXA_FIRST_CHAT_NAVIGATION_REQUEST_SENT_VERIFY_LIVE
