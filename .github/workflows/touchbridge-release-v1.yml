name: TouchBridge Release v1

on:
  push:
    branches: [main]
    paths:
      - 'touchbridge/control/release-requests/*.request'

permissions:
  contents: read

jobs:
  build_sign:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      EXPECTED_SIGNER_SHA256: e5b102356f271078a3d03e982782c3776e3d9f301c1b24c0e7194f06e5a001fa
      EXPECTED_ALIAS: personal_android_agent_line3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: req
        name: Validate request
        run: |
          set -euo pipefail
          changes="$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")"
          test "$(printf '%s\n' "$changes" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          IFS=$'\t' read -r status path <<<"$changes"
          test "$status" = A
          case "$path" in touchbridge/control/release-requests/*.request) ;; *) exit 12 ;; esac
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$path" | tail -n1 | tr -d '[:space:]')"
          test "$request_id" = "$(basename "$path" .request)"
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"

      - name: Fetch exact private source
        env:
          CANDIDATE_COMMIT: ${{ steps.req.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          : "$CF_REPO_READ_TOKEN"
          work="$RUNNER_TEMP/touchbridge-private"
          mkdir -m 700 "$work"
          git init "$work" >/dev/null
          askpass="$RUNNER_TEMP/tb-askpass"
          printf '%s\n' '#!/usr/bin/env bash' 'case "$1" in' '*Username*) printf "%s\\n" x-access-token ;;' '*Password*) printf "%s\\n" "$CF_REPO_READ_TOKEN" ;;' '*) exit 1 ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$work" fetch --quiet --depth=1 https://github.com/homayounisaghar/capability-fabric.git "$CANDIDATE_COMMIT"
          test "$(git -C "$work" rev-parse FETCH_HEAD)" = "$CANDIDATE_COMMIT"
          git -C "$work" checkout --quiet --detach FETCH_HEAD
          rm -f "$askpass"
          echo "PRIVATE_WORKTREE=$work" >> "$GITHUB_ENV"

      - name: Validate contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads((Path(os.environ['PRIVATE_WORKTREE'])/'android/standard-apps/touchbridge/ci/portable-ci-contract.json').read_text())
          assert c['projectId']=='touchbridge-android'
          assert c['application']['packageId']=='com.homayounisaghar.touchbridge'
          assert c['application']['versionCode']==3 and c['application']['versionName']=='0.1.0-alpha3'
          assert c['pipeline']['buildStageRequiresSigningSecrets'] is False
          assert c['pipeline']['signingSeparatedFromBuild'] is True
          assert c['expectedSigner']['alias']=='personal_android_agent_line3'
          assert c['expectedSigner']['certificateSha256']=='e5b102356f271078a3d03e982782c3776e3d9f301c1b24c0e7194f06e5a001fa'
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Stage A build and verify
        run: |
          set -euo pipefail
          cd "$PRIVATE_WORKTREE/android/standard-apps/touchbridge"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease --stacktrace
          unsigned="$PWD/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned"
          line="$("$BT/aapt" dump badging "$unsigned" | head -n1)"
          [[ "$line" == *"package: name='com.homayounisaghar.touchbridge'"* ]]
          [[ "$line" == *"versionCode='3'"* ]]
          [[ "$line" == *"versionName='0.1.0-alpha3'"* ]]
          if "$BT/apksigner" verify "$unsigned" >/dev/null 2>&1; then exit 30; fi
          echo "UNSIGNED_APK=$unsigned" >> "$GITHUB_ENV"
          echo "UNSIGNED_SHA256=$(sha256sum "$unsigned" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Fetch and verify durable signer
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          bash server-bootstrap/runner/fetch-android-agent-line3-signer.sh /tmp/tb-signer
          observed="$(openssl x509 -in /tmp/tb-signer/signer-cert.pem -noout -fingerprint -sha256 | awk -F= '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          test "$observed" = "$EXPECTED_SIGNER_SHA256"

      - name: Stage B sign and final verify
        env:
          CANDIDATE_COMMIT: ${{ steps.req.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tb-final"
          mkdir "$out"
          "$BT/zipalign" -f -p 4 "$UNSIGNED_APK" "$out/aligned.apk"
          PASS="$(cat /tmp/tb-signer/signer.pass)"
          printf '::add-mask::%s\n' "$PASS"
          export PASS
          "$BT/apksigner" sign --ks /tmp/tb-signer/signer.p12 --ks-type PKCS12 --ks-key-alias "$EXPECTED_ALIAS" --ks-pass env:PASS --key-pass env:PASS --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$out/touchbridge-0.1.0-alpha3.apk" "$out/aligned.apk"
          unset PASS
          rm "$out/aligned.apk"
          apk="$out/touchbridge-0.1.0-alpha3.apk"
          "$BT/apksigner" verify --verbose --print-certs "$apk" | tee "$out/apksigner.txt"
          cert="$("$BT/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
          test "$cert" = "$EXPECTED_SIGNER_SHA256"
          line="$("$BT/aapt" dump badging "$apk" | head -n1)"
          [[ "$line" == *"package: name='com.homayounisaghar.touchbridge'"* ]]
          [[ "$line" == *"versionCode='3'"* ]]
          [[ "$line" == *"versionName='0.1.0-alpha3'"* ]]
          "$BT/zipalign" -c -p 4 "$apk"
          unzip -t "$apk" >/dev/null
          signed_sha="$(sha256sum "$apk" | awk '{print $1}')"
          printf '{"package":"com.homayounisaghar.touchbridge","versionCode":3,"versionName":"0.1.0-alpha3","candidateCommit":"%s","unsignedSha256":"%s","signedSha256":"%s","signerCertificateSha256":"%s"}\n' "$CANDIDATE_COMMIT" "$UNSIGNED_SHA256" "$signed_sha" "$EXPECTED_SIGNER_SHA256" > "$out/manifest.json"
          echo "SIGNED_SHA256=$signed_sha"

      - name: Scrub signer
        if: always()
        run: rm -rf /tmp/tb-signer

      - uses: actions/upload-artifact@v4
        with:
          name: touchbridge-signed-alpha3
          path: ${{ runner.temp }}/tb-final/
          if-no-files-found: error
          retention-days: 30
