name: Onshape Protocol 0-1 Seq66 Qualification

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-protocol-0-1/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-protocol-0-1
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable protocol request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/onshape-protocol-0-1/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$action" == "qualify-seq66-protocol-0-1" ]] || exit 14
      - name: Qualify exact seq66 in isolated namespace
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/118-onshape-protocol-0-1-seq66.sh
