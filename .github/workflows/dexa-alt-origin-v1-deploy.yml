name: Dexa Alternate Origin DNS/TLS Probe V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-alt-origin-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-alt-origin-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate single immutable request and secret-free pinned script
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-alt-origin-v1/dexa-alt-origin-v1-20261104-v1.request
          script=qualification/dexa-alt-origin-v1-20261104/deploy_probe.py
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          grep -Fxq 'request_id=dexa-alt-origin-v1-20261104-v1' "$req"
          grep -Fxq 'source_repo=homayounisaghar/capability-fabric' "$req"
          grep -Fxq 'source_commit=25913933e0bd4f2c5d7aea543de06739c40f5107' "$req"
          [[ "$(wc -l < "$req")" -eq 3 ]]
          echo '504554f572f52b7f84d6a7d5ada721e65ae4a5f70f8f468e3b3e567e8ee78db3  qualification/dexa-alt-origin-v1-20261104/deploy_probe.py' | sha256sum -c -
          python3 -m py_compile "$script"
      - name: Configure existing pinned VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mkdir -m 700 "$RUNNER_TEMP/alt-origin-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/alt-origin-ssh/key"
          chmod 600 "$RUNNER_TEMP/alt-origin-ssh/key"
          read -r alg key extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$alg" == ssh-ed25519 && -n "$key" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$key" > "$RUNNER_TEMP/alt-origin-ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$key" >> "$RUNNER_TEMP/alt-origin-ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Install single-use diagnostic host, verify live TLS and existing Dexa
        shell: bash
        run: |
          set -euo pipefail
          dir=/home/cfserver/dexa-alt-origin-20261104
          opts=(-i "$RUNNER_TEMP/alt-origin-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/alt-origin-ssh/known_hosts")
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 700 $dir"
          scp "${opts[@]}" -P "$SSH_PORT" qualification/dexa-alt-origin-v1-20261104/deploy_probe.py "$VPS_SSH_USER@$VPS_HOST:$dir/deploy_probe.py"
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "if [ \$(id -u) -eq 0 ]; then chown -R cfserver:cfserver $dir; runuser -u cfserver -- python3 $dir/deploy_probe.py; else python3 $dir/deploy_probe.py; fi" </dev/null
          echo 'VERIFY_PUBLIC_DOMAIN_AND_ORIGINAL_SERVICES_DIRECTLY'
