name: Onshape UI Input Capability Proof

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/onshape-ui-input-capability-proof/*.request

permissions:
  contents: read

concurrency:
  group: personal-server-onshape-ui-input-capability-proof
  cancel-in-progress: false

jobs:
  prove:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable proof request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status path <<<"${changes[0]}"
          [[ "$status" == A && "$path" == server-bootstrap/control/onshape-ui-input-capability-proof/*.request ]] || exit 11
          request_id="$(basename "$path" .request)"
          file_id="$(awk -F= '$1=="request_id"{print $2}' "$path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$file_id" && "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 12
      - name: Mask host and login
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Prove generic UI input capability
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/98-onshape-ui-input-capability-proof.sh
