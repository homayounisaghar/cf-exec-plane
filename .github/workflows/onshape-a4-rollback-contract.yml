name: Onshape A4 Rollback Contract

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-a4-rollback-contract/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-a4-rollback-contract
  cancel-in-progress: false

jobs:
  prove:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable A4 request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/onshape-a4-rollback-contract/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$action" == "prove-a4-rollback-contract" ]] || exit 14

      - name: Test rollback contract state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 server-bootstrap/pull-agent/test_onshape_rollback_contract.py server-bootstrap/pull-agent/onshape_rollback_contract.py
          echo CF_A4_CONTRACT_TESTS=pass

      - name: Prove live rollback artifact and pre-PONR state
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/114-onshape-a4-rollback-contract-proof.sh
