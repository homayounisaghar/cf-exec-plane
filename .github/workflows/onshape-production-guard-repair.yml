name: Onshape Production Guard Fence Repair

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-production-guard-repair/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-production-guard-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable repair request and regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-production-guard-repair/*.request ]] || exit 11
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_guard_blob="$(awk -F= '$1=="expected_guard_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$action" == "repair-production-guard-fence-identity" ]] || exit 12
          [[ "$(git rev-parse "$GITHUB_SHA:server-bootstrap/145-onshape-production-guard-repair.sh")" == "$expected_script_blob" ]] || exit 13
          [[ "$(git rev-parse "$GITHUB_SHA:server-bootstrap/pull-agent/runtime_control_guard.py")" == "$expected_guard_blob" ]] || exit 14
          bash -n server-bootstrap/145-onshape-production-guard-repair.sh
          python3 server-bootstrap/pull-agent/test_runtime_control_guard.py server-bootstrap/pull-agent/runtime_control_guard.py
      - name: Repair host guard and mirror exact epoch6 authority
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/145-onshape-production-guard-repair.sh
