name: Shared Telemetry Reader v1

on:
  push:
    branches: [main]
    paths:
      - shared-telemetry/control/read/*.request

permissions:
  contents: read

jobs:
  read:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve immutable request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request file must be newly added" >&2; exit 11; }
          [[ "$request_path" == shared-telemetry/control/read/*.request ]] || { echo "unexpected request path" >&2; exit 12; }
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ && "$file_request_id" == "$request_id" ]] || { echo "bad request id" >&2; exit 13; }
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      - name: Load private reader binding
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CF_REPO_READ_TOKEN" ]] || { echo "private repo read token missing" >&2; exit 20; }
          api="https://api.github.com/repos/homayounisaghar/capability-fabric/contents/projects/shared-telemetry/private/reader-runtime-v1.json?ref=main"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp" "$tmp.json"' EXIT
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CF_REPO_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" > "$tmp"
          jq -r '.content' "$tmp" | tr -d '\n' | base64 -d > "$tmp.json"
          endpoint="$(jq -r '.endpoint' "$tmp.json")"
          app_id="$(jq -r '.app_id' "$tmp.json")"
          read_token="$(jq -r '.read_token' "$tmp.json")"
          [[ "$endpoint" == "https://shared-telemetry.mirkazem.workers.dev" ]] || { echo "unexpected endpoint" >&2; exit 21; }
          [[ "$app_id" == "webview-dashboard" ]] || { echo "unexpected app id" >&2; exit 22; }
          [[ "$read_token" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid read token shape" >&2; exit 23; }
          echo "::add-mask::$read_token"
          {
            echo "ENDPOINT=$endpoint"
            echo "APP_ID=$app_id"
            echo "READ_TOKEN=$read_token"
          } >> "$GITHUB_ENV"

      - name: Read latest run and events
        shell: bash
        run: |
          set -euo pipefail
          auth=( -H "Authorization: Bearer $READ_TOKEN" )
          curl --fail --silent --show-error --max-time 20 "${auth[@]}" \
            "$ENDPOINT/v1/runs/latest?app_id=$APP_ID" > /tmp/latest.json
          echo "CF_SHARED_TELEMETRY_LATEST=$(jq -c '.' /tmp/latest.json)"
          rid="$(jq -r '.latest_run.run_id // empty' /tmp/latest.json)"
          [[ -n "$rid" ]] || { echo "CF_SHARED_TELEMETRY_FOUND=0"; exit 0; }

          echo "CF_SHARED_TELEMETRY_READ_BEGIN"
          after=""
          total=0
          for page in $(seq 1 10); do
            url="$ENDPOINT/v1/events?app_id=$APP_ID&run_id=$rid&limit=500"
            if [[ -n "$after" ]]; then
              url="$url&after_seq=$after"
            fi
            curl --fail --silent --show-error --max-time 20 "${auth[@]}" "$url" > /tmp/events.json
            count="$(jq -r '.count // (.events|length)' /tmp/events.json)"
            total=$((total + count))
            jq -c '.events[]' /tmp/events.json | sed 's/^/CF_SHARED_TELEMETRY_EVENT=/'
            more="$(jq -r '.has_more // false' /tmp/events.json)"
            [[ "$more" == "true" ]] || break
            after="$(jq -r '.next_after_seq // empty' /tmp/events.json)"
            [[ -n "$after" ]] || { echo "pagination missing next_after_seq" >&2; exit 31; }
          done
          echo "CF_SHARED_TELEMETRY_READ_END"
          echo "CF_SHARED_TELEMETRY_TOTAL=$total"
          if [[ "$total" -gt 0 ]]; then
            echo "CF_SHARED_TELEMETRY_FOUND=1"
          else
            echo "CF_SHARED_TELEMETRY_FOUND=0"
          fi
