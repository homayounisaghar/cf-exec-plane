name: Onshape E9 Mate Reference Copy
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-e9-mate-copy/*.request'
permissions:
  contents: read
concurrency:
  group: onshape-r8-e9-mate
  cancel-in-progress: false
jobs:
  copy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-e9-mate-copy/*.request ]]
          bash -n server-bootstrap/209-onshape-e9-mate-copy.sh
      - name: Copy exact healthy mate reference privately
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/209-onshape-e9-mate-copy.sh
