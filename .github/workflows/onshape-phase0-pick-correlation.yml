name: Onshape Phase 0 Pick Geometry Correlation
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-phase0-pick-correlation/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-phase0-research-activate
  cancel-in-progress: false
jobs:
  correlate:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate request
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-phase0-pick-correlation/*.request ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == phase0-pick-correlation-v1 ]]
          grep -Fxq "#!/usr/bin/env bash" <(head -n 1 server-bootstrap/248-onshape-phase0-pick-correlation.sh)
      - name: Correlate pick and geometry state
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/248-onshape-phase0-pick-correlation.sh
