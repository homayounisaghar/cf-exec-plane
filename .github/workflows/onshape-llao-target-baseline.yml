name: Onshape LLAO Target Baseline

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-llao-target-baseline/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-llao-target-baseline
  cancel-in-progress: false

jobs:
  baseline:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable baseline request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-llao-target-baseline/*.request ]] || exit 11
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$file_request_id" == "$request_id" ]] || exit 12
          [[ "$action" == "inspect-llao-target-baseline" ]] || exit 13
          [[ "$expected_script_blob" == "2a8e25beb61d2c2de9c5408c08df35ef42ac1cff" ]] || exit 14
          [[ "$(git rev-parse "$GITHUB_SHA:server-bootstrap/222-onshape-llao-target-baseline.sh")" == "$expected_script_blob" ]] || exit 15
          bash -n server-bootstrap/222-onshape-llao-target-baseline.sh

      - name: Read current target baseline through semantic Fabric
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/222-onshape-llao-target-baseline.sh
