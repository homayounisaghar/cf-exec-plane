name: Onshape Disposable Target Finalize Closed

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-test-target-finalize/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-test-target-admission
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable finalizer request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-test-target-finalize/*.request ]] || exit 11
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_control_blob="$(awk -F= '$1=="expected_control_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$action" == "finalize-disposable-target-closed" ]] || exit 12
          [[ "$expected_control_blob" == "499a1372a0416d5f8d0bbcecbef39cee20373f5b" ]] || exit 13
          [[ "$(git rev-parse "$GITHUB_SHA:server-bootstrap/150-onshape-test-target-finalize.sh")" == "$expected_script_blob" ]] || exit 14
          bash -n server-bootstrap/150-onshape-test-target-finalize.sh
      - name: Finalize target exercise with guard closed
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/150-onshape-test-target-finalize.sh
