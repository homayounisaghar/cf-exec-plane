name: Onshape Activate Seq66 Quiesced

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-activate-seq66/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-activate-seq66
  cancel-in-progress: false

jobs:
  activate:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable activation request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-activate-seq66/*.request ]] || exit 11
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          canonical_commit="$(awk -F= '$1=="canonical_release_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 12
          [[ "$action" == "activate-seq66-while-quiesced" ]] || exit 13
          [[ "$canonical_commit" == "248c2f48baf0a850a9674eb2048a122d0132f882" ]] || exit 14
      - name: Activate exact seq66 while authority stays quiesced
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/122-onshape-activate-seq66-quiesced.sh
