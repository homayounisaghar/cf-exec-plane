name: Shared Telemetry Reader Binding Bootstrap

on:
  push:
    branches: [main]
    paths:
      - shared-telemetry/control/bootstrap-reader/*.request

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r st path <<<"${changes[0]}"
          [[ "$st" == A && "$path" == shared-telemetry/control/bootstrap-reader/*.request ]] || exit 11
      - name: Produce encrypted reader binding
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CF_REPO_READ_TOKEN" ]] || exit 20
          api="https://api.github.com/repos/homayounisaghar/capability-fabric/contents/projects/shared-telemetry/private/reader-runtime-v1.json?ref=a8787c2d0c1321d724021dfd4c5158fa9487fea2"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp" "$tmp.json" "$tmp.token"' EXIT
          curl --fail --silent --show-error --max-time 20             -H "Authorization: Bearer $CF_REPO_READ_TOKEN"             -H "Accept: application/vnd.github+json"             "$api" > "$tmp"
          jq -r '.content' "$tmp" | tr -d '\n' | base64 -d > "$tmp.json"
          jq -r '.read_token' "$tmp.json" > "$tmp.token"
          token="$(cat "$tmp.token")"
          [[ "$token" =~ ^[0-9a-f]{64}$ ]] || exit 21
          echo "::add-mask::$token"
          cipher="$(printf '%s' "$token" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -a -A -pass env:CF_REPO_READ_TOKEN)"
          [[ -n "$cipher" ]] || exit 22
          echo "CF_SHARED_TELEMETRY_READER_CIPHERTEXT=$cipher"
          echo "CF_SHARED_TELEMETRY_READER_BOOTSTRAP=PASS"
