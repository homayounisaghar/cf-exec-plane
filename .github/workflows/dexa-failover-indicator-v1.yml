name: Dexa Lite per-browser failover indicator (Lite-only)
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-failover-indicator-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-failover-indicator-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate single immutable request and pinned secret-free source
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-failover-indicator-v1/dexa-failover-indicator-v1-20261104-v1.request
          dir=qualification/dexa-failover-indicator-20261104
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          grep -Fxq 'request_id=dexa-failover-indicator-v1-20261104-v1' "$req"
          grep -Fxq 'source_repo=homayounisaghar/capability-fabric' "$req"
          [[ "$(wc -l < "$req")" -eq 3 ]]
          printf '%s  %s\n' \
            '7bf000e95c9a78f0787238c945ffaf6c941354a0dd920f605d0f06cacef4cc71' "$dir/lite-gateway.mjs" \
            'a93a57966e3f379d36db98585ebe687ae6e9aa59bf1b323376bcd7cc92b380a3' "$dir/deploy.sh" \
            'b45038d1946a7374e0e6e9a81f3ffe95db288b9dfcbfd75b9b6c6dcd6838421f' "$dir/test.mjs" | sha256sum -c -
          node --check "$dir/lite-gateway.mjs"
          node "$dir/test.mjs"
          bash -n "$dir/deploy.sh"
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mkdir -m 700 "$RUNNER_TEMP/dexa-lite-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/dexa-lite-ssh/key"
          chmod 600 "$RUNNER_TEMP/dexa-lite-ssh/key"
          read -r alg key extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$alg" == ssh-ed25519 && -n "$key" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$key" > "$RUNNER_TEMP/dexa-lite-ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$key" >> "$RUNNER_TEMP/dexa-lite-ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Install only updated Lite gateway and verify
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-failover-indicator-20261104
          remote=/tmp/dexa-failover-indicator-20261104
          opts=(-i "$RUNNER_TEMP/dexa-lite-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dexa-lite-ssh/known_hosts")
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 700 $remote"
          for f in lite-gateway.mjs deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$f" "$VPS_SSH_USER@$VPS_HOST:$remote/$f"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "if [ \$(id -u) -eq 0 ]; then chown -R cfserver:cfserver $remote; runuser -u cfserver -- bash $remote/deploy.sh; else bash $remote/deploy.sh; fi" </dev/null
          echo "VERIFY_LIVE_SERVICE_EXTERNALLY"
