name: Onshape E9 Failure Log Read
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-e9-failure-log/*.request']
permissions: {contents: read}
jobs:
  read:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/186-onshape-e9-failure-log.sh
