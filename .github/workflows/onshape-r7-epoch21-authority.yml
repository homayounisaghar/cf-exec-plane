name: Onshape R7 Epoch21 Authority Sync
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-r7-epoch21-authority/*.request'
permissions:
  contents: read
concurrency:
  group: onshape-r7-e9-mate
  cancel-in-progress: false
jobs:
  authority:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-r7-epoch21-authority/*.request ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "sync-r7-epoch21-authority" ]]
          bash -n server-bootstrap/202-onshape-r7-epoch21-authority.sh
      - name: Sync exact r7 production authority
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/202-onshape-r7-epoch21-authority.sh
