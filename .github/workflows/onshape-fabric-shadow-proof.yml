name: Onshape Fabric Shadow Semantic Proof

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/onshape-fabric-shadow-proof/*.request

permissions:
  contents: read

concurrency:
  group: personal-server-onshape-fabric-shadow-proof
  cancel-in-progress: false

jobs:
  prove:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable shadow-proof request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/onshape-fabric-shadow-proof/*.request ]] || exit 12
          request_id="$(basename "$request_path" .request)"
          file_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$file_id" && "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 13
      - name: Mask host and login
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)
      - name: Run semantic shadow proof
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/95-onshape-fabric-shadow-proof.sh
