name: Personal Agent OS v8 single-file controlled deploy
on:
  push:
    branches: [main]
    paths:
      - "server-bootstrap/control/agentos-v8-deploy/*.request"
permissions:
  contents: read
concurrency:
  group: agentos-v8-live-ingress
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate single immutable deployment request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")
          [[ "${#changes[@]}" == 1 ]] || exit 20
          IFS=$'\t' read -r status req <<< "${changes[0]}"
          [[ "$status" == A && "$req" == server-bootstrap/control/agentos-v8-deploy/*.request ]] || exit 21
          id="$(awk -F= '$1=="request_id"{print $2}' "$req" | tr -d '[:space:]')"
          parent="$(awk -F= '$1=="candidate_commit"{print $2}' "$req" | tr -d '[:space:]')"
          old="$(awk -F= '$1=="expected_old_service_sha256"{print $2}' "$req" | tr -d '[:space:]')"
          [[ "$id" == "$(basename "$req" .request)" && "$id" =~ ^[a-z0-9-]{8,90}$ ]] || exit 22
          [[ "$parent" == "$(git rev-parse "$GITHUB_SHA^")" ]] || exit 23
          [[ "$old" =~ ^[0-9a-f]{64}$ ]] || exit 24
          python3 - <<'PY'
          import json
          x=json.load(open("staging/personal-agent-os-v8/output/backend-tests.json"))
          assert x["result"]=="PASS" and x["test_count"]>=50
          PY
          echo "DEPLOY_ID=$id" >> "$GITHUB_ENV"
          echo "OLD_SHA=$old" >> "$GITHUB_ENV"
      - name: Re-qualify unchanged public source before remote access
        shell: bash
        run: |
          set -euo pipefail
          cd staging/personal-agent-os-v8/backend
          python3 -m unittest -q test_service test_telemetry test_work_runtime_v8
          cd ..
          tar -czf "$RUNNER_TEMP/agentos-v8-backend.tgz" backend
      - name: Setup strictly pinned owner SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 31
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 32
          dir="$RUNNER_TEMP/agentos-v8-ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"
          chmod 0600 "$dir/key"
          key="${VPS_HOST_KEY//$'\r'/}"
          read -r alg material extra <<< "$key"
          [[ "$alg" == ssh-ed25519 && -n "$material" && -z "${extra:-}" ]] || exit 33
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$material" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$material" >> "$dir/known_hosts"
          chmod 0600 "$dir/known_hosts"
          echo "SSH_DIR=$dir" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Controlled one-service deploy and rollback
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/agentos-v8-activate.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          TARGET=/home/cfserver/.local/share/personal-agent-os/ingress-v1
          UNIT=personal-agent-os-alpha4-ingress.service
          DB="$TARGET/data/commands.sqlite"
          if [[ "$(id -un)" == cfserver ]]; then
            svc(){ systemctl --user "$@"; }
            ownercopy(){ install -m 0600 "$1" "$2"; }
          elif [[ "$(id -u)" -eq 0 ]]; then
            svc(){ runuser -u cfserver -- env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus systemctl --user "$@"; }
            ownercopy(){ install -o cfserver -g cfserver -m 0600 "$1" "$2"; }
          else
            echo "UNEXPECTED_DEPLOY_USER"; exit 38
          fi
          [[ -f "$TARGET/service.py" && -f "$TARGET/telemetry.py" && -f "$DB" ]] || exit 39
          [[ ! -e "$TARGET/work_runtime_v8.py" ]] || { echo "V8_ALREADY_DEPLOYED_OR_UNKNOWN"; exit 40; }
          [[ "$(sha256sum "$TARGET/service.py" | cut -d ' ' -f1)" == "$OLD_SHA" ]] || { echo "LIVE_SERVICE_CHANGED"; exit 41; }
          [[ "$(svc is-active "$UNIT")" == active ]] || exit 42
          STAGE="$(mktemp -d /tmp/agentos-v8-deploy.XXXXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          tar -xzf "/tmp/$DEPLOY_ID-source.tgz" -C "$STAGE"
          cmp -s "$STAGE/backend/telemetry.py" "$TARGET/telemetry.py" || { echo "LIVE_TELEMETRY_DRIFT"; exit 43; }
          (cd "$STAGE/backend" && python3 -m unittest -q test_service test_telemetry test_work_runtime_v8)
          cp "$TARGET/service.py" "$STAGE/service-previous.py"
          swapped=0
          rollback() {
            rc=$?
            trap - ERR
            if [[ "$swapped" == 1 ]]; then
              ownercopy "$STAGE/service-previous.py" "$TARGET/service.py"
              rm -f "$TARGET/work_runtime_v8.py"
              svc restart "$UNIT" || true
              echo "AGENTOS_V8_ROLLBACK_ATTEMPTED"
            fi
            exit "$rc"
          }
          trap rollback ERR
          ownercopy "$STAGE/backend/work_runtime_v8.py" "$TARGET/work_runtime_v8.py"
          swapped=1
          ownercopy "$STAGE/backend/service.py" "$TARGET/service.py"
          svc restart "$UNIT"
          [[ "$(svc is-active "$UNIT")" == active ]]
          curl -fsS --max-time 5 "http://127.0.0.1:18765/agentos-alpha4/health" | grep -q '"status":"READY"'
          [[ "$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/agentos-alpha4/v4/board)" == 401 ]]
          echo "AGENTOS_V8_INGRESS_ACTIVE_SERVICE_ONLY"
          REMOTE
          chmod 0700 "$RUNNER_TEMP/agentos-v8-activate.sh"
          scp -q -i "$SSH_DIR/key" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" "$RUNNER_TEMP/agentos-v8-backend.tgz" "${VPS_SSH_USER}@${VPS_HOST}:/tmp/$DEPLOY_ID-source.tgz"
          scp -q -i "$SSH_DIR/key" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" "$RUNNER_TEMP/agentos-v8-activate.sh" "${VPS_SSH_USER}@${VPS_HOST}:/tmp/$DEPLOY_ID-activate.sh"
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" "${VPS_SSH_USER}@${VPS_HOST}" "OLD_SHA='$OLD_SHA' DEPLOY_ID='$DEPLOY_ID' bash /tmp/$DEPLOY_ID-activate.sh; rc=\$?; rm -f /tmp/$DEPLOY_ID-activate.sh /tmp/$DEPLOY_ID-source.tgz; exit \$rc" </dev/null
