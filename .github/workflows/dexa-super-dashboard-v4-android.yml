name: Dexa Super Dashboard Android v4 unsigned
on:
  push:
    branches:
      - work/dexa-super-dashboard-v4-20261105
    paths:
      - 'dexa-superapp/control/build-v4/*.request'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Verify immutable build request
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" | wc -l)" -eq 1
          request="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
          [[ "$request" == dexa-superapp/control/build-v4/*.request ]]
          test "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA" | cut -f1)" = A
          grep -qx 'action=build-dexa-super-dashboard-v4' "$request"
          expected=$(awk -F= '$1=="snapshot_sha"{print $2}' "$request")
          test "$expected" = "$(git rev-parse "$GITHUB_SHA^")"
          test "$(find dexa-superapp/android -name '*.p12' -o -name '*password*' | wc -l)" -eq 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build release unsigned APK and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if ! gradle --no-daemon -p dexa-superapp/android :app:assembleRelease > dist/gradle-build.log 2>&1; then
            tail -n 120 dist/gradle-build.log > dist/v4-build-failure.txt
            cat dist/v4-build-failure.txt
            exit 1
          fi
          output="dexa-superapp/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$output"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$output" dist/dexa-super-dashboard-v4-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 dist/dexa-super-dashboard-v4-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/dexa-super-dashboard-v4-unsigned-aligned.apk > dist/badging.txt
          grep -q "package: name='com.homayounisaghar.dexasuperdashboard' versionCode='4' versionName='1.2.0'" dist/badging.txt
          unzip -t dist/dexa-super-dashboard-v4-unsigned-aligned.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/dexa-super-dashboard-v4-unsigned-aligned.apk > dist/permissions.txt
          grep -q 'android.permission.READ_SMS' dist/permissions.txt
          grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' dist/permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' dist/permissions.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' dexa-superapp/android/app/src/main/AndroidManifest.xml
          sha256sum dist/dexa-super-dashboard-v4-unsigned-aligned.apk > dist/unsigned.sha256
          printf '%s\n' "$GITHUB_SHA" > dist/build_request_sha.txt
          printf '%s\n' "$(git rev-parse "$GITHUB_SHA^")" > dist/snapshot_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dexa-super-dashboard-v4-unsigned
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Public download of unsigned compilation output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "dexa-super-dashboard-v4-unsigned-20261105" \
            dist/dexa-super-dashboard-v4-unsigned-aligned.apk \
            dist/unsigned.sha256 dist/badging.txt dist/permissions.txt dist/build_request_sha.txt dist/snapshot_sha.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dexa Super Dashboard v4 - unsigned build input" \
            --notes "Unsigned CI artifact. Not installable. Signed separately by the owner-held durable signer."

      - name: Publish bounded secret-free compile failure evidence
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p dist
          if [ ! -s dist/v4-build-failure.txt ]; then
            printf '%s\n' 'CI did not reach Java/Gradle compile or failure log was unavailable. Inspect source/build bootstrap independently.' > dist/v4-build-failure.txt
          fi
          gh release create "dexa-super-dashboard-v4-build-diagnostic-c-20261105" dist/v4-build-failure.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dexa Super Dashboard v4 diagnostic (not installable)" \
            --notes "Secret-free bounded Android compile failure evidence. No APK produced by this diagnostic."
