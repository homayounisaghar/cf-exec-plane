name: Onshape Migration Finalize VPS

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-migration-finalize/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-real-rollback-drill
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable finalizer request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-migration-finalize/*.request ]] || exit 11
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_control_blob="$(awk -F= '$1=="expected_control_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 12
          [[ "$action" == "finalize-vps-migration-after-rollback-drill" ]] || exit 13
          [[ "$expected_control_blob" == "6ac33244f7968c142e30b2f815d090f74dac49f3" ]] || exit 14
          [[ "$(git rev-parse "$GITHUB_SHA:server-bootstrap/155-onshape-migration-finalize-vps.sh")" == "$expected_script_blob" ]] || exit 15
          bash -n server-bootstrap/155-onshape-migration-finalize-vps.sh
      - name: Finalize VPS production after real rollback drill
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/155-onshape-migration-finalize-vps.sh
