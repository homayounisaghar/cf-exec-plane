name: CF WeChat r268 Local Stream Dry-Run Guarded Release
on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/cf-wechat-stream-r268/*.request
permissions:
  contents: read
concurrency:
  group: cf-wechat-stream-r268
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNAP: qualification/cf-wechat-stream-r268/9f72bcbbedf08d293b8285e2b8d19d81a9895605
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exactly one immutable owner instruction
        shell: bash
        run: |
          set -euo pipefail
          request=server-bootstrap/control/cf-wechat-stream-r268/cf-wechat-stream-r268-20261031-v1.request
          [[ "$(git diff --name-status HEAD^ HEAD)" == "$(printf 'A\t%s' "$request")" ]] || exit 10
          [[ "$(wc -l < "$request")" -eq 4 ]] || exit 11
          grep -Fxq 'request_id=cf-wechat-stream-r268-20261031-v1' "$request"
          grep -Fxq 'candidate_commit=9f72bcbbedf08d293b8285e2b8d19d81a9895605' "$request"
          grep -Fxq 'expected_sequence=268' "$request"
          grep -Fxq 'expected_release=onshape-vps-fast-r100-direct-orbit1-paa-storage-r268-wechat-stream-dryrun-20261031' "$request"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify minimal secret-free snapshot and dry-run-only tool gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$SNAP"
          printf '%s  %s\n' '7616d1f4c400c8c4f1483b6ea0ad93ea2e8cb071bbb00aedc24b43d2b7e0fd97' wechat-media-tools.mjs | sha256sum -c -
          printf '%s  %s\n' '281aa17eb6916e52276e4b92bb65bbc1e7858be2ca86c6133a491e035c4ac390' wechat_media_cache_adapter_v1.mjs | sha256sum -c -
          printf '%s  %s\n' '186fcc8101d249af8a96fb31f396130b09b01f35fada54886f6932231b2469d7' manifest.json | sha256sum -c -
          printf '%s  %s\n' 'adb2f9a0004d763767330347d2bc5e2800b4e385777ef93b3d793e7b373d0898' release-closure.json | sha256sum -c -
          printf '%s  %s\n' '97347ee1af75cc895a4fabd2dbd921f075632727eff54bd27fc54c48743af18a' test_r267_stable_public.mjs | sha256sum -c -
          printf '%s  %s\n' 'd6dac5fc2715bfb0512acd191609b346a6b6e66538b5a6685f8f05d2922963a6' test_wechat_file_dryrun_bridge.mjs | sha256sum -c -
          printf '%s  %s\n' 'f5481b03017bfd433876d2f05ad69e8c58558d393871f805c29f6c26c5eae379' wechat_semantic_helper_r268_stream_dryrun.py | sha256sum -c -
          printf '%s  %s\n' 'e31a36fdc1ece467875c94ace800c003051114c3b56ccec1096a8f489f9cf100' test_wechat_helper_r268_stream_dryrun.py | sha256sum -c -
          printf '%s  %s\n' '3d1178b8e7bcb3e8fdd54dad2989ed436e3ef7b356bd7057028a598e70b12791' activate-cf-r268-stream-dryrun-guarded.sh | sha256sum -c -
          node --check wechat-media-tools.mjs
          python3 -m py_compile wechat_semantic_helper_r268_stream_dryrun.py
          bash -n activate-cf-r268-stream-dryrun-guarded.sh
          node --test test_r267_stable_public.mjs test_wechat_file_dryrun_bridge.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          c=json.loads(Path('release-closure.json').read_text())
          assert m['sequence']==268
          assert m['release_id']=='onshape-vps-fast-r100-direct-orbit1-paa-storage-r268-wechat-stream-dryrun-20261031'
          assert c['build_id']==m['release_id']
          assert len(m['files'])==32 and set(c['files'])==set(m['files'])
          assert m['files']['wechat-media-tools.mjs']=='7616d1f4c400c8c4f1483b6ea0ad93ea2e8cb071bbb00aedc24b43d2b7e0fd97'
          print('CF_WECHAT_R268_STREAM_DRYRUN_SOURCE_PASS')
          PY
          tar -czf "$RUNNER_TEMP/cf-wechat-stream-r268-bundle.tgz" \
            wechat-media-tools.mjs wechat_media_cache_adapter_v1.mjs manifest.json release-closure.json \
            test_r267_stable_public.mjs test_wechat_file_dryrun_bridge.mjs \
            wechat_semantic_helper_r268_stream_dryrun.py test_wechat_helper_r268_stream_dryrun.py
      - name: Execute guarded scoped release via pinned owner SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 21
          dir="$RUNNER_TEMP/wechat-stream-r268-ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"
          chmod 0600 "$dir/key"
          read -r key_type key_data extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$dir/known_hosts"
          chmod 0600 "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          scp "${transport[@]}" -P "$port" "$RUNNER_TEMP/cf-wechat-stream-r268-bundle.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-wechat-stream-r268-bundle.tgz"
          scp "${transport[@]}" -P "$port" "$SNAP/activate-cf-r268-stream-dryrun-guarded.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/activate-cf-wechat-stream-r268-guarded.sh"
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" \
            'set -e; test "$(id -u)" = 0; set +e; bash /tmp/activate-cf-wechat-stream-r268-guarded.sh > /tmp/cf-wechat-stream-r268-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/cf-wechat-stream-r268-diagnostic.log; chmod 0640 /tmp/cf-wechat-stream-r268-diagnostic.log; exit "$rc"' </dev/null
          echo CF_WECHAT_STREAM_R268_GUARDED_SCRIPT_INVOKED_CONFIRM_LIVE_SERVER
