name: Dexa Read Plan V2 Bounded Queries and Verified Unread Outputs
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-chat-read-plan-v2/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-chat-read-plan-v2
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable retry request and exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-chat-read-plan-v2-20261101
          req=server-bootstrap/control/dexa-chat-read-plan-v2/dexa-chat-read-plan-v2-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 4 ]]
          grep -Fxq 'request_id=dexa-chat-read-plan-v2-20261101-v1' "$req"
          grep -Fxq 'source_commit=a0694eb4d7f4ba73d5a6433a058d8185eefb7ca5' "$req"
          grep -Fxq 'manifest_sha=4ec557ca9b2e6e003a6a79e40ce40fd4c3528a45' "$req"
          grep -Fxq 'deploy_sha=43f3959c8dab0fac0151e0be381fa6590ee53526' "$req"
          [[ "$(git hash-object "$dir/manifest.json")" == "4ec557ca9b2e6e003a6a79e40ce40fd4c3528a45" ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == "43f3959c8dab0fac0151e0be381fa6590ee53526" ]]
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('qualification/dexa-chat-read-plan-v2-20261101')
          m=json.loads((root/'manifest.json').read_text())
          assert m['source_commit']=='a0694eb4d7f4ba73d5a6433a058d8185eefb7ca5'
          assert len(m['files'])==4
          for rel,v in m['files'].items():
           assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==v['candidate'],rel
          print('READ_PLAN_SNAPSHOT_4_VERIFIED')
          PY
          bash -n "$dir/deploy.sh"
      - name: Pin and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Guarded Dexa-only runtime deploy, preserve WeChat and exact source hash
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          remote=/tmp/dexa-chat-read-plan-v2-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'mkdir -p -m 755 /tmp/dexa-chat-read-plan-v2-20261101/dexa'
          for file in manifest.json deploy.sh dexa/dexa_catalog_output_shapes_v1.json dexa/dexa_general_plan_cycle_v2.mjs dexa/test_dexa_chat_semantic_planner_v1.mjs dexa/test_dexa_unread_output_contract_v2.mjs; do
            scp "${opts[@]}" -P "$SSH_PORT" "qualification/dexa-chat-read-plan-v2-20261101/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'bash /tmp/dexa-chat-read-plan-v2-20261101/deploy.sh' </dev/null
