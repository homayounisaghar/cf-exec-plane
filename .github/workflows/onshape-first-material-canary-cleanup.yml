name: Onshape First Material Canary Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-first-material-canary-cleanup/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-first-material-canary-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable cleanup request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-first-material-canary-cleanup/*.request ]] || exit 11
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_control_blob="$(awk -F= '$1=="expected_control_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          canary_operation_id="$(awk -F= '$1=="canary_operation_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          canary_attempt_id="$(awk -F= '$1=="canary_attempt_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          canary_document_id="$(awk -F= '$1=="canary_document_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 12
          [[ "$action" == "cleanup-achieved-first-material-canary" ]] || exit 13
          [[ "$expected_control_blob" == "81f73bb89c5517080a80ada3047c58c287874c50" ]] || exit 14
          [[ "$canary_operation_id" == "operation:3a454a8a-9d5e-491a-b13e-739c01d32d49" ]] || exit 15
          [[ "$canary_attempt_id" == "attempt:d425487d-17e0-4b4b-a811-439f76e5b796" ]] || exit 16
          [[ "$canary_document_id" == "84d077d8370c21c4b3045263" ]] || exit 17
          actual_script_blob="$(git rev-parse "$GITHUB_SHA:server-bootstrap/132-onshape-first-material-canary-cleanup.sh")"
          [[ "$actual_script_blob" == "$expected_script_blob" ]] || exit 18
          bash -n server-bootstrap/132-onshape-first-material-canary-cleanup.sh
          awk '/<<'"'"'NODE'"'"'/{capture=1;next} /^NODE$/{if(capture){exit}} capture' server-bootstrap/132-onshape-first-material-canary-cleanup.sh > /tmp/canary-cleanup.mjs
          [[ -s /tmp/canary-cleanup.mjs ]] || exit 19
          node --check /tmp/canary-cleanup.mjs
      - name: Restore original document name and prove cleanup
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/132-onshape-first-material-canary-cleanup.sh
