name: PCG WeChat Semantic Refresh

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-wechat-semantic-refresh/*.request

permissions:
  contents: read

concurrency:
  group: pcg-wechat-semantic-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/pcg-wechat-semantic-refresh/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]] || exit 14
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"

      - name: Fetch exact private helper
        env:
          CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
          CANDIDATE_COMMIT: ${{ steps.request.outputs.candidate_commit }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CF_REPO_READ_TOKEN:?missing private repo token}"
          work="${RUNNER_TEMP}/wechat-semantic-refresh"
          git init "$work" >/dev/null
          askpass="${RUNNER_TEMP}/askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$CF_REPO_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$work" fetch --quiet --depth=1 https://github.com/homayounisaghar/capability-fabric.git "$CANDIDATE_COMMIT"
          [[ "$(git -C "$work" rev-parse FETCH_HEAD)" == "$CANDIDATE_COMMIT" ]]
          out="$work/out"; mkdir "$out"
          base="server-deploy/channels/pcg/provider-runtime"
          for f in wechat_semantic_helper.py wechat_semantic_helper.sh capability-fabric-pcg-wechat-semantic.service; do
            git -C "$work" show "FETCH_HEAD:$base/$f" > "$out/$f"
          done
          python3 -m py_compile "$out/wechat_semantic_helper.py"
          bash -n "$out/wechat_semantic_helper.sh"
          tar -C "$out" -czf "${RUNNER_TEMP}/wechat-semantic-refresh.tgz" .

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          tmp="${RUNNER_TEMP}/ssh"
          install -d -m 0700 "$tmp"
          printf '%s\n' "$VPS_SSH_KEY" > "$tmp/key"
          chmod 0600 "$tmp/key"
          read -r hkt hkd extra <<< "${VPS_HOST_KEY//$'\r'/}"
          [[ "$hkt" == ssh-ed25519 && -n "$hkd" && -z "${extra:-}" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$hkt" "$hkd" > "$tmp/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$hkt" "$hkd" >> "$tmp/known_hosts"
          echo "SSH_DIR=$tmp" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Upload and activate helper only
        env:
          CANDIDATE_COMMIT: ${{ steps.request.outputs.candidate_commit }}
        shell: bash
        run: |
          set -euo pipefail
          scp -q -i "$SSH_DIR/key" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" "${RUNNER_TEMP}/wechat-semantic-refresh.tgz" "${VPS_SSH_USER}@${VPS_HOST}:/tmp/wechat-semantic-refresh.tgz"
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" "${VPS_SSH_USER}@${VPS_HOST}" "CANDIDATE_COMMIT='$CANDIDATE_COMMIT' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$(id -u)" -eq 0 ]]
          final=capability-fabric-pcg-wechat.service
          semantic=capability-fabric-pcg-wechat-semantic.service
          runtime=/usr/local/lib/capability-fabric/pcg-provider-runtime
          systemctl is-active --quiet "$final"
          before_pid="$(systemctl show "$final" -p MainPID --value)"
          stage=/tmp/wechat-semantic-refresh-stage
          rm -rf "$stage"; mkdir -m 0700 "$stage"
          tar -xzf /tmp/wechat-semantic-refresh.tgz -C "$stage"
          rm -f /tmp/wechat-semantic-refresh.tgz
          install -m 0644 -o root -g root "$stage/wechat_semantic_helper.py" "$runtime/wechat_semantic_helper.py"
          install -m 0755 -o root -g root "$stage/wechat_semantic_helper.sh" "$runtime/wechat_semantic_helper.sh"
          install -m 0644 -o root -g root "$stage/capability-fabric-pcg-wechat-semantic.service" /etc/systemd/system/capability-fabric-pcg-wechat-semantic.service
          rm -rf "$stage"
          systemctl daemon-reload
          systemctl enable "$semantic" >/dev/null
          systemctl restart "$semantic"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:9337/status >/tmp/wechat-semantic-status.json 2>/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/wechat-semantic-status.json"))
          assert p.get("ok") is True and p.get("provider")=="wechat" and p.get("authenticated") is True
          PY
          after_pid="$(systemctl show "$final" -p MainPID --value)"
          [[ "$before_pid" == "$after_pid" && -n "$after_pid" ]]
          python3 - "$CANDIDATE_COMMIT" "$before_pid" <<'PY'
          import json,sys,time
          out={"ok":True,"candidate_commit":sys.argv[1],"wechat_main_pid":int(sys.argv[2]),"wechat_restarted":False,"semantic_status":"authenticated","written_at":int(time.time())}
          open("/var/lib/capability-fabric/paa-remote/pcg-wechat-semantic-refresh-proof.json","w").write(json.dumps(out,separators=(",",":")))
          PY
          chown paa_remote:paa_remote /var/lib/capability-fabric/paa-remote/pcg-wechat-semantic-refresh-proof.json
          chmod 0600 /var/lib/capability-fabric/paa-remote/pcg-wechat-semantic-refresh-proof.json
          REMOTE
