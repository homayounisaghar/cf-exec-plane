name: Dexa Kata CF187 Catalog Refresh
on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/dexa-kata-sync/*.request
permissions:
  contents: read
concurrency:
  group: dexa-kata-cf187-refresh
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      SNAP: qualification/dexa-kata-sync/a99f978322530bdcc6c5af6d7883f0f72899520b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit one immutable request and pinned catalog source
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")"
          [[ "$changed" == $'A\tserver-bootstrap/control/dexa-kata-sync/dexa-kata-cf187-20261026-v1.request' ]] || exit 11
          req=server-bootstrap/control/dexa-kata-sync/dexa-kata-cf187-20261026-v1.request
          grep -Fxq 'request_id=dexa-kata-cf187-20261026-v1' "$req"
          grep -Fxq 'candidate_commit=a99f978322530bdcc6c5af6d7883f0f72899520b' "$req"
          grep -Fxq 'expected_release=dexa-kata-cf187-20261026-v1' "$req"
          grep -Fxq 'manifest_sha256=ba40bc6b45c5c3332f0e9b4c1b98e73bc196dde09a2e39e1a96251b96d4af269' "$req"
          [[ "$(wc -l < "$req")" -eq 4 ]] || exit 12
          printf '%s  %s\n' ba40bc6b45c5c3332f0e9b4c1b98e73bc196dde09a2e39e1a96251b96d4af269 "$SNAP/manifest.json" | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          r=pathlib.Path(os.environ["SNAP"])
          m=json.loads((r/"manifest.json").read_text())
          assert m["schema"]=="dexa.kata-refresh.secret-free.v1"
          assert m["source_repo"]=="homayounisaghar/capability-fabric"
          assert m["source_ref"]=="work/dexa-autonomous-loop-20261020"
          assert m["source_commit"]=="a99f978322530bdcc6c5af6d7883f0f72899520b"
          assert m["release_id"]=="dexa-kata-cf187-20261026-v1"
          assert m["current_cf_tools"]==187 and m["new_catalog"]==291
          expected={"capabilities.patch","translations.patch","runtime.patch","tests.patch",
            "schema_delta.json","test_dexa_kata_asr_refresh_20261026.mjs",
            "apply_schema_delta.py","deploy-kata.sh","activate-kata.sh"}
          assert set(m["patch_sha"])==expected
          assert len(m["old_sha"])==12 and len(m["new_sha"])==13
          for name,h in m["patch_sha"].items():
            p=r/name
            assert p.is_file() and not p.is_symlink()
            assert hashlib.sha256(p.read_bytes()).hexdigest()==h,name
          print("KATA_SNAPSHOT_VERIFIED",len(m["patch_sha"]))
          PY
          bash -n "$SNAP/deploy-kata.sh"
          sh -n "$SNAP/activate-kata.sh"
          python3 -m py_compile "$SNAP/apply_schema_delta.py"
          tar -czf "$RUNNER_TEMP/dexa-kata-cf187-20261026-v1.tgz" -C "$SNAP" .
      - name: Prepare strict pinned owner SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]] || exit 21
          port="$VPS_PORT";test -n "$port" || port=22
          case "$port" in *[!0-9]*) exit 22 ;; esac
          dir="$RUNNER_TEMP/ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"
          chmod 0600 "$dir/key"
          read -r key_type key_data extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]] || exit 23
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$dir/known_hosts"
          echo "SSH_DIR=$dir" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Deliver scoped source and safely restart Dexa catalog and main
        shell: bash
        run: |
          set -euo pipefail
          transport=(-i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          scp "${transport[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/dexa-kata-cf187-20261026-v1.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/dexa-kata-cf187-20261026-v1.tgz"
          scp "${transport[@]}" -P "$SSH_PORT" "$SNAP/activate-kata.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/dexa-kata-cf187-20261026-v1-activate.sh"
          ssh "${transport[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'sh /tmp/dexa-kata-cf187-20261026-v1-activate.sh dexa-kata-cf187-20261026-v1' </dev/null
          echo DEXA_KATA_SCOPED_DEPLOY_COMPLETED
      - name: Verify actual Dexa health rather than workflow completion
        shell: bash
        run: |
          set -euo pipefail
          transport=(-i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          ssh "${transport[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'curl -fsS --max-time 6 http://127.0.0.1:9471/healthz | node -e '"'"'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const d=JSON.parse(s);if(!d.ok||d.activeMissions!==0||d.deploymentDrain?.active||d.storedMissions<308)process.exit(4);console.log("DEXA_KATA_LIVE_HEALTH_OK missions="+d.storedMissions)})'"'"'' </dev/null
