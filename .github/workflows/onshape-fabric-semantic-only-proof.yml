name: Onshape Fabric Semantic-Only Surface Proof

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/onshape-fabric-semantic-only-proof/*.request

permissions:
  contents: read

jobs:
  prove:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable semantic-only proof request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status path <<<"${changes[0]}"
          [[ "$status" == A && "$path" == server-bootstrap/control/onshape-fabric-semantic-only-proof/*.request ]] || exit 11
      - name: Mask endpoint
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Prove isolated semantic-only public catalog
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/97-onshape-fabric-semantic-only-proof.sh
