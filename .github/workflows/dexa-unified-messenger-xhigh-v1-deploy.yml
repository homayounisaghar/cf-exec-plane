name: Dexa Unified Messenger and Qwen XHigh Release
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-unified-messenger-xhigh-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-unified-messenger-xhigh-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable retry request and exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-unified-messenger-xhigh-v1-20261101
          req=server-bootstrap/control/dexa-unified-messenger-xhigh-v1/dexa-unified-messenger-xhigh-v1-20261101-v2.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 4 ]]
          grep -Fxq 'request_id=dexa-unified-messenger-xhigh-v1-20261101-v2' "$req"
          grep -Fxq 'source_commit=5042d059ebb59fb581a2309965b314f4d68b00b9' "$req"
          grep -Fxq 'manifest_sha=f58c5fd12d8bbc42b959ffac2ddcbd7b217ecd90' "$req"
          grep -Fxq 'deploy_sha=64bba373921c8760dbd10a9bedbb0c9e2bf16d29' "$req"
          [[ "$(git hash-object "$dir/manifest.json")" == "f58c5fd12d8bbc42b959ffac2ddcbd7b217ecd90" ]]
          [[ "$(git hash-object "$dir/deploy-v2.sh")" == "64bba373921c8760dbd10a9bedbb0c9e2bf16d29" ]]
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('qualification/dexa-unified-messenger-xhigh-v1-20261101')
          m=json.loads((root/'manifest.json').read_text())
          assert m['source_commit']=='5042d059ebb59fb581a2309965b314f4d68b00b9'
          assert len(m['files'])==7
          for rel,v in m['files'].items():
           assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==v['candidate'],rel
          print('UNIFIED_MESSENGER_SNAPSHOT_7_VERIFIED')
          PY
          [[ "$(git hash-object "$dir/delta.json")" == 'd42529ecdae288018506ed21817548dffc2cc0df' ]]
          bash -n "$dir/deploy-v2.sh"
      - name: Pin and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Guarded Dexa unified messenger 298 catalog and Qwen xhigh with rollback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          remote=/tmp/dexa-unified-messenger-xhigh-v1-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'mkdir -p -m 755 /tmp/dexa-unified-messenger-xhigh-v1-20261101/dexa'
          for file in manifest.json deploy-v2.sh delta.json dexa/kata_rank.py dexa/dexa_messaging_record_contract_v1.mjs dexa/cerebras_api_planner.mjs dexa/test_dexa_cerebras_api_planner_v1.mjs dexa/test_dexa_universal_unread_contract_v1.mjs dexa/test_dexa_unified_provider_scope_v1.py dexa/test_dexa_wechat_message_list_v1.mjs; do
            scp "${opts[@]}" -P "$SSH_PORT" "qualification/dexa-unified-messenger-xhigh-v1-20261101/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'set +e; bash /tmp/dexa-unified-messenger-xhigh-v1-20261101/deploy-v2.sh > /tmp/dexa-unified-messenger-v1-20261101-v2-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/dexa-unified-messenger-v1-20261101-v2-diagnostic.log; chmod 0640 /tmp/dexa-unified-messenger-v1-20261101-v2-diagnostic.log; exit "$rc"' </dev/null
