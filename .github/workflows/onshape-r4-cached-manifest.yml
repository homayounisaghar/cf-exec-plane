name: Onshape R4 Cached Manifest Compute

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-r4-cached-manifest/*.request'

permissions:
  contents: read

jobs:
  compute:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-r4-cached-manifest/*.request ]] || exit 11
          [[ "$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "compute-r4-manifest-from-cache" ]] || exit 12
          [[ "$(awk -F= '$1=="private_head"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "d109fd506af171a4829fdff5bbd1a3b1de07c5e9" ]] || exit 13
      - name: Compute manifest from exact cached private head
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/135-onshape-r4-cached-manifest.sh
