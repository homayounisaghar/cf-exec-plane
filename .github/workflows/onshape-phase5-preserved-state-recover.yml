name: Onshape Phase 5 Preserved State Recover
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-phase5-preserved-state-recover/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-production-maintenance
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-phase5-preserved-state-recover/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-phase5-preserved-state-recover-v1 ]]
          [[ "$(awk -F= '$1=="candidate_commit"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == c9e8104cfa2bebfc42bf4adddb458d66e60f67fc ]]
          [[ "$(awk -F= '$1=="attempt_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == attempt:259ecb51-acdb-420b-a2fa-8f7ffc315750 ]]
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/302-onshape-phase5-preserved-state-recover.sh")" == "$expected_script_blob" ]]
          bash -n server-bootstrap/302-onshape-phase5-preserved-state-recover.sh
      - name: Reconcile preserved Attempt without replay
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/302-onshape-phase5-preserved-state-recover.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_ATTEMPT=ABSENT' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_NO_REPLAY=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_MARKER_CLEARED=terminal-ABSENT' <<<"$out"
          grep -Fxq 'CF_PHASE5_PRESERVED_RECOVERY=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_RESTORE=production-green' <<<"$out"
