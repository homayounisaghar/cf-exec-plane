name: Onshape Credential Install

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server-bootstrap/control/onshape-credential-requests/**

permissions:
  contents: read

concurrency:
  group: personal-server-onshape-credential-install
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  install:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      CF_ONSHAPE_ACCOUNT: ${{ secrets.CF_ONSHAPE_ACCOUNT }}
      CF_ONSHAPE_PASSWORD: ${{ secrets.CF_ONSHAPE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable credential request
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "credential trigger commit must add exactly one request file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "credential request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/onshape-credential-requests/*.request ]] || { echo "unexpected credential request path" >&2; exit 12; }
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ && "$file_request_id" == "$request_id" ]] || { echo "bad request id" >&2; exit 13; }

      - name: Mask host and login
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)

      - name: Validate secret material presence
        run: |
          set -euo pipefail
          [[ -n "${CF_ONSHAPE_ACCOUNT:-}" ]] || { echo "missing required Secret: CF_ONSHAPE_ACCOUNT" >&2; exit 30; }
          [[ -n "${CF_ONSHAPE_PASSWORD:-}" ]] || { echo "missing required Secret: CF_ONSHAPE_PASSWORD" >&2; exit 30; }
          (( ${#CF_ONSHAPE_ACCOUNT} <= 320 )) || { echo "CF_ONSHAPE_ACCOUNT is too long" >&2; exit 30; }
          (( ${#CF_ONSHAPE_PASSWORD} >= 8 && ${#CF_ONSHAPE_PASSWORD} <= 1024 )) || { echo "CF_ONSHAPE_PASSWORD length is outside policy" >&2; exit 30; }
          case "$CF_ONSHAPE_ACCOUNT" in *$'\n'*|*$'\r'*) echo "CF_ONSHAPE_ACCOUNT contains a line break" >&2; exit 30 ;; esac
          case "$CF_ONSHAPE_PASSWORD" in *$'\n'*|*$'\r'*) echo "CF_ONSHAPE_PASSWORD contains a line break" >&2; exit 30 ;; esac

      - name: Stage credential material into transfer bundle
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CF_ONSHAPE_ACCOUNT" > "$GITHUB_WORKSPACE/server-bootstrap/.onshape-account"
          printf '%s' "$CF_ONSHAPE_PASSWORD" > "$GITHUB_WORKSPACE/server-bootstrap/.onshape-password"

      - name: Install one-time Onshape credentials on VPS
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/82-onshape-credential-install.sh

      - name: Remove staged credential material
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/server-bootstrap/.onshape-account"
          rm -f "$GITHUB_WORKSPACE/server-bootstrap/.onshape-password"
