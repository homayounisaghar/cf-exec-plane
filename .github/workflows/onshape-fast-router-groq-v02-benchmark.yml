name: Onshape Fast Router Groq V02 Benchmark

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-groq-v02/control/*.request

permissions:
  contents: read

concurrency:
  group: onshape-fast-router-groq-v02
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax gate
        run: python -m py_compile qualification/onshape-fast-router-groq-v02/benchmark.py

      - name: Require Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$GROQ_API_KEY" || {
            echo "::error::GROQ_API_KEY repository secret is missing"
            exit 2
          }

      - name: Run expanded 20B benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CASE_DELAY: '5.0'
          OUT_DIR: artifacts/onshape-fast-router-groq-v02
        run: python qualification/onshape-fast-router-groq-v02/benchmark.py

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onshape-fast-router-groq-v02-${{ github.run_id }}
          path: artifacts/onshape-fast-router-groq-v02/
          if-no-files-found: warn
          retention-days: 14
