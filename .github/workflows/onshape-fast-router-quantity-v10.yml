name: Onshape Fast Router Quantity V10

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-quantity-v10/control/*.request

permissions:
  contents: write

concurrency:
  group: onshape-fast-router-quantity-v10
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-quantity-v10/evidence_v06.py
          python -m py_compile qualification/onshape-fast-router-quantity-v10/quantity_grammar_tests.py
          python -m py_compile qualification/onshape-fast-router-quantity-v10/deterministic_regression.py
      - name: Run canonical quantity grammar tests
        run: |
          mkdir -p artifacts/onshape-fast-router-quantity-v10
          cd qualification/onshape-fast-router-quantity-v10
          python quantity_grammar_tests.py > "${{ github.workspace }}/artifacts/onshape-fast-router-quantity-v10/grammar.json"
      - name: Run deterministic regression
        run: |
          cd qualification/onshape-fast-router-quantity-v10
          python deterministic_regression.py > "${{ github.workspace }}/artifacts/onshape-fast-router-quantity-v10/regression.json"
      - name: Publish direct readback
        if: always()
        run: |
          set -eu
          src="artifacts/onshape-fast-router-quantity-v10"
          dst="reports/onshape-fast-router-quantity-v10"
          mkdir -p "$dst"
          test -f "$src/grammar.json" && cp "$src/grammar.json" "$dst/grammar.json" || true
          test -f "$src/regression.json" && cp "$src/regression.json" "$dst/regression.json" || true
          printf '{"run_id":"%s","head_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: Onshape quantity grammar v10" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
