name: Onshape R4 Guarded Production Finalize

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-r4-guarded-finalize/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-r4-guarded-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable finalize request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-r4-guarded-finalize/*.request ]] || exit 11
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_control_blob="$(awk -F= '$1=="expected_control_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 12
          [[ "$action" == "finalize-r4-guarded-production" ]] || exit 13
          [[ "$expected_control_blob" == "3b7b05f78c89d7fed2f8bb964cda42347924a329" ]] || exit 14
          actual_script_blob="$(git rev-parse "$GITHUB_SHA:server-bootstrap/143-onshape-r4-guarded-finalize.sh")"
          [[ "$actual_script_blob" == "$expected_script_blob" ]] || exit 15
          bash -n server-bootstrap/143-onshape-r4-guarded-finalize.sh
      - name: Finalize guarded seq67 production
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/143-onshape-r4-guarded-finalize.sh
