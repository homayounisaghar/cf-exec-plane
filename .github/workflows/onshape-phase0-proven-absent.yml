name: Onshape Phase 0 Proven-Absent Reconcile
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-phase0-proven-absent/*.request'
permissions:
  contents: read
concurrency:
  group: onshape-phase0-research-activate
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r st p <<<"${changes[0]}"
          [[ "$st" == A && "$p" == server-bootstrap/control/onshape-phase0-proven-absent/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == phase0-proven-absent-v1 ]]
          bash -n server-bootstrap/221-onshape-phase0-proven-absent.sh
      - name: Mask endpoint
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Prove no effect and reconcile exact Attempt
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/221-onshape-phase0-proven-absent.sh
