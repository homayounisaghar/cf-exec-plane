name: Dexa Super Dashboard Android v1 unsigned
on:
  push:
    branches:
      - work/dexa-super-dashboard-v1-20261105
    paths:
      - 'dexa-superapp/control/build/*.request'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Verify immutable build request
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" | wc -l)" -eq 1
          request="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
          [[ "$request" == dexa-superapp/control/build/*.request ]]
          test "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA" | cut -f1)" = A
          grep -qx 'action=build-dexa-super-dashboard-v1' "$request"
          expected=$(awk -F= '$1=="snapshot_sha"{print $2}' "$request")
          test "$expected" = "$(git rev-parse "$GITHUB_SHA^")"
          test "$(find dexa-superapp/android -name '*.p12' -o -name '*password*' | wc -l)" -eq 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build release unsigned APK and validate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p dexa-superapp/android :app:assembleRelease
          output="dexa-superapp/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$output"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$output" dist/dexa-super-dashboard-v1-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 dist/dexa-super-dashboard-v1-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/dexa-super-dashboard-v1-unsigned-aligned.apk > dist/badging.txt
          grep -q "package: name='com.homayounisaghar.dexasuperdashboard' versionCode='1' versionName='1.0.0'" dist/badging.txt
          unzip -t dist/dexa-super-dashboard-v1-unsigned-aligned.apk >/dev/null
          sha256sum dist/dexa-super-dashboard-v1-unsigned-aligned.apk > dist/unsigned.sha256
          printf '%s\n' "$GITHUB_SHA" > dist/build_request_sha.txt
          printf '%s\n' "$(git rev-parse "$GITHUB_SHA^")" > dist/snapshot_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dexa-super-dashboard-v1-unsigned
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Public download of unsigned compilation output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "dexa-super-dashboard-v1-unsigned-20261105" \
            dist/dexa-super-dashboard-v1-unsigned-aligned.apk \
            dist/unsigned.sha256 dist/badging.txt dist/build_request_sha.txt dist/snapshot_sha.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dexa Super Dashboard v1 - unsigned build input" \
            --notes "Unsigned CI artifact. Not installable. Signed separately by the owner-held durable signer."
