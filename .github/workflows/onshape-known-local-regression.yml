name: Onshape Known Local Regression

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-divergent-v15-10000/known-local-control/*.request

permissions:
  contents: write

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run local known regressions
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/onshape-known-local-regression
        run: |
          mkdir -p "$OUT_DIR"
          python qualification/onshape-fast-router-divergent-v15-10000/regress_known_local.py
      - name: Publish
        run: |
          src="artifacts/onshape-known-local-regression"
          dst="reports/onshape-known-local-regression"
          mkdir -p "$dst"
          cp "$src/summary.json" "$dst/summary.json"
          printf '{"run_id":"%s","head_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: known local regression" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
