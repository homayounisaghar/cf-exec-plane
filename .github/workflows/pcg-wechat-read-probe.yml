name: PCG WeChat Read Probe

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-wechat-read-probe/*.request

permissions:
  contents: read

concurrency:
  group: pcg-wechat-read-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: request
        name: Validate immutable WeChat read-probe request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/pcg-wechat-read-probe/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          case "$action" in snapshot|state-index|db-schema|key-scan) ;; *) exit 14 ;; esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          case "$port" in ''|*[!0-9]*) exit 21 ;; esac
          tmp="${RUNNER_TEMP}/pcg-wechat-read-probe-ssh"
          install -d -m 0700 "$tmp"
          printf '%s\n' "$VPS_SSH_KEY" > "$tmp/key"
          chmod 0600 "$tmp/key"
          host_key_line="${VPS_HOST_KEY//$'\r'/}"
          read -r hkt hkd extra <<< "$host_key_line"
          [[ "$hkt" == ssh-ed25519 && -n "$hkd" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$hkt" "$hkd" > "$tmp/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$hkt" "$hkd" >> "$tmp/known_hosts"
          chmod 0600 "$tmp/known_hosts"
          echo "SSH_DIR=$tmp" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Run bounded WeChat read probe
        env:
          ACTION: ${{ steps.request.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${VPS_SSH_USER}@${VPS_HOST}" "ACTION='$ACTION' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$(id -u)" -eq 0 ]] || exit 30
          owner=cfop_e79aa1fde5
          bridge=capability-fabric-pcg-login-bridge-wechat.service
          final=capability-fabric-pcg-wechat.service
          state=/var/lib/capability-fabric/pcg/wechat
          debug=/var/lib/capability-fabric/paa-remote/pcg-wechat-read-probe-debug.txt
          : > "$debug"
          chown paa_remote:paa_remote "$debug"
          chmod 0600 "$debug"
          echo "stage=start action=$ACTION" >> "$debug"
          echo "bridge=$(systemctl is-active "$bridge" 2>/dev/null || true) final=$(systemctl is-active "$final" 2>/dev/null || true)" >> "$debug"

          case "$ACTION" in
            snapshot)
              snapshot="$state/accessibility-snapshot.json"
              if systemctl is-active --quiet "$final" && curl -fsS --max-time 2 http://127.0.0.1:9336/accessibility >/tmp/pcg-wechat-accessibility.json 2>/dev/null; then
                python3 -c 'import json; p=json.load(open("/tmp/pcg-wechat-accessibility.json")); assert p.get("ok") is True; assert int(p.get("node_count",0)) > 0'
                install -o paa_remote -g paa_remote -m 0600 /tmp/pcg-wechat-accessibility.json /var/lib/capability-fabric/paa-remote/pcg-wechat-accessibility.json
                echo "stage=success source=final_status" >> "$debug"
                exit 0
              fi

              systemctl is-active --quiet "$bridge" || { echo "stage=no_active_wechat_runtime" >> "$debug"; exit 31; }
              pid=""
              dbus=""
              for p in $(pgrep -u "$owner" -f '/opt/wechat/wechat' 2>/dev/null || true); do
                [[ -r "/proc/$p/environ" ]] || continue
                candidate="$(tr '\0' '\n' < "/proc/$p/environ" | awk -F= '$1=="DBUS_SESSION_BUS_ADDRESS"{sub(/^[^=]*=/,""); print; exit}')"
                if [[ -n "$candidate" ]]; then
                  pid="$p"
                  dbus="$candidate"
                  break
                fi
              done
              [[ -n "$pid" && -n "$dbus" ]] || { echo "stage=dbus_unavailable" >> "$debug"; exit 32; }
              rm -f "$snapshot"
              set +e
              timeout 7s runuser -u "$owner" -- env DISPLAY=:97 DBUS_SESSION_BUS_ADDRESS="$dbus" QT_ACCESSIBILITY=1 QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 NO_AT_BRIDGE=0 python3 /usr/local/lib/capability-fabric/pcg-provider-runtime/wechat_atspi_snapshot.py "$snapshot" >> "$debug" 2>&1
              probe_rc=$?
              set -e
              [[ "$probe_rc" -eq 0 || "$probe_rc" -eq 124 ]]
              test -s "$snapshot"
              python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("ok") is True; assert int(p.get("node_count",0)) > 0' "$snapshot"
              install -o paa_remote -g paa_remote -m 0600 "$snapshot" /var/lib/capability-fabric/paa-remote/pcg-wechat-accessibility.json
              echo "stage=success source=bridge_atspi" >> "$debug"
              ;;
            db-schema)
              out=/var/lib/capability-fabric/paa-remote/pcg-wechat-db-schema.txt
              tmp=/tmp/pcg-wechat-db-schema.txt
              root="$state/home/xwechat_files"
              : > "$tmp"
              python3 - "$root" > "$tmp" <<'PY'
          import os, sys, sqlite3, json, glob, binascii
          root=sys.argv[1]
          print("WECHAT_DB_SCHEMA_V1")
          for p in sorted(glob.glob(root + "/**/*.db", recursive=True)):
              print("\nDB", p)
              try:
                  with open(p, "rb") as f:
                      hdr=f.read(32)
                  print("HEADER_HEX", binascii.hexlify(hdr).decode())
                  print("HEADER_ASCII", hdr[:16].decode("ascii","replace"))
              except Exception as e:
                  print("HEADER_ERROR", type(e).__name__, str(e))
                  continue
              try:
                  uri="file:" + p + "?mode=ro"
                  con=sqlite3.connect(uri, uri=True, timeout=2)
                  con.execute("PRAGMA query_only=ON")
                  rows=con.execute("SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index','view','trigger') ORDER BY type,name").fetchall()
                  print("SCHEMA_OBJECTS", len(rows))
                  for typ,name,tbl,sql in rows:
                      print("OBJECT", json.dumps({"type":typ,"name":name,"table":tbl,"sql":sql}, ensure_ascii=False))
                  for typ,name,tbl,sql in rows:
                      if typ=="table" and name and not name.startswith("sqlite_"):
                          try:
                              cols=con.execute("PRAGMA table_info(" + json.dumps(name) + ")").fetchall()
                              print("COLUMNS", json.dumps({"table":name,"columns":[{"cid":r[0],"name":r[1],"type":r[2],"notnull":r[3],"default":r[4],"pk":r[5]} for r in cols]}, ensure_ascii=False))
                          except Exception as e:
                              print("COLUMNS_ERROR", name, type(e).__name__, str(e))
                  con.close()
              except Exception as e:
                  print("SQLITE_ERROR", type(e).__name__, str(e))
          PY
              install -o paa_remote -g paa_remote -m 0600 "$tmp" "$out"
              echo "stage=success db_schema=$out" >> "$debug"
              ;;
            key-scan)
              summary=/var/lib/capability-fabric/paa-remote/pcg-wechat-keyscan-summary.json
              tmp=/tmp/pcg-wechat-keyscan-summary.json
              python3 - "$state" "$owner" > "$tmp" <<'PY'
          import glob, hashlib, hmac, json, os, pathlib, re, struct, sys, time
          state=pathlib.Path(sys.argv[1])
          owner=sys.argv[2]
          root=state/"home"/"xwechat_files"
          key_path=state/"db-keys.json"
          page_size=4096
          reserve=80
          hmac_size=64
          key_size=32
          max_region=256*1024*1024
          chunk_size=1024*1024
          xpat=re.compile(rb"x'([0-9a-fA-F]{64,192})'")
          rawpat=re.compile(rb"(?<![0-9a-fA-F])([0-9a-fA-F]{64})(?![0-9a-fA-F])")
          
          def verify(db_path, key, explicit_salt=None):
              try:
                  page=pathlib.Path(db_path).read_bytes()[:page_size]
                  if len(page)<page_size: return False
                  salt=explicit_salt if explicit_salt is not None else page[:16]
                  if len(salt)!=16 or len(key)!=32: return False
                  mac_salt=bytes(b ^ 0x3A for b in salt)
                  mac_key=hashlib.pbkdf2_hmac("sha512", key, mac_salt, 2, dklen=32)
                  data=page[16:page_size-reserve+16]
                  stored=page[page_size-hmac_size:page_size]
                  hm=hmac.new(mac_key, data, hashlib.sha512)
                  hm.update(struct.pack("<I",1))
                  return hmac.compare_digest(hm.digest(), stored)
              except Exception:
                  return False
          
          dbs=[]
          for p in sorted(glob.glob(str(root/"**"/"*.db"), recursive=True)):
              try:
                  with open(p,"rb") as fh: head=fh.read(16)
              except OSError:
                  continue
              if head.startswith(b"SQLite format 3"): continue
              if "/db_storage/" not in p: continue
              dbs.append(p)
          
          unresolved=set(dbs)
          validated={}
          seen=set()
          pids=[]
          for entry in pathlib.Path("/proc").iterdir():
              if not entry.name.isdigit(): continue
              try: cmd=(entry/"cmdline").read_bytes().replace(b"\0",b" ").decode("utf-8","ignore")
              except Exception: continue
              if "/opt/wechat/wechat" in cmd:
                  pids.append(int(entry.name))
          pids.sort()
          
          def consider(key_hex, salt_hex=None):
              ident=(key_hex.lower(), salt_hex.lower() if salt_hex else None)
              if ident in seen: return
              seen.add(ident)
              try: key=bytes.fromhex(ident[0])
              except Exception: return
              salt=None
              if ident[1]:
                  try: salt=bytes.fromhex(ident[1])
                  except Exception: salt=None
              for db in list(unresolved):
                  if verify(db,key,None):
                      validated[db]={"key_hex":ident[0],"salt_hex":None}
                      unresolved.remove(db)
                      continue
                  if salt is not None and verify(db,key,salt):
                      validated[db]={"key_hex":ident[0],"salt_hex":ident[1]}
                      unresolved.remove(db)
          
          regions_scanned=0
          bytes_scanned=0
          errors=[]
          for pid in pids:
              try: lines=pathlib.Path(f"/proc/{pid}/maps").read_text().splitlines()
              except Exception as exc:
                  errors.append(f"maps:{pid}:{type(exc).__name__}"); continue
              try: mem=open(f"/proc/{pid}/mem","rb",buffering=0)
              except Exception as exc:
                  errors.append(f"mem:{pid}:{type(exc).__name__}"); continue
              try:
                  for line in lines:
                      if not unresolved: break
                      parts=line.split()
                      if len(parts)<2 or "r" not in parts[1]: continue
                      start_s,end_s=parts[0].split("-")
                      start,end=int(start_s,16),int(end_s,16)
                      size=end-start
                      if size<32 or size>max_region: continue
                      path_name=parts[-1] if len(parts)>=6 else ""
                      allowed=(not path_name or path_name=="[heap]" or path_name.startswith("[anon:") or path_name.startswith("/opt/wechat"))
                      if not allowed: continue
                      regions_scanned+=1
                      pos=start
                      overlap=b""
                      while pos<end and unresolved:
                          want=min(chunk_size,end-pos)
                          try:
                              mem.seek(pos); data=mem.read(want)
                          except (OSError,OverflowError):
                              break
                          if not data: break
                          bytes_scanned+=len(data)
                          scan=overlap+data
                          for m in xpat.finditer(scan):
                              inner=m.group(1).decode("ascii").lower()
                              if len(inner)>=96: consider(inner[:64],inner[-32:])
                              elif len(inner)==64: consider(inner,None)
                          for m in rawpat.finditer(scan):
                              consider(m.group(1).decode("ascii"),None)
                          overlap=scan[-256:]
                          pos+=len(data)
              finally:
                  mem.close()
              if not unresolved: break
          
          payload={
            "schema":"pcg.wechat.db_keys.v1",
            "generated_at_ms":int(time.time()*1000),
            "pid_candidates":pids,
            "db_count":len(dbs),
            "validated_count":len(validated),
            "keys":validated
          }
          tmp=key_path.with_suffix(".tmp")
          tmp.write_text(json.dumps(payload,separators=(",",":")),encoding="utf-8")
          os.chmod(tmp,0o600)
          os.replace(tmp,key_path)
          summary={
            "ok":bool(validated),
            "pid_count":len(pids),
            "db_count":len(dbs),
            "validated_count":len(validated),
            "validated_relative_paths":[str(pathlib.Path(p).relative_to(root)) for p in sorted(validated)],
            "unresolved_relative_paths":[str(pathlib.Path(p).relative_to(root)) for p in sorted(unresolved)],
            "regions_scanned":regions_scanned,
            "bytes_scanned":bytes_scanned,
            "candidate_count":len(seen),
            "errors":errors[:20]
          }
          print(json.dumps(summary,ensure_ascii=False))
          PY
              chown "$owner:$owner" "$state/db-keys.json"
              chmod 0600 "$state/db-keys.json"
              install -o paa_remote -g paa_remote -m 0600 "$tmp" "$summary"
              python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("validated_count",0) > 0' "$summary"
              echo "stage=success keyscan_summary=$summary" >> "$debug"
              ;;
            state-index)
              out=/var/lib/capability-fabric/paa-remote/pcg-wechat-state-index.txt
              tmp=/tmp/pcg-wechat-state-index.txt
              : > "$tmp"
              {
                echo "WECHAT_STATE_INDEX_V1"
                echo "bridge=$(systemctl is-active "$bridge" 2>/dev/null || true)"
                echo "final=$(systemctl is-active "$final" 2>/dev/null || true)"
                echo "home=$state/home"
                echo "FILES"
                find "$state/home" -xdev -maxdepth 8 -type f -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -k3
                echo "DIRECTORIES_WITH_LEVELDB_MARKERS"
                find "$state/home" -xdev -maxdepth 8 -type f \( -name CURRENT -o -name MANIFEST-\* -o -name LOG \) -printf '%h\n' 2>/dev/null | sort -u
                echo "SQLITE_CANDIDATES"
                find "$state/home" -xdev -maxdepth 8 -type f \( -iname '*.db' -o -iname '*.sqlite' -o -iname '*.sqlite3' \) -print 2>/dev/null | sort
                echo "OPEN_WECHAT_FILES"
                for p in $(pgrep -u "$owner" -f '/opt/wechat/wechat' 2>/dev/null || true); do
                  find "/proc/$p/fd" -maxdepth 1 -type l -printf '%l\n' 2>/dev/null | grep '^/var/lib/capability-fabric/pcg/wechat/' || true
                done | sort -u
              } > "$tmp"
              install -o paa_remote -g paa_remote -m 0600 "$tmp" "$out"
              echo "stage=success state_index=$out" >> "$debug"
              ;;
          esac
          REMOTE
