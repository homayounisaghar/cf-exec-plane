name: Onshape Fabric Shadow Startup Proof

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/onshape-fabric-shadow-startup-proof/*.request

permissions:
  contents: read

jobs:
  prove:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-fabric-shadow-startup-proof/*.request ]] || exit 11
      - name: Mask host and login
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Run isolated candidate startup proof
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/94-onshape-fabric-shadow-startup-proof.sh
