name: PCG Telegram Web Control

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/pcg-web-control-requests/*.request'

permissions:
  contents: read

concurrency:
  group: personal-server-pcg-web-control
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  control:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: request
        name: Validate immutable Telegram Web control request
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/pcg-web-control-requests/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          phase="$(awk -F= '$1=="phase"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          ciphertext="$(awk -F= '$1=="ciphertext"{print substr($0,index($0,"=")+1)}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          case "$phase" in prepare|status|ingress-diagnostic|semantic-status|semantic-conversations|semantic-conversations-protected|semantic-conversations-canary|semantic-search-canary|phone|code|password|cleanup|screenshot|mytelegram-start|mytelegram-capture-code|mytelegram-signin|mytelegram-create-app|mytelegram-screenshot) ;; *) exit 14 ;; esac
          case "$phase" in
            phone|code|password|mytelegram-start)
              [[ "$ciphertext" =~ ^[A-Za-z0-9+/=]{32,8192}$ ]] || { echo "ciphertext required" >&2; exit 15; }
              ;;
            *)
              [[ -z "$ciphertext" ]] || { echo "ciphertext forbidden for this phase" >&2; exit 16; }
              ;;
          esac
          [[ -z "$ciphertext" ]] || printf '::add-mask::%s\n' "$ciphertext"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "ciphertext=$ciphertext" >> "$GITHUB_OUTPUT"

      - name: Mask endpoint and login
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do
            [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"
          done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)

      - name: Execute bounded Telegram Web control
        env:
          CF_PCG_WEB_CONTROL_MODE: ${{ steps.request.outputs.phase }}
          CF_PCG_WEB_CONTROL_CIPHERTEXT: ${{ steps.request.outputs.ciphertext }}
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/45-pcg-web-control.sh

      - name: Fetch Telegram Web screenshot from VPS
        if: steps.request.outputs.phase == 'screenshot' || steps.request.outputs.phase == 'mytelegram-screenshot'
        run: |
          set -euo pipefail
          key_file="$(mktemp "${RUNNER_TEMP}/cf-vps-key.XXXXXX")"
          known_hosts="$(mktemp "${RUNNER_TEMP}/cf-known-hosts.XXXXXX")"
          cleanup() { rm -f "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          host_key_line="${VPS_HOST_KEY//$'\r'/}"
          read -r key_type key_data extra <<< "$host_key_line"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "${extra:-}" ]]
          port="${VPS_PORT:-22}"
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$known_hosts"
          ssh_opts=(-i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15)
          remote_name=telegram-web-ui.png
          if [[ "${{ steps.request.outputs.phase }}" == mytelegram-screenshot ]]; then remote_name=mytelegram-ui.png; fi
          scp -q -i "$key_file" -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts"             "$VPS_SSH_USER@$VPS_HOST:/var/lib/capability-fabric/pcg/run/$remote_name"             "${RUNNER_TEMP}/telegram-web-ui.png"
          [[ -s "${RUNNER_TEMP}/telegram-web-ui.png" ]]
          ssh "${ssh_opts[@]}" "$VPS_SSH_USER@$VPS_HOST"             "rm -f /var/lib/capability-fabric/pcg/run/$remote_name"
          chmod 600 "${RUNNER_TEMP}/telegram-web-ui.png"

      - name: Upload Telegram Web screenshot artifact
        if: steps.request.outputs.phase == 'screenshot' || steps.request.outputs.phase == 'mytelegram-screenshot'
        uses: actions/upload-artifact@v4
        with:
          name: pcg-web-screenshot-${{ github.run_id }}
          path: ${{ runner.temp }}/telegram-web-ui.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove local screenshot copy
        if: always() && (steps.request.outputs.phase == 'screenshot' || steps.request.outputs.phase == 'mytelegram-screenshot')
        run: rm -f "${RUNNER_TEMP}/telegram-web-ui.png"
