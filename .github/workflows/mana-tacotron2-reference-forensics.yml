name: Mana Tacotron2 Reference Forensics

on:
  push:
    branches: [main]
    paths:
      - mana-tacotron2/control/reference-forensics/*.request

permissions:
  contents: read

jobs:
  phase0:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be new" >&2; exit 11; }
          [[ "$request_path" == mana-tacotron2/control/reference-forensics/*.request ]] || exit 12
          rid="$(basename "$request_path" .request)"
          got="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$rid" == "$got" ]] || exit 13

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Acquire locked public reference inputs
        shell: bash
        run: |
          set -euo pipefail
          git clone https://huggingface.co/spaces/abreza/mana-tts "$RUNNER_TEMP/space"
          git -C "$RUNNER_TEMP/space" checkout 3784ae7afc431cf333ad5961900db37a8297e5c6
          git clone https://github.com/MahtaFetrat/Persian-MultiSpeaker-Tacotron2.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout master
          curl -L --fail --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/synthesizer.pt" \
            "https://huggingface.co/MahtaFetrat/Persian-Tacotron2-on-ManaTTS/resolve/3e8576c283aa45a4170b4423b7efb779b4844ac6/synthesizer.pt?download=true"
          echo "433588014a7c0622e9f3b00faa75d8fa35344f0d61f64fd715f27a096978a21d  $RUNNER_TEMP/synthesizer.pt" | sha256sum -c -

      - name: Install minimal checkpoint reader
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input "numpy==1.26.4" "torch==2.2.2" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run forensics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python mana-tacotron2/reference_forensics.py \
            "$RUNNER_TEMP/space" "$RUNNER_TEMP/upstream" "$RUNNER_TEMP/synthesizer.pt" out
          cat out/phase0-forensics.md

      - uses: actions/upload-artifact@v4
        with:
          name: mana-tacotron2-reference-forensics
          path: out/
          retention-days: 7
