name: Mana Tacotron2 Reference Forensics

on:
  push:
    branches: [main]
    paths:
      - mana-tacotron2/control/reference-forensics/*.request

permissions:
  contents: read
  actions: read

jobs:
  phase0:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be new" >&2; exit 11; }
          [[ "$request_path" == mana-tacotron2/control/reference-forensics/*.request ]] || exit 12
          rid="$(basename "$request_path" .request)"
          got="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$rid" == "$got" ]] || exit 13
          mode="$(awk -F= '$1=="mode"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          mode="${mode:-phase0-v08}"
          case "$mode" in
            phase0-v08|corpus-v09|diagnosis-v10) ;;
            *) echo "unsupported mode: $mode" >&2; exit 14 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Acquire locked public reference source and synthesizer
        shell: bash
        run: |
          set -euo pipefail
          git clone https://huggingface.co/spaces/abreza/mana-tts "$RUNNER_TEMP/space"
          git -C "$RUNNER_TEMP/space" checkout 3784ae7afc431cf333ad5961900db37a8297e5c6
          curl -L --fail --retry 3 --retry-all-errors             -o "$RUNNER_TEMP/synthesizer.pt"             "https://huggingface.co/MahtaFetrat/Persian-Tacotron2-on-ManaTTS/resolve/3e8576c283aa45a4170b4423b7efb779b4844ac6/synthesizer.pt?download=true"
          echo "433588014a7c0622e9f3b00faa75d8fa35344f0d61f64fd715f27a096978a21d  $RUNNER_TEMP/synthesizer.pt" | sha256sum -c -

      - name: Install pinned Phase 0 runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input             "numpy==1.22.4"             "scipy==1.7.3"             "librosa==0.10.2.post1"             "numba==0.57.1"             "soundfile==0.12.1"             "webrtcvad==2.0.10"             "gdown==5.2.0"             "requests==2.32.3"             "PyYAML==6.0.2"             "h5py==3.11.0"             "tensorboardX==2.6.2.2"             "gradio_client==1.8.0"
          python -m pip install --disable-pip-version-check --no-input             "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-input             "parallel-wavegan==0.6.1" --no-build-isolation

      - name: Run Phase 0 resume probe
        if: steps.request.outputs.mode == 'phase0-v08'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          python mana-tacotron2/reference_forensics.py             "$RUNNER_TEMP/space" "$RUNNER_TEMP/synthesizer.pt" out
          cat out/phase0-resume-summary.json
          cat out/p0-6-speaker.json
          cat out/p0-10-stop.json

      - name: Fetch already-captured hosted anchor WAVs
        if: steps.request.outputs.mode == 'corpus-v09'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf hosted
          mkdir -p hosted
          for spec in "10583472060:hosted-400d4d55" "10583332472:hosted-1cb6a07b"; do
            aid="${spec%%:*}"
            label="${spec#*:}"
            zip="$RUNNER_TEMP/${aid}.zip"
            dir="$RUNNER_TEMP/${aid}"
            curl -L --fail --retry 3               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip"               -o "$zip"
            mkdir -p "$dir"
            unzip -q "$zip" -d "$dir"
            test -f "$dir/reference_audio/ref-00.wav"
            cp "$dir/reference_audio/ref-00.wav" "hosted/${label}.wav"
          done
          sha256sum hosted/*.wav

      - name: Run v0.9 local reference corpus and asset budget
        if: steps.request.outputs.mode == 'corpus-v09'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          python mana-tacotron2/reference_corpus_v09.py             "$RUNNER_TEMP/space" "$RUNNER_TEMP/synthesizer.pt" out hosted
          cat out/corpus-summary.json
          cat out/p0-12-asset-budget.json
          cat out/p0-11-comparison.json

      - name: Align v1.0 diagnosis with frozen P0-9 runtime
        if: steps.request.outputs.mode == 'diagnosis-v10'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --upgrade \
            "numpy==1.24.4" "scipy==1.15.3"
          python - <<'PY'
          import numpy, scipy, librosa, torch
          assert numpy.__version__ == "1.24.4"
          assert scipy.__version__ == "1.15.3"
          assert librosa.__version__ == "0.10.2.post1"
          assert torch.__version__.startswith("2.2.2")
          print("frozen-runtime-ok", numpy.__version__, scipy.__version__, librosa.__version__, torch.__version__)
          PY

      - name: Fetch accepted v0.9 corpus artifact for diagnosis
        if: steps.request.outputs.mode == 'diagnosis-v10'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf corpus-v09
          mkdir -p corpus-v09
          zip="$RUNNER_TEMP/corpus-v09.zip"
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10583826662/zip" \
            -o "$zip"
          unzip -q "$zip" -d corpus-v09
          test -f corpus-v09/reference_corpus_manifest.json
          test -f corpus-v09/p0-11-comparison.json
          test -f corpus-v09/local_reference_audio/s00-r0.wav
          test -f corpus-v09/local_reference_audio/s12-r0.wav
          sha256sum corpus-v09/local_reference_audio/s00-r0.wav corpus-v09/local_reference_audio/s12-r0.wav

      - name: Run v1.0 bounded diagnosis D-A D-B D-C
        if: steps.request.outputs.mode == 'diagnosis-v10'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf diagnosis-out
          mkdir -p diagnosis-out
          python mana-tacotron2/diagnosis_v10.py \
            "$RUNNER_TEMP/space" "$RUNNER_TEMP/synthesizer.pt" corpus-v09 diagnosis-out
          cat diagnosis-out/phase0-diagnosis-v10.json

      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.mode == 'diagnosis-v10'
        with:
          name: mana-tacotron2-diagnosis-v10
          path: diagnosis-out/
          retention-days: 7

      - name: Emit Phase 0 canonical text payloads
        if: always() && steps.request.outputs.mode == 'phase0-v08'
        shell: bash
        run: |
          set -euo pipefail
          for f in checkpoint_dims.json p0-4-reconciliation.json p0-6-speaker.json reference_frontend.py frontend_fixtures.json frontend_quote_probe.json frontend_id_match_20.json frontend_verbatim_capture.txt p0-7-vocoder.json p0-8-assets.json p0-9-environment.json requirements.lock p0-10-stop.json p0-11-hosted-attempt.json licenses.md phase0-resume-summary.json STOP_S1_NEW_CONTRACT_MISMATCH.json STOP_S13.txt; do
            if [[ -f "out/$f" ]]; then
              echo "<<<MANA_FILE:$f>>>"
              cat "out/$f"
              echo
              echo "<<<END_MANA_FILE:$f>>>"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.mode == 'phase0-v08'
        with:
          name: mana-tacotron2-phase0-v08
          path: out/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.mode == 'corpus-v09'
        with:
          name: mana-tacotron2-corpus-v09
          path: out/
          retention-days: 7
