name: Onshape R4 Cache Refresh

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-r4-cache-refresh/*.request'

permissions:
  contents: read

jobs:
  refresh:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable refresh request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-r4-cache-refresh/*.request ]] || exit 11
          [[ "$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "refresh-private-cache-no-change" ]] || exit 12
      - name: Refresh private cache through installed pull agent
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/136-onshape-r4-cache-refresh.sh
