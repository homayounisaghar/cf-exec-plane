name: Onshape R5 Authority Postflight

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-r5-authority-postflight/*.request'

permissions:
  contents: read

jobs:
  postflight:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable postflight request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-r5-authority-postflight/*.request ]] || exit 11
          [[ "$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "prove-epoch13-seq70-r5-authority" ]] || exit 12
          bash -n server-bootstrap/166-onshape-r5-authority-postflight.sh
      - name: Prove live authority/release alignment
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/166-onshape-r5-authority-postflight.sh
