name: Build Mana Tacotron2 Phase3 Bench

on:
  push:
    branches: [main]
    paths:
      - 'mana-tacotron2-bench/control/*.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-tacotron2-bench
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build disposable diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd mana-tacotron2-bench
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="mana-tacotron2-bench/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$apk" | tee mana-tacotron2-bench-badging.txt
          grep -q "package: name='com.mana.local.tacotron2.playground.maleformant.v7' versionCode='8' versionName='0.7.0-formant-wordgap'" mana-tacotron2-bench-badging.txt
          grep -q "native-code: 'arm64-v8a'" mana-tacotron2-bench-badging.txt
          if grep -qE "native-code:.*(armeabi-v7a|x86|x86_64)" mana-tacotron2-bench-badging.txt; then
            echo "unexpected non-arm64 ABI" >&2
            exit 1
          fi

          "$BT/aapt" dump permissions "$apk" | tee mana-tacotron2-bench-permissions.txt
          if grep -q "android.permission.INTERNET" mana-tacotron2-bench-permissions.txt; then
            echo "INTERNET permission is forbidden" >&2
            exit 1
          fi

          "$BT/apksigner" verify --verbose --print-certs "$apk" | tee mana-tacotron2-bench-apksigner.txt
          "$BT/zipalign" -c -P 16 -v 4 "$apk" | tee mana-tacotron2-bench-zipalign.txt

          cp "$apk" mana-tacotron2-playground-v0.7.0-formant-wordgap-disposable.apk
          sha256sum mana-tacotron2-playground-v0.7.0-formant-wordgap-disposable.apk | tee mana-tacotron2-playground-v0.7.0-formant-wordgap-disposable.sha256

          cat > mana-tacotron2-bench-RUN_SHEET.txt <<'EOF'
          Mana Voice Playground v0.7.0 Formant WordGap Fix
          Package: com.mana.local.tacotron2.playground.maleformant.v7
          Installability: signed Android debug APK; explicitly disposable diagnostic line
          Network: no INTERNET permission
          Runtime: ONNX Runtime Android 1.30.0
          Voice pack: imported locally with Android Storage Access Framework
          First action after install: open app -> Import voice pack ZIP
          Then: enter Persian text and tap the custom synthesis button.
          Controls: male preset ON by default at pitch 0.78x + formant 0.85x; manual pitch 0.70x..1.30x; formant 0.75x..1.15x; speed 0.50x..2.00x; punctuation pause 0..1500 ms; word gap 0..400 ms.
          Punctuation is synthesized as real phrase boundaries. [700] overrides one boundary. Word gap never uses word-wise Tacotron inference. The phrase is synthesized once; decoder attention maps spaces to WAV positions and extra PCM silence is inserted post-render.
          Benchmark buttons remain available for canonical Phase-3 measurements.
          The app records JSON on screen and writes local WAV renders.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: mana-tacotron2-playground-v0.7.0-formant-wordgap
          path: |
            mana-tacotron2-playground-v0.7.0-formant-wordgap-disposable.apk
            mana-tacotron2-playground-v0.7.0-formant-wordgap-disposable.sha256
            mana-tacotron2-bench-badging.txt
            mana-tacotron2-bench-permissions.txt
            mana-tacotron2-bench-apksigner.txt
            mana-tacotron2-bench-zipalign.txt
            mana-tacotron2-bench-RUN_SHEET.txt
          retention-days: 14
