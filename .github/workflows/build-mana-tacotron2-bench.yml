name: Build Mana Tacotron2 Phase3 Bench

on:
  push:
    branches: [main]
    paths:
      - 'mana-tacotron2-bench/control/*.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-tacotron2-bench
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build disposable diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd mana-tacotron2-bench
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="mana-tacotron2-bench/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$apk" | tee mana-tacotron2-bench-badging.txt
          grep -q "package: name='com.mana.local.tacotron2.bench' versionCode='3' versionName='0.2.0-playground'" mana-tacotron2-bench-badging.txt

          "$BT/aapt" dump permissions "$apk" | tee mana-tacotron2-bench-permissions.txt
          if grep -q "android.permission.INTERNET" mana-tacotron2-bench-permissions.txt; then
            echo "INTERNET permission is forbidden" >&2
            exit 1
          fi

          "$BT/apksigner" verify --verbose --print-certs "$apk" | tee mana-tacotron2-bench-apksigner.txt
          "$BT/zipalign" -c -P 16 -v 4 "$apk" | tee mana-tacotron2-bench-zipalign.txt

          cp "$apk" mana-tacotron2-playground-v0.2.0-disposable.apk
          sha256sum mana-tacotron2-playground-v0.2.0-disposable.apk | tee mana-tacotron2-playground-v0.2.0-disposable.sha256

          cat > mana-tacotron2-bench-RUN_SHEET.txt <<'EOF'
          Mana Voice Playground v0.2.0
          Package: com.mana.local.tacotron2.bench
          Installability: signed Android debug APK; explicitly disposable diagnostic line
          Network: no INTERNET permission
          Runtime: ONNX Runtime Android 1.30.0
          Voice pack: imported locally with Android Storage Access Framework
          First action after install: open app -> Import voice pack ZIP
          Then: enter Persian text and tap the custom synthesis button.
          Pause syntax: [700] inserts 700 ms silence between generated sections.
          Playback speed: numeric 0.5x..2.0x, pitch held at 1.0.
          Benchmark buttons remain available for canonical Phase-3 measurements.
          The app records JSON on screen and writes local WAV renders.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: mana-tacotron2-playground-v0.2.0
          path: |
            mana-tacotron2-playground-v0.2.0-disposable.apk
            mana-tacotron2-playground-v0.2.0-disposable.sha256
            mana-tacotron2-bench-badging.txt
            mana-tacotron2-bench-permissions.txt
            mana-tacotron2-bench-apksigner.txt
            mana-tacotron2-bench-zipalign.txt
            mana-tacotron2-bench-RUN_SHEET.txt
          retention-days: 14
