name: CF Owner Auth Control

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/cf-owner-auth/*.request

permissions:
  contents: read

concurrency:
  group: cf-owner-auth-control
  cancel-in-progress: false

jobs:
  control:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable owner-auth request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "owner-auth request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/cf-owner-auth/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          mode="$(awk -F= '$1=="mode"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$action" =~ ^(bootstrap|disable|status|observed|recovery-open|recovery-claim)$ ]] || exit 14
          if [[ "$action" == bootstrap ]]; then
            [[ "$mode" =~ ^(observe|enforce)$ ]] || exit 15
            mapfile -t owners < <(awk -F= '$1=="owner"{print $2}' "$request_path" | tr -d '[:space:]')
            [[ "${#owners[@]}" -ge 1 ]] || exit 16
            for owner in "${owners[@]}"; do [[ "$owner" =~ ^cfsub_[0-9a-f]{64}$ ]] || exit 17; done
            mapfile -t organizations < <(awk -F= '$1=="organization"{print $2}' "$request_path" | tr -d '[:space:]')
            for organization in "${organizations[@]}"; do [[ "$organization" =~ ^cforg_[0-9a-f]{64}$ ]] || exit 18; done
          fi
          if [[ "$action" == recovery-claim ]]; then
            recovery_tool="$(awk -F= '$1=="tool"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
            [[ "$recovery_tool" =~ ^[A-Za-z0-9_.-]{1,120}$ ]] || exit 19
            echo "RECOVERY_TOOL=$recovery_tool" >> "$GITHUB_ENV"
          fi
          echo "REQUEST_PATH=$request_path" >> "$GITHUB_ENV"
          echo "ACTION=$action" >> "$GITHUB_ENV"
          echo "MODE=$mode" >> "$GITHUB_ENV"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          case "$port" in ''|*[!0-9]*) exit 21 ;; esac
          tmp="$RUNNER_TEMP/cf-owner-auth-ssh"
          install -d -m 0700 "$tmp"
          printf '%s\n' "$VPS_SSH_KEY" > "$tmp/key"
          chmod 0600 "$tmp/key"
          host_key_line="${VPS_HOST_KEY//$'\r'/}"
          read -r hkt hkd extra <<< "$host_key_line"
          [[ "$hkt" == ssh-ed25519 && -n "$hkd" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$hkt" "$hkd" > "$tmp/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$hkt" "$hkd" >> "$tmp/known_hosts"
          chmod 0600 "$tmp/known_hosts"
          echo "SSH_DIR=$tmp" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Apply owner-auth control
        shell: bash
        run: |
          set -euo pipefail
          remote_args=(docker exec -e CF_OWNER_AUTH_STATE_DIR=/agent-state/owner-auth capability-fabric-onshape-server node /tmp/app/owner-auth.mjs)
          if [[ "$ACTION" == bootstrap ]]; then
            remote_args+=(bootstrap)
            while IFS='=' read -r key value; do
              value="$(printf '%s' "$value" | tr -d '[:space:]')"
              if [[ "$key" == owner ]]; then remote_args+=(--owner "$value"); fi
              if [[ "$key" == organization ]]; then remote_args+=(--organization "$value"); fi
            done < "$REQUEST_PATH"
            remote_args+=(--mode "$MODE")
            printf '%q ' "${remote_args[@]}" > "$RUNNER_TEMP/remote-command"
          elif [[ "$ACTION" == disable ]]; then
            remote_args+=(disable)
            printf '%q ' "${remote_args[@]}" > "$RUNNER_TEMP/remote-command"
          elif [[ "$ACTION" == status ]]; then
            remote_args+=(status)
            printf '%q ' "${remote_args[@]}" > "$RUNNER_TEMP/remote-command"
          elif [[ "$ACTION" == recovery-open ]]; then
            recovery_script='import { createOwnerAuthGate } from "/tmp/app/owner-auth.mjs"; const gate=createOwnerAuthGate({stateDir:"/agent-state/owner-auth",buildId:"root-recovery"}); const state=gate.readState(); const result=await gate.adminBootstrap({ownerFingerprints:state.owners.map((x)=>x.subject_fingerprint),organizationFingerprints:state.organization_fingerprints,mode:"observe"}); console.log(JSON.stringify(result));'
            recovery_args=(docker exec -e CF_OWNER_AUTH_STATE_DIR=/agent-state/owner-auth capability-fabric-onshape-server node --input-type=module -e "$recovery_script")
            printf '%q ' "${recovery_args[@]}" > "$RUNNER_TEMP/remote-command"
          elif [[ "$ACTION" == recovery-claim ]]; then
            claim_script='set -euo pipefail; fp="$(docker logs capability-fabric-onshape-server --since 10m 2>&1 | grep '"'"'"event":"cf_owner_auth_observe"'"'"' | grep '"'"'"tool":"'"$RECOVERY_TOOL"'"'"'"'"' | grep -o '"'"'cfsub_[0-9a-f]\{64\}'"'"' | tail -1)"; [[ "$fp" =~ ^cfsub_[0-9a-f]{64}$ ]] || exit 41; node_script='"'"'import { createOwnerAuthGate } from "/tmp/app/owner-auth.mjs"; const gate=createOwnerAuthGate({stateDir:"/agent-state/owner-auth",buildId:"root-recovery"}); const state=gate.readState(); const fp=process.env.CF_RECOVERY_FP; const owners=[...new Set([...state.owners.map((x)=>x.subject_fingerprint),fp])]; const result=await gate.adminBootstrap({ownerFingerprints:owners,organizationFingerprints:state.organization_fingerprints,mode:"enforce"}); console.log(JSON.stringify({mode:result.mode,owner_count:result.owner_count,organization_pin_count:result.organization_pin_count,recovery_added:true}));'"'"'; docker exec -e CF_OWNER_AUTH_STATE_DIR=/agent-state/owner-auth -e CF_RECOVERY_FP="$fp" capability-fabric-onshape-server node --input-type=module -e "$node_script"'
            claim_args=(bash -lc "$claim_script")
            printf '%q ' "${claim_args[@]}" > "$RUNNER_TEMP/remote-command"
          else
            printf '%s\n' 'docker logs capability-fabric-onshape-server --since 15m 2>&1 | grep cf_owner_auth_observe | tail -20' > "$RUNNER_TEMP/remote-command"
          fi
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${VPS_SSH_USER}@${VPS_HOST}" \
            "bash -lc \"$(cat "$RUNNER_TEMP/remote-command")\"" </dev/null

      - name: Verify owner-auth state
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${VPS_SSH_USER}@${VPS_HOST}" \
            "docker exec -e CF_OWNER_AUTH_STATE_DIR=/agent-state/owner-auth capability-fabric-onshape-server node /tmp/app/owner-auth.mjs status" </dev/null
