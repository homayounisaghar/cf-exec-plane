name: Bluke Paired Bluetooth Layout Release

on:
  push:
    branches:
      - release/bluke-20261104-v126
    paths:
      - 'projects/bluke-keyboard/android/bluke-keyboard.patch'
      - 'projects/bluke-keyboard/windows/Program.cs'
      - '.github/workflows/bluke-pair-release.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply Android Bluetooth vendor-channel update
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arnav-kr/Bluke.git upstream
          git -C upstream checkout bcf4f1492b51bcbb97fc7b792f73ad6bed75c759
          cp projects/bluke-keyboard/android/bluke-keyboard.patch upstream/bluke-keyboard.patch
          cd upstream
          git apply --check bluke-keyboard.patch
          git apply bluke-keyboard.patch
          grep -q 'applicationId = "dev.arnv.bluke.persian"' app/build.gradle.kts
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "1.2.6"' app/build.gradle.kts
          grep -q 'CURRENT_HID_DESCRIPTOR_REVISION = 10' app/src/main/java/dev/arnv/bluke/bluetooth/HidDescriptorRevision.kt
          grep -q 'HOST_LAYOUT_REPORT_ID = 1' app/src/main/java/dev/arnv/bluke/bluetooth/HostLayoutReport.kt
          grep -q 'class HostLayoutReportDecoder' app/src/main/java/dev/arnv/bluke/bluetooth/HostLayoutReport.kt
          grep -q 'btManager.retryBluetoothCapabilities()' app/src/main/java/dev/arnv/bluke/ui/HomeScreen.kt
          ! grep -q 'REPORT_ID (5)' app/src/main/java/dev/arnv/bluke/bluetooth/GamepadDescriptor.kt

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          sed -i '/signingConfig = signingConfigs.getByName("release")/d' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and publish Android APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p out/android
          cp "$APK" out/android/Bluke-Persian-v1.2.6.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 out/android/Bluke-Persian-v1.2.6.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose out/android/Bluke-Persian-v1.2.6.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/android/Bluke-Persian-v1.2.6.apk | grep "package: name='dev.arnv.bluke.persian' versionCode='17' versionName='1.2.6'"
          TAG="bluke-persian-v1.2.6-standard-led"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/android/Bluke-Persian-v1.2.6.apk --clobber
          else
            gh release create "$TAG" out/android/Bluke-Persian-v1.2.6.apk --target "$GITHUB_SHA" --title "Bluke Android v1.2.6" --notes "Uses the existing standard keyboard LED output report ID 1 as the Bluetooth return channel. Android decodes even Scroll-Lock transition bursts; the HID descriptor has no added vendor collection. Debug-signed test APK."
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish one self-contained EXE without PDB
        shell: pwsh
        run: |
          if (Test-Path out) { Remove-Item out -Recurse -Force }
          dotnet publish projects/bluke-keyboard/windows/BlukeLanguageBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=1.2.8 -p:AssemblyVersion=1.2.8.0 -p:FileVersion=1.2.8.0 -p:InformationalVersion=1.2.8 -o out
          $exe = "out/BlukeLanguageBridge.exe"
          if (!(Test-Path $exe)) { throw "Windows bridge EXE missing" }
          if ((Get-ChildItem out -File).Count -ne 1) { throw "Expected exactly one published file in output" }
          if ((Get-ChildItem out -Filter *.pdb -File).Count -ne 0) { throw "PDB must not be published" }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if ($version -ne "1.2.8.0") { throw "Unexpected executable version: $version" }
          Get-FileHash $exe -Algorithm SHA256

      - name: Publish only the Windows executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "out/BlukeLanguageBridge.exe"
          $tag = "bluke-language-bridge-v1.2.8-standard-led"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --target $env:GITHUB_SHA --title "Bluke Windows v1.2.8" --notes "One self-contained Windows x64 EXE only. No ZIP and no PDB. Uses the existing standard keyboard LED output report ID 1. Windows emits 2, 4, 6, 8 or 10 Scroll-Lock transitions to encode the foreground input language; even pulse counts restore the original Scroll-Lock state. No vendor collection, no direct HID writes, no Wi-Fi."
          }
