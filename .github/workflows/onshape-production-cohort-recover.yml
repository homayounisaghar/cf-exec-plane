name: Onshape Production Cohort Recover
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-production-cohort-recover/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-production-cohort-recover
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-production-cohort-recover/*.request ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-production-cohort-recover-v1 ]]
          bash -n server-bootstrap/281-onshape-production-cohort-recover.sh
      - name: Run bounded cohort recovery
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/281-onshape-production-cohort-recover.sh
