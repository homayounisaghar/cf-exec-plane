name: Personal Server Credential Rotation Stage2

on:
  push:
    branches:
      - main
    paths:
      - server-bootstrap/control/rotation-stage2-requests/**

permissions:
  contents: read

concurrency:
  group: personal-server-credential-rotation-stage2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: resolve
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "Stage2 trigger commit must add exactly one request file" >&2; exit 1; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "Stage2 request must be newly added" >&2; exit 1; }
          [[ "$request_path" == server-bootstrap/control/rotation-stage2-requests/*.request ]] || { echo "unexpected Stage2 request path" >&2; exit 1; }
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id" {print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ -n "$file_request_id" && "$file_request_id" == "$request_id" ]] || { echo "request_id mismatch" >&2; exit 1; }
          action="$(awk -F= '$1=="action" {print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          case "$action" in precheck) ;; *) echo "invalid Stage2 action" >&2; exit 1 ;; esac
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

  precheck:
    needs: resolve
    if: needs.resolve.outputs.action == 'precheck'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
      CF_DEPLOY_SIGNING_PUBLIC_KEY: ${{ secrets.CF_DEPLOY_SIGNING_PUBLIC_KEY }}
      CF_DEPLOY_SIGNING_PRIVATE_KEY: ${{ secrets.CF_DEPLOY_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate canonical Secrets and derive existing non-root admin
        run: |
          set -euo pipefail
          for v in VPS_SSH_KEY VPS_HOST VPS_SSH_USER VPS_HOST_KEY CF_REPO_READ_TOKEN CF_DEPLOY_SIGNING_PUBLIC_KEY CF_DEPLOY_SIGNING_PRIVATE_KEY; do
            [[ -n "${!v:-}" ]] || { echo "missing required canonical Secret: $v" >&2; exit 2; }
          done
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)
          suffix="$(printf '%s' "$VPS_HOST" | sha256sum | awk '{print substr($1,1,10)}')"
          admin_user="cfop_${suffix}"
          printf '::add-mask::%s\n' "$admin_user"
          printf 'CF_ADMIN_USER=%s\n' "$admin_user" >> "$GITHUB_ENV"
      - name: Prove canonical signing names against current release and NEW server trust
        run: bash server-bootstrap/runner/stage2-prove-main-material.sh
      - name: Cool down SSH rate-limit window
        run: sleep 35
      - name: Prove fresh privileged SSH using canonical VPS_SSH_KEY
        run: VPS_TEST_USER="$VPS_SSH_USER" REQUIRE_SUDO=no bash server-bootstrap/runner/ssh-test.sh
      - name: Prove fresh admin SSH and sudo using canonical VPS_SSH_KEY
        run: VPS_TEST_USER="$CF_ADMIN_USER" REQUIRE_SUDO=yes bash server-bootstrap/runner/ssh-test.sh
