name: Dexa Manifest Material Stream V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-material-stream-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-material-stream-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify single immutable Dexa release request
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-material-stream-v1-20261101
          req=server-bootstrap/control/dexa-material-stream-v1/dexa-material-stream-v1-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 5 ]]
          grep -Fxq 'request_id=dexa-material-stream-v1-20261101-v1' "$req"
          grep -Fxq 'expected_cf=193' "$req"
          grep -Fxq 'expected_catalog=297' "$req"
          grep -Fxq 'source_commit=35b4d31d07bded71c436faa74997066110c0fcd3' "$req"
          grep -Fxq 'manifest_blob_sha=1ca03b9fb6d2ab4561b33c6bca5e40ecff6ccd34' "$req"
          [[ "$(git hash-object "$dir/manifest.json")" == "1ca03b9fb6d2ab4561b33c6bca5e40ecff6ccd34" ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == "eb1c47f5de37042fbf900a57f5c1f874d6dd35b0" ]]
          sh -n "$dir/deploy.sh"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('qualification/dexa-material-stream-v1-20261101')
          m=json.loads((p/'manifest.json').read_text())
          assert m['schema']=='dexa.material-stream.release.v1'
          assert m['canonicalSource']['commit']=='35b4d31d07bded71c436faa74997066110c0fcd3'
          assert m['expected']['catalog']==297 and m['expected']['nativeCF']==193
          assert m['cfServerChanged'] is False and m['providerSendForQualification'] is False
          assert len(m['candidateSha256'])==13 and len(m['liveBaselineSha256'])==8
          assert all(len(v)==64 for v in m['candidateSha256'].values())
          assert all(len(v)==64 for v in m['liveBaselineSha256'].values())
          print('DEXA_MATERIAL_RELEASE_ADMISSION_PASS')
          PY
      - name: Pin and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Guarded install, scoped Dexa restart, exact hash and health readback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          remote=/tmp/dexa-material-stream-v1-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'mkdir -p -m 755 /tmp/dexa-material-stream-v1-20261101'
          for file in manifest.json material-stream.patch dexa_material_stream_v1.mjs dexa_mcp_material_link_v1.mjs dexa_native_material_effect_v1.mjs test_dexa_material_stream_v1.mjs test_dexa_material_stream_integration_v1.mjs deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "qualification/dexa-material-stream-v1-20261101/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'sh /tmp/dexa-material-stream-v1-20261101/deploy.sh' </dev/null
