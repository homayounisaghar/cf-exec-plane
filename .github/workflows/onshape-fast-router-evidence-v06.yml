name: Onshape Fast Router Evidence V06

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-evidence-v06/control/*.request

permissions:
  contents: write

concurrency:
  group: onshape-fast-router-evidence-v06
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-evidence-v06/evidence_v06.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/corpus_v02.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/synthetic_holdout.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/run_v06.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/fresh_holdout_v08.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/run_v08.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/invariants_v08.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/fresh_holdout_v09.py
          python -m py_compile qualification/onshape-fast-router-evidence-v06/run_v09.py
      - name: Require Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"
      - name: Run fresh frozen holdout v09
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: '10'
          MAX_BATCH_RETRIES: '8'
          OUT_DIR: ${{ github.workspace }}/artifacts/onshape-fast-router-fresh-holdout-v09
        run: |
          cd qualification/onshape-fast-router-evidence-v06
          python run_v09.py

      - name: Publish v09 direct readback
        if: always()
        run: |
          set -eu
          src="artifacts/onshape-fast-router-fresh-holdout-v09"
          dst="reports/onshape-fast-router-fresh-holdout-v09"
          mkdir -p "$dst"
          if test -f "$src/summary.json"; then
            cp "$src/summary.json" "$dst/summary.json"
            cp "$src/rows.json" "$dst/rows.json"
          else
            printf '{"state":"NO_SUMMARY"}\n' > "$dst/latest-error.json"
          fi
          printf '{"run_id":"%s","head_sha":"%s","via":"v06-proven-pipeline"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: Onshape fresh holdout v09 via v06 pipeline" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Run v06 qualification
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: '10'
          MAX_BATCH_RETRIES: '8'
          OUT_DIR: ${{ github.workspace }}/artifacts/onshape-fast-router-evidence-v06
        run: |
          cd qualification/onshape-fast-router-evidence-v06
          python run_v06.py
      - name: Run v08 structural invariants and fresh holdout
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: '10'
          MAX_BATCH_RETRIES: '8'
          OUT_DIR: ${{ github.workspace }}/artifacts/onshape-fast-router-fresh-holdout-v08
        run: |
          mkdir -p "${{ github.workspace }}/artifacts/onshape-fast-router-fresh-holdout-v08"
          cd qualification/onshape-fast-router-evidence-v06
          python invariants_v08.py > "${{ github.workspace }}/artifacts/onshape-fast-router-fresh-holdout-v08/invariants.json"
          python run_v08.py

      - name: Publish direct readback
        if: always()
        run: |
          set -eu
          src="artifacts/onshape-fast-router-evidence-v06"
          dst="reports/onshape-fast-router-evidence-v06"
          mkdir -p "$dst"
          if test -f "$src/summary.json"; then
            cp "$src/"*.json "$dst/"
          else
            printf '{"state":"NO_SUMMARY"}\n' > "$dst/latest-error.json"
          fi
          printf '{"run_id":"%s","head_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: Onshape evidence router v06" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish v08 direct readback
        if: always()
        run: |
          set -eu
          src="artifacts/onshape-fast-router-fresh-holdout-v08"
          dst="reports/onshape-fast-router-fresh-holdout-v08"
          mkdir -p "$dst"
          if test -f "$src/summary.json"; then
            cp "$src/summary.json" "$dst/summary.json"
            cp "$src/rows.json" "$dst/rows.json"
            cp "$src/invariants.json" "$dst/invariants.json"
          else
            printf '{"state":"NO_SUMMARY"}\n' > "$dst/latest-error.json"
          fi
          printf '{"run_id":"%s","head_sha":"%s","via":"v06-proven-pipeline"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: Onshape fresh holdout v08 via v06 pipeline" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
