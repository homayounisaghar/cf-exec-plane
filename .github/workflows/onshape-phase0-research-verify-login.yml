name: Onshape Phase 0 Research Verify Login

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-phase0-research-verify-login/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-phase0-research-activate
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable verify request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-phase0-research-verify-login/*.request ]] || exit 11
          request_id="$(basename "$request_path" .request)"
          file_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          fixture="$(awk -F= '$1=="fixture"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$file_id" && "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 12
          [[ "$action" == "phase0-research-verify-login-v1" ]] || exit 13
          [[ "$candidate" == "d882fa763b3a55be5a18d6e196d028ff4f77ea07" ]] || exit 14
          [[ "$fixture" == "a19e0fa5152af9f7ce106b6e:e5e7d0173fd1f1d0307a2cb6:e0929361aadb6135b5cecffa" ]] || exit 15
          bash -n server-bootstrap/217-onshape-phase0-research-verify-login.sh
      - name: Mask endpoint
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Verify and authenticate research surface
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/217-onshape-phase0-research-verify-login.sh
