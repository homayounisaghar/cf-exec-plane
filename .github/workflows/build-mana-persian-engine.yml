name: Build Mana Persian TTS Engine

on:
  push:
    branches: [main]
    paths:
      - mana-engine/control/*.request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build source-native Mana engine v3
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mana-engine-v3"
          src="$work/sherpa-onnx"
          mkdir -p "$work"

          git clone --depth 1 --branch v1.13.4 https://github.com/k2-fsa/sherpa-onnx.git "$src"

          engine_url="https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/main/tts-engine-new/1.13.4/sherpa-onnx-1.13.4-arm64-v8a-fas-tts-engine-vits-piper-fa_IR-ganji_adabi-medium.apk"
          mana_model="https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/d7ec7b55362a11c2b79907188bd6e71acc19d9b0/fa_IR-mana-medium.onnx"
          mana_cfg="https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/cafdcbdb455e4a9ab2ef18dccb3e21dce6a25ee9/fa_IR-mana-medium.onnx.json"

          curl -L --fail --retry 3 --retry-all-errors -o "$work/base.apk" "$engine_url"
          curl -L --fail --retry 3 --retry-all-errors -o "$work/mana.onnx" "$mana_model"
          curl -L --fail --retry 3 --retry-all-errors -o "$work/mana.json" "$mana_cfg"
          echo "e390c0e74ba71fd97c49ba662ee0c6e1724b462ba2d4561698af4f564840f126  $work/mana.onnx" | sha256sum -c -

          python3 -m pip -q install onnx==1.17.0
          python3 - "$work/mana.onnx" "$work/mana.json" "$work/tokens.txt" <<'PY'
          import json,sys,onnx
          model_path,cfg_path,tokens_path=sys.argv[1:]
          cfg=json.load(open(cfg_path,encoding='utf-8'))
          with open(tokens_path,'w',encoding='utf-8') as f:
              for s, ids in cfg['phoneme_id_map'].items():
                  f.write(f"{s} {ids[0]}\n")
          m=onnx.load(model_path)
          wanted={
              'model_type':'vits',
              'comment':'piper',
              'language':'Persian',
              'voice':'fa',
              'has_espeak':'1',
              'n_speakers':'1',
              'sample_rate':'22050',
          }
          kept=[p for p in m.metadata_props if p.key not in wanted]
          del m.metadata_props[:]
          for p in kept:
              q=m.metadata_props.add(); q.key=p.key; q.value=p.value
          for k,v in wanted.items():
              q=m.metadata_props.add(); q.key=k; q.value=v
          onnx.save(m,model_path)
          PY

          mkdir -p "$work/base"
          unzip -q "$work/base.apk" -d "$work/base"

          app="$src/android/SherpaOnnxTtsEngine/app"
          rm -rf "$app/src/main/assets"
          mkdir -p "$app/src/main/assets" "$app/src/main/jniLibs/arm64-v8a"
          cp -a "$work/base/assets/." "$app/src/main/assets/"
          rm -rf "$app/src/main/assets/dexopt"
          cp "$work/base/lib/arm64-v8a/"*.so "$app/src/main/jniLibs/arm64-v8a/"

          model_rel="$(find "$app/src/main/assets" -type f -name '*ganji_adabi*onnx' | head -n1)"
          test -n "$model_rel"
          model_dir="$(basename "$(dirname "$model_rel")")"
          model_name="$(basename "$model_rel")"
          token_rel="$(dirname "$model_rel")/tokens.txt"
          test -f "$token_rel"
          cp "$work/mana.onnx" "$model_rel"
          cp "$work/tokens.txt" "$token_rel"

          tts="$app/src/main/java/com/k2fsa/sherpa/onnx/tts/engine/TtsEngine.kt"
          python3 - "$tts" "$model_dir" "$model_name" <<'PY'
          import sys
          p,model_dir,model_name=sys.argv[1:]
          s=open(p,encoding='utf-8').read()
          s=s.replace('modelName = null','modelName = "'+model_name+'"',1)
          s=s.replace('modelDir = null','modelDir = "'+model_dir+'"',1)
          s=s.replace('dataDir = null','dataDir = "'+model_dir+'/espeak-ng-data"',1)
          s=s.replace('lang = null','lang = "fas"',1)
          open(p,'w',encoding='utf-8').write(s)
          PY

          gradle="$app/build.gradle.kts"
          python3 - "$gradle" <<'PY'
          import sys,re
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          s=s.replace('applicationId = "com.k2fsa.sherpa.onnx.tts.engine"','applicationId = "com.mana.persian.offline.tts.v3"')
          s=re.sub(r'versionCode\s*=\s*\d+','versionCode = 3001',s,1)
          s=re.sub(r'versionName\s*=\s*"[^"]+"','versionName = "3.0.1-mana"',s,1)
          open(p,'w',encoding='utf-8').write(s)
          PY

          manifest="$app/src/main/AndroidManifest.xml"
          sed -i 's#android:authorities="com.k2fsa.sherpa.onnx.tts.engine.fileprovider"#android:authorities="${applicationId}.fileprovider"#' "$manifest"

          strings="$app/src/main/res/values/strings.xml"
          python3 - "$strings" <<'PY'
          import sys,re
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'(<string name="app_name">).*?(</string>)',r'\1Mana Persian Offline TTS v3\2',s)
          open(p,'w',encoding='utf-8').write(s)
          PY

          printf '%s\n' \
            'Mana Persian Piper source-built Android TTS engine v3' \
            'application_id=com.mana.persian.offline.tts.v3' \
            'sherpa_onnx_tag=v1.13.4' \
            'source_model_sha256=e390c0e74ba71fd97c49ba662ee0c6e1724b462ba2d4561698af4f564840f126' \
            > "$app/src/main/assets/MANA_ENGINE_BUILD.txt"

          cd "$src/android/SherpaOnnxTtsEngine"
          ./gradlew --no-daemon :app:assembleRelease

          unsigned="$app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned"

          aapt2_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$aapt2_bin" && test -x "$apksigner_bin"

          "$aapt2_bin" dump badging "$unsigned" | tee "$GITHUB_WORKSPACE/mana-persian-engine-v3-badging.txt"
          grep -q "package: name='com.mana.persian.offline.tts.v3'" "$GITHUB_WORKSPACE/mana-persian-engine-v3-badging.txt"
          unzip -t "$unsigned" >/dev/null

          cp "$unsigned" "$GITHUB_WORKSPACE/mana-persian-engine-v3-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/mana-persian-engine-v3-unsigned.apk" > "$GITHUB_WORKSPACE/mana-persian-engine-v3-unsigned.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mana-persian-engine-v3-unsigned
          path: |
            mana-persian-engine-v3-unsigned.apk
            mana-persian-engine-v3-unsigned.sha256
            mana-persian-engine-v3-badging.txt
          retention-days: 7
