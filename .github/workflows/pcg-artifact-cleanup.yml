name: PCG Screenshot Artifact Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/pcg-artifact-cleanup-requests/*.request'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable cleanup request
        id: request
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/pcg-artifact-cleanup-requests/*.request ]] || exit 12
          artifact_id="$(awk -F= '$1=="artifact_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || exit 13
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Delete screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          set -euo pipefail
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          echo "PCG_SCREENSHOT_ARTIFACT_DELETED=yes"
