name: Onshape Phase 0 Exec Reference Discovery
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-phase0-exec-reference/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-phase0-research-activate
  cancel-in-progress: false
jobs:
  inspect:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-phase0-exec-reference/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == phase0-exec-reference-v1 ]]
          [[ "$(awk -F= '$1=="candidate_commit"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == dbb08f8257b4e72e31e203497fa135acdeda5e5b ]]
          bash -n server-bootstrap/233-onshape-phase0-exec-reference.sh
      - name: Mask endpoint
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Inspect loaded execution references
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/233-onshape-phase0-exec-reference.sh
