name: Dexa Kata Verified Prior Chat Scope V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-kata-prior-chat-scope-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-kata-prior-chat-scope-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify single immutable request, pinned private source and snapshot
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-kata-prior-chat-scope-v1/dexa-kata-prior-chat-scope-v1-20261102-v1.request
          dir=qualification/dexa-kata-prior-chat-scope-v1-20261102
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          grep -Fxq 'request_id=dexa-kata-prior-chat-scope-v1-20261102-v1' "$req"
          grep -Fxq 'source_commit=05e66b001c8901599958c24649fa6ad259d5b29e' "$req"
          [[ "$(wc -l < "$req")" -eq 2 ]]
          [[ "$(git hash-object "$dir/kata_scope.patch")" == 2271f74dc23d3e35fd9296182e731ff4f58024e9 ]]
          [[ "$(git hash-object "$dir/test_dexa_kata_verified_list_scope_v1.py")" == 444faa498da3ee08efbf113a7133b3ba1177d028 ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == 1cddcfc229c4c351b0b2a971a0640f6381a87c1c ]]
          bash -n "$dir/deploy.sh"
      - name: Pin SSH host and owner account
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mkdir -m 700 "$RUNNER_TEMP/dexa-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/dexa-ssh/key"
          chmod 600 "$RUNNER_TEMP/dexa-ssh/key"
          read -r alg key extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$alg" == ssh-ed25519 && -n "$key" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$key" > "$RUNNER_TEMP/dexa-ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$key" >> "$RUNNER_TEMP/dexa-ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Upload minimal secret-free patch and install without restarting service
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-kata-prior-chat-scope-v1-20261102
          remote=/tmp/dexa-kata-prior-chat-scope-v1-20261102
          opts=(-i "$RUNNER_TEMP/dexa-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dexa-ssh/known_hosts")
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 700 $remote"
          for f in kata_scope.patch test_dexa_kata_verified_list_scope_v1.py deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$f" "$VPS_SSH_USER@$VPS_HOST:$remote/$f"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "if [ \$(id -u) -eq 0 ]; then chown -R cfserver:cfserver $remote; runuser -u cfserver -- bash $remote/deploy.sh; else bash $remote/deploy.sh; fi" </dev/null
          echo DEPLOY_REQUESTED_VERIFY_FROM_LIVE_SERVICE
