name: Onshape Post Canary Verify

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-post-canary-verify/*.request'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable post-canary request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-post-canary-verify/*.request ]] || exit 11
          [[ "$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "verify-first-material-canary-green" ]] || exit 12
          bash -n server-bootstrap/133-onshape-post-canary-verify.sh
          awk '/<<'"'"'NODE'"'"'/{capture=1;next} /^NODE$/{if(capture){exit}} capture' server-bootstrap/133-onshape-post-canary-verify.sh > /tmp/postcanary.mjs
          [[ -s /tmp/postcanary.mjs ]] || exit 13
          node --check /tmp/postcanary.mjs
      - name: Verify first material canary final state
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/133-onshape-post-canary-verify.sh
