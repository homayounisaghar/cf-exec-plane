name: Onshape R7 Pull Lock Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-r7-lock-diagnostic/*.request'
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-r7-lock-diagnostic/*.request ]]
          bash -n server-bootstrap/203-onshape-r7-lock-diagnostic.sh
      - name: Diagnose pull lock
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/203-onshape-r7-lock-diagnostic.sh
