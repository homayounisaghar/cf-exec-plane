name: Onshape Fast Router Synthetic Holdout V05

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-synthetic-holdout-v05/control/*.request

permissions:
  contents: write

concurrency:
  group: onshape-fast-router-synthetic-holdout-v05
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-synthetic-holdout-v05/benchmark.py
          python -m py_compile qualification/onshape-fast-router-synthetic-holdout-v05/corpus_v02.py
          python -m py_compile qualification/onshape-fast-router-synthetic-holdout-v05/hybrid_broad.py
          python -m py_compile qualification/onshape-fast-router-synthetic-holdout-v05/synthetic_holdout.py
          python -m py_compile qualification/onshape-fast-router-synthetic-holdout-v05/hybrid_holdout.py

      - name: Require Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"

      - name: Run frozen synthetic holdout
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: '12'
          MAX_BATCH_RETRIES: '12'
          OUT_DIR: ${{ github.workspace }}/artifacts/onshape-fast-router-synthetic-holdout-v05
        run: |
          cd qualification/onshape-fast-router-synthetic-holdout-v05
          python hybrid_holdout.py

      - name: Publish direct readback report
        if: always()
        run: |
          set -eu
          report_dir="reports/onshape-fast-router-synthetic-holdout-v05"
          mkdir -p "$report_dir"
          cp artifacts/onshape-fast-router-synthetic-holdout-v05/summary.json "$report_dir/latest-summary.json"
          cp artifacts/onshape-fast-router-synthetic-holdout-v05/rows.json "$report_dir/latest-rows.json"
          printf '{"run_id":"%s","head_sha":"%s","request":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ github.event.head_commit.message }}" > "$report_dir/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$report_dir"
          git commit -m "Report: synthetic Onshape router holdout v05" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
