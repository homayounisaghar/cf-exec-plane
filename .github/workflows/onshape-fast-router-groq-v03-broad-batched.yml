name: Onshape Fast Router Groq V03 Broad Batched

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-groq-v03-broad-batch/control/*.request

permissions:
  contents: read

concurrency:
  group: onshape-fast-router-groq-v03-broad
  cancel-in-progress: true

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-groq-v03-broad/benchmark.py
          python -m py_compile qualification/onshape-fast-router-groq-v03-broad/corpus_v02.py
          python -m py_compile qualification/onshape-fast-router-groq-v03-broad/batched_broad.py

      - name: Require Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"

      - name: Run batched shard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '4'
          BATCH_SIZE: '4'
          BATCH_DELAY: '8.2'
          INITIAL_STAGGER: '2.0'
          OUT_DIR: artifacts/onshape-fast-router-groq-v03-broad
        run: python qualification/onshape-fast-router-groq-v03-broad/batched_broad.py

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v03-broad-batch-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/onshape-fast-router-groq-v03-broad/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v03-broad-batch-shard-*-${{ github.run_id }}
          path: downloaded
          merge-multiple: false

      - name: Aggregate
        env:
          INPUT_ROOT: downloaded
          OUT_DIR: artifacts/onshape-fast-router-groq-v03-broad-final
        run: python qualification/onshape-fast-router-groq-v03-broad/aggregate_shards.py

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v03-broad-batch-final-${{ github.run_id }}
          path: artifacts/onshape-fast-router-groq-v03-broad-final/
          if-no-files-found: warn
          retention-days: 14
