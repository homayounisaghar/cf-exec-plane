name: Onshape Phase 5 Terminal Lab Cleanup
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-phase5-terminal-lab-cleanup/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-production-maintenance
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable cleanup request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r status p <<<"${c[0]}"
          [[ "$status" == A && "$p" == server-bootstrap/control/onshape-phase5-terminal-lab-cleanup/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-phase5-terminal-lab-cleanup-v1 ]]
          expected="$(awk -F= '$1=="expected_script_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          [[ "$expected" == 948d0f60b606ba89dc96e00f038e52e63e939be7 ]]
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/304-onshape-phase5-terminal-lab-cleanup.sh")" == "$expected" ]]
          bash -n server-bootstrap/304-onshape-phase5-terminal-lab-cleanup.sh
      - name: Retire terminal lab state
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/304-onshape-phase5-terminal-lab-cleanup.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_PHASE5_TERMINAL_CLEANUP_PROOF=ABSENT-reconciled-no-recoverable-no-lease' <<<"$out"
          grep -Fxq 'CF_PHASE5_TERMINAL_CLEANUP=retired' <<<"$out"
