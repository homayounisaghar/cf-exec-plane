name: PCG WeChat R241 Postdeploy Verify

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-wechat-r241-postdeploy/*.request

permissions:
  contents: read

concurrency:
  group: pcg-wechat-r241-postdeploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]]
          [[ "$request_path" == server-bootstrap/control/pcg-wechat-r241-postdeploy/*.request ]]
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_wechat_pid="$(awk -F= '$1=="expected_wechat_pid"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]]
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_wechat_pid" =~ ^[0-9]+$ ]]
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "expected_wechat_pid=$expected_wechat_pid" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          tmp="${RUNNER_TEMP}/ssh"
          install -d -m 0700 "$tmp"
          printf '%s\n' "$VPS_SSH_KEY" > "$tmp/key"; chmod 0600 "$tmp/key"
          read -r hkt hkd extra <<< "${VPS_HOST_KEY//$'\r'/}"
          [[ "$hkt" == ssh-ed25519 && -n "$hkd" && -z "${extra:-}" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$hkt" "$hkd" > "$tmp/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$hkt" "$hkd" >> "$tmp/known_hosts"
          echo "SSH_DIR=$tmp" >> "$GITHUB_ENV"; echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Verify direct host state
        env:
          CANDIDATE_COMMIT: ${{ steps.request.outputs.candidate_commit }}
          EXPECTED_WECHAT_PID: ${{ steps.request.outputs.expected_wechat_pid }}
        shell: bash
        run: |
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" "${VPS_SSH_USER}@${VPS_HOST}" "CANDIDATE_COMMIT='$CANDIDATE_COMMIT' EXPECTED_WECHAT_PID='$EXPECTED_WECHAT_PID' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$(id -u)" -eq 0 ]]
          active=/opt/capability-fabric/current
          for _ in $(seq 1 36); do
            if [[ -r "$active/manifest.json" ]]; then
              seqv="$(python3 -c 'import json; print(json.load(open("/opt/capability-fabric/current/manifest.json")).get("sequence"))')"
              if [[ "$seqv" == 241 ]]; then break; fi
            fi
            sleep 5
          done
          python3 - "$active/manifest.json" "$CANDIDATE_COMMIT" <<'PY'
          import json,sys,os
          m=json.load(open(sys.argv[1]))
          assert m["sequence"]==241
          assert m["release_id"]=="onshape-vps-fast-r100-direct-orbit1-paa-storage-r241-wechat-parity1"
          source="/opt/capability-fabric/current/source-commit"
          assert os.path.isfile(source)
          assert open(source).read().strip()==sys.argv[2]
          assert "wechat-ingress.mjs" in m["files"]
          assert "wechat-preload.mjs" in m["files"]
          PY

          [[ "$(curl -fsS --max-time 5 http://127.0.0.1:8787/)" == "cf-onshape-single ok" ]]
          [[ "$(curl -fsS --max-time 5 http://127.0.0.1:8788/)" == "cf-onshape-single ok" ]]

          curl -fsS --max-time 5 http://127.0.0.1:9333/status >/tmp/pcg-r241-bale.json
          curl -fsS --max-time 5 http://127.0.0.1:9334/status >/tmp/pcg-r241-whatsapp.json
          curl -fsS --max-time 5 http://127.0.0.1:9335/status >/tmp/pcg-r241-alibaba.json
          curl -fsS --max-time 5 http://127.0.0.1:9337/status >/tmp/pcg-r241-wechat.json

          python3 - "$CANDIDATE_COMMIT" "$EXPECTED_WECHAT_PID" <<'PY'
          import json,sys,time,subprocess
          candidate,expected=sys.argv[1],int(sys.argv[2])
          bale=json.load(open("/tmp/pcg-r241-bale.json"))
          wa=json.load(open("/tmp/pcg-r241-whatsapp.json"))
          ali=json.load(open("/tmp/pcg-r241-alibaba.json"))
          wc=json.load(open("/tmp/pcg-r241-wechat.json"))
          assert bale.get("state")=="READY" and bale.get("detail")=="AUTHENTICATED_CHAT"
          assert wa.get("state")=="READY" and wa.get("detail")=="AUTHENTICATED_CHAT"
          assert ali.get("state")=="READY" and ali.get("detail")=="AUTHENTICATED_MESSAGE_CENTER"
          assert wc.get("ok") is True and wc.get("authenticated") is True
          mainpid=int(subprocess.check_output(["systemctl","show","capability-fabric-pcg-wechat.service","-p","MainPID","--value"],text=True).strip())
          assert mainpid==expected,(mainpid,expected)
          out={
            "ok":True,
            "candidate_commit":candidate,
            "sequence":241,
            "release_id":"onshape-vps-fast-r100-direct-orbit1-paa-storage-r241-wechat-parity1",
            "cf_gateway_ok":True,
            "cf_server_ok":True,
            "bale_ready":True,
            "whatsapp_ready":True,
            "alibaba_ready":True,
            "wechat_authenticated":True,
            "wechat_main_pid":mainpid,
            "wechat_restarted":False,
            "written_at":int(time.time())
          }
          open("/var/lib/capability-fabric/paa-remote/pcg-wechat-r241-postdeploy-proof.json","w").write(json.dumps(out,separators=(",",":")))
          PY
          chown paa_remote:paa_remote /var/lib/capability-fabric/paa-remote/pcg-wechat-r241-postdeploy-proof.json
          chmod 0600 /var/lib/capability-fabric/paa-remote/pcg-wechat-r241-postdeploy-proof.json
          REMOTE
