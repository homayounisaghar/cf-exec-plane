name: Bluke Windows HID Diagnostic Build

on:
  push:
    branches:
      - build/bluke-keyboard-v1-20261102
    paths:
      - 'projects/bluke-keyboard/windows/**'
      - '.github/workflows/bluke-keyboard-build.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bridge source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows bridge
        shell: pwsh
        run: |
          dotnet publish projects/bluke-keyboard/windows/BlukeLanguageBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/windows
          if (!(Test-Path out/windows/BlukeLanguageBridge.exe)) { throw "Windows bridge executable missing" }

      - name: Publish diagnostic bridge ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "out/Bluke-Language-Bridge-Windows-x64-v1.2.3-diagnostic.zip"
          Compress-Archive -Path "out/windows/*" -DestinationPath $zip -Force
          $tag = "bluke-language-bridge-v1.2.3-diagnostic"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title "Bluke Windows Language Bridge v1.2.3 diagnostic" --notes "Self-contained Windows x64 bridge with HID interface diagnostics. Does not alter pairing or device settings." --prerelease
          }
