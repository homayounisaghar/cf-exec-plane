name: Bluke Persian Keyboard Build

on:
  push:
    branches:
      - build/bluke-keyboard-v1-20261102
    paths-ignore:
      - 'projects/bluke-keyboard/exports/**'
      - 'projects/bluke-keyboard/artifacts/**'
      - '.github/workflows/bluke-keyboard-build.yml'
      - '.github/workflows/bluke-signed-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout secret-free build snapshot
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Fetch pinned upstream Bluke source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arnav-kr/Bluke.git upstream
          git -C upstream checkout bcf4f1492b51bcbb97fc7b792f73ad6bed75c759
          test "$(git -C upstream rev-parse HEAD)" = "bcf4f1492b51bcbb97fc7b792f73ad6bed75c759"
          cp projects/bluke-keyboard/android/bluke-keyboard.patch upstream/bluke-keyboard.patch
          cd upstream
          git apply --check bluke-keyboard.patch
          git apply bluke-keyboard.patch
          grep -q 'applicationId = "dev.arnv.bluke.persian"' app/build.gradle.kts
          grep -q 'HOST_LAYOUT_REPORT_ID = 5' app/src/main/java/dev/arnv/bluke/bluetooth/HostLayoutReport.kt
          grep -q 'Vendor Defined 0xFF00' app/src/main/java/dev/arnv/bluke/bluetooth/GamepadDescriptor.kt
          grep -q 'PERSIAN_STANDARD' app/src/main/java/dev/arnv/bluke/ui/KeyboardCharacterLayouts.kt
          grep -q '"PrtSc"' app/src/main/java/dev/arnv/bluke/ui/KeyboardLayouts.kt

      - name: Build tests and unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          # Gradle's debug keystore gives the owner an installable test APK without the previous signing key.
          sed -i '/signingConfig = signingConfigs.getByName("release")/d' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify installable debug-signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android
          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk | grep "package: name='dev.arnv.bluke.persian' versionCode='13' versionName='1.2.2'"
          unzip -l out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk | grep -q 'classes.dex'
          sha256sum out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk > out/android/SHA256SUMS.txt
          printf '%s\n' 'upstream=arnav-kr/Bluke' 'upstream_commit=bcf4f1492b51bcbb97fc7b792f73ad6bed75c759' 'application_id=dev.arnv.bluke.persian' 'version_code=13' 'version_name=1.2.2' 'signing=gradle-debug-keystore' > out/android/BUILD-METADATA.txt

      - name: Publish verified APK as a public release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='bluke-persian-v1.2.2-debug-signed'
          ASSETS=(
            out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk
            out/android/SHA256SUMS.txt
            out/android/BUILD-METADATA.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title 'Bluke Persian Keyboard v1.2.2 (debug-signed)' \
              --notes 'Verified Android APK and build metadata. APK is signed with the Gradle debug key for owner testing; uninstall any previous differently signed app first.' \
              --prerelease
          fi

      - name: Export APK to the public repository in bounded text chunks
        shell: bash
        run: |
          set -euo pipefail
          APK='out/android/Bluke-Persian-v1.2.2-debug-signed-aligned.apk'
          EXPORT_DIR='projects/bluke-keyboard/exports/v1.2.2'
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"
          base64 -w0 "$APK" > /tmp/bluke-persian-v1.2.2.apk.b64
          split -b 240000 -d -a 3 /tmp/bluke-persian-v1.2.2.apk.b64 "$EXPORT_DIR/apk.b64.part-"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          BYTES="$(stat -c %s "$APK")"
          PARTS="$(find "$EXPORT_DIR" -name 'apk.b64.part-*' | wc -l)"
          printf 'file=Bluke-Persian-v1.2.2-debug-signed-aligned.apk\nbytes=%s\nparts=%s\nsha256=%s\nencoding=base64\nchunk_bytes=240000\n' "$BYTES" "$PARTS" "$SHA" > "$EXPORT_DIR/MANIFEST.txt"
          cp out/android/SHA256SUMS.txt "$EXPORT_DIR/"
          cp out/android/BUILD-METADATA.txt "$EXPORT_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$EXPORT_DIR"
          git commit -m 'Export Bluke Persian v1.2.2 APK in bounded chunks [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bridge source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows bridge
        shell: pwsh
        run: |
          dotnet publish projects/bluke-keyboard/windows/BlukeLanguageBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/windows
          if (!(Test-Path out/windows/BlukeLanguageBridge.exe)) { throw "Windows bridge executable missing" }

      - name: Publish Windows companion as a public release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "out/Bluke-Language-Bridge-Windows-x64.zip"
          Compress-Archive -Path "out/windows/*" -DestinationPath $zip -Force
          $tag = "bluke-language-bridge-v1.2.2"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title "Bluke Windows Language Bridge v1.2.2" --notes "Self-contained Windows x64 companion. No .NET runtime installation required."
          }

