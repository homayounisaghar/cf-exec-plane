name: Bluke Bluetooth Language Bridge Build

on:
  push:
    branches:
      - build/bluke-keyboard-v1-20261102
    paths:
      - 'projects/bluke-keyboard/android/bluke-keyboard.patch'
      - 'projects/bluke-keyboard/windows/**'
      - '.github/workflows/bluke-keyboard-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout secret-free build snapshot
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply Bluke Android Bluetooth layout update
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arnav-kr/Bluke.git upstream
          git -C upstream checkout bcf4f1492b51bcbb97fc7b792f73ad6bed75c759
          cp projects/bluke-keyboard/android/bluke-keyboard.patch upstream/bluke-keyboard.patch
          cd upstream
          git apply --check bluke-keyboard.patch
          git apply bluke-keyboard.patch
          grep -q 'applicationId = "dev.arnv.bluke.persian"' app/build.gradle.kts
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "1.2.3"' app/build.gradle.kts
          grep -q 'CURRENT_HID_DESCRIPTOR_REVISION = 7' app/src/main/java/dev/arnv/bluke/bluetooth/HidDescriptorRevision.kt
          grep -q 'HOST_LAYOUT_REPORT_ID = 1' app/src/main/java/dev/arnv/bluke/bluetooth/HostLayoutReport.kt
          grep -q 'Bluke layout bit 2' app/src/main/java/dev/arnv/bluke/bluetooth/GamepadDescriptor.kt
          ! grep -q 'REPORT_ID (5)' app/src/main/java/dev/arnv/bluke/bluetooth/GamepadDescriptor.kt

      - name: Build debug-signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          sed -i '/signingConfig = signingConfigs.getByName("release")/d' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and publish Android APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/android
          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" out/android/Bluke-Persian-v1.2.3-bluetooth-layout-debug-signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 out/android/Bluke-Persian-v1.2.3-bluetooth-layout-debug-signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose out/android/Bluke-Persian-v1.2.3-bluetooth-layout-debug-signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/android/Bluke-Persian-v1.2.3-bluetooth-layout-debug-signed.apk | grep "package: name='dev.arnv.bluke.persian' versionCode='14' versionName='1.2.3'"
          sha256sum out/android/Bluke-Persian-v1.2.3-bluetooth-layout-debug-signed.apk > out/android/SHA256SUMS.txt
          printf '%s\n' 'application_id=dev.arnv.bluke.persian' 'version_code=14' 'version_name=1.2.3' 'layout_transport=keyboard_output_report_1_bits_5_to_7' 'signing=gradle-debug-keystore' > out/android/BUILD-METADATA.txt
          TAG='bluke-persian-v1.2.3-bluetooth-layout'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/android/Bluke-Persian-v1.2.3-bluetooth-layout-debug-signed.apk out/android/SHA256SUMS.txt out/android/BUILD-METADATA.txt --clobber
          else
            gh release create "$TAG" out/android/Bluke-Persian-v1.2.3-bluetooth-layout-debug-signed.apk out/android/SHA256SUMS.txt out/android/BUILD-METADATA.txt --target "$GITHUB_SHA" --title "Bluke Persian Keyboard v1.2.3 Bluetooth layout" --notes "Debug-signed APK. Layout code travels in bits 5..7 of the existing keyboard output report ID 1. Uninstall a differently signed previous APK before installing." --prerelease
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bridge source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows bridge
        shell: pwsh
        run: |
          dotnet publish projects/bluke-keyboard/windows/BlukeLanguageBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/windows
          if (!(Test-Path out/windows/BlukeLanguageBridge.exe)) { throw "Windows bridge executable missing" }

      - name: Publish Windows bridge ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "out/Bluke-Language-Bridge-Windows-x64-v1.2.4.zip"
          Compress-Archive -Path "out/windows/*" -DestinationPath $zip -Force
          $tag = "bluke-language-bridge-v1.2.4-bluetooth-layout"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title "Bluke Windows Language Bridge v1.2.4" --notes "Self-contained Windows x64 bridge. Finds the paired Android HID keyboard collection by the VID/PID observed in the owner's HID scan and sends the language code in output report ID 1 bits 5..7. No Wi-Fi or re-pairing requested." --prerelease
          }
