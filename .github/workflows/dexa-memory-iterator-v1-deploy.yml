name: Dexa Memory Iterator V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-memory-iterator-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-memory-iterator-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and exact source
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-memory-iterator-v1/dexa-memory-iterator-v1-20261102-v1.request
          dir=qualification/dexa-memory-iterator-v1-20261102
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(cat "$req")" == "request_id=dexa-memory-iterator-v1-20261102-v1" ]]
          [[ "$(git hash-object "$dir/dexa_memory_read_v1.mjs")" == 511c52b8af9d7eb33ee277f7cc07219a6b4de9a2 ]]
          [[ "$(git hash-object "$dir/test_dexa_memory_to_writer_translation_v1.mjs")" == 7e5ec315cef606dceea2be1cd64e3027ea5a7b3e ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == 01638051623a2f8d71ad2feee7d65a183e1fe26b ]]
          bash -n "$dir/deploy.sh"
      - name: Prepare pinned VPS access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mkdir -m 700 "$RUNNER_TEMP/dexa-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/dexa-ssh/key"
          chmod 600 "$RUNNER_TEMP/dexa-ssh/key"
          read -r alg key extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$alg" == ssh-ed25519 && -n "$key" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$key" > "$RUNNER_TEMP/dexa-ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$key" >> "$RUNNER_TEMP/dexa-ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Transfer and run guarded Dexa-only correction
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-memory-iterator-v1-20261102
          remote=/tmp/dexa-memory-iterator-v1-20261102
          opts=(-i "$RUNNER_TEMP/dexa-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dexa-ssh/known_hosts")
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 700 $remote"
          for f in dexa_memory_read_v1.mjs test_dexa_memory_to_writer_translation_v1.mjs deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$f" "$VPS_SSH_USER@$VPS_HOST:$remote/$f"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "if [ \$(id -u) -eq 0 ]; then chown -R cfserver:cfserver $remote; runuser -u cfserver -- bash $remote/deploy.sh; else bash $remote/deploy.sh; fi" </dev/null
          echo CHECK_LIVE_SERVICE_NOT_WORKFLOW
