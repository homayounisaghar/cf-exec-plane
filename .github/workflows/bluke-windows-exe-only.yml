name: Bluke Windows EXE-only Release

on:
  push:
    branches:
      - build/bluke-keyboard-v1-20261102
    paths:
      - 'projects/bluke-keyboard/windows/**'
      - '.github/workflows/bluke-windows-exe-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact bridge source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish one self-contained EXE without PDB
        shell: pwsh
        run: |
          if (Test-Path out) { Remove-Item out -Recurse -Force }
          dotnet publish projects/bluke-keyboard/windows/BlukeLanguageBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=1.2.5 -p:AssemblyVersion=1.2.5.0 -p:FileVersion=1.2.5.0 -p:InformationalVersion=1.2.5 -o out
          $exe = "out/BlukeLanguageBridge.exe"
          if (!(Test-Path $exe)) { throw "Windows EXE missing" }
          if ((Get-ChildItem out -Filter *.pdb -File).Count -gt 0) { throw "PDB file must not be published" }
          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if ($fileVersion -ne "1.2.5.0") { throw "Unexpected EXE version: $fileVersion" }
          Get-Item $exe | Select-Object Name,Length
          Get-FileHash $exe -Algorithm SHA256

      - name: Publish only the executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "out/BlukeLanguageBridge.exe"
          $tag = "bluke-language-bridge-v1.2.5-exe-only"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --target $env:GITHUB_SHA --title "Bluke Windows Language Bridge v1.2.5" --notes "One self-contained Windows x64 executable only. No ZIP, no PDB, no separate .NET installation required. Uses the existing paired Bluke HID keyboard, VID:PID 2717:5070, output report ID 1 bits 5..7."
          }
