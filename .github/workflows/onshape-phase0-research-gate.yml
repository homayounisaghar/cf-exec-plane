name: Onshape Phase 0 Research Gate

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-phase0-research-gate/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-phase0-research-gate
  cancel-in-progress: false

jobs:
  test:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable Phase 0 request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-phase0-research-gate/*.request ]] || exit 11
          request_id="$(basename "$request_path" .request)"
          file_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$file_id" && "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 12
          [[ "$action" == "phase0-research-gate-v1" ]] || exit 13
          [[ "$candidate" == "ae9bc114d84cfd7991cbdd38489b18d33a2d34bf" ]] || exit 14
      - name: Mask host and login
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)
      - name: Test exact private Phase 0 candidate without deployment
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/214-onshape-phase0-research-gate.sh
