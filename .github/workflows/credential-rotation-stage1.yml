name: Personal Server Credential Rotation Stage1

on:
  push:
    branches:
      - main
    paths:
      - server-bootstrap/control/rotation-requests/**

permissions:
  contents: read

concurrency:
  group: personal-server-credential-rotation
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: resolve
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "rotation trigger commit must add exactly one request file" >&2; exit 1; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "rotation request must be newly added" >&2; exit 1; }
          [[ "$request_path" == server-bootstrap/control/rotation-requests/*.request ]] || { echo "unexpected rotation request path" >&2; exit 1; }
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id" {print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ -n "$file_request_id" && "$file_request_id" == "$request_id" ]] || { echo "request_id mismatch" >&2; exit 1; }
          action="$(awk -F= '$1=="action" {print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          case "$action" in setup|activate|verify-old) ;; *) echo "invalid rotation action" >&2; exit 1 ;; esac
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

  setup:
    needs: resolve
    if: needs.resolve.outputs.action == 'setup'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KEY_NEW: ${{ secrets.VPS_SSH_KEY_NEW }}
      VPS_SSH_PUBKEY_NEW: ${{ secrets.VPS_SSH_PUBKEY_NEW }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      CF_DEPLOY_SIGNING_PUBLIC_KEY_NEW: ${{ secrets.CF_DEPLOY_SIGNING_PUBLIC_KEY_NEW }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mask endpoint and derive existing non-root admin
        run: |
          set -euo pipefail
          for v in VPS_SSH_KEY VPS_SSH_KEY_NEW VPS_SSH_PUBKEY_NEW VPS_HOST VPS_SSH_USER VPS_HOST_KEY CF_DEPLOY_SIGNING_PUBLIC_KEY_NEW; do
            [[ -n "${!v:-}" ]] || { echo "missing required rotation Secret: $v" >&2; exit 2; }
          done
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)
          suffix="$(printf '%s' "$VPS_HOST" | sha256sum | awk '{print substr($1,1,10)}')"
          admin_user="cfop_${suffix}"
          printf '::add-mask::%s\n' "$admin_user"
          printf 'CF_ADMIN_USER=%s\n' "$admin_user" >> "$GITHUB_ENV"
      - name: Add new SSH public key without removing existing keys
        run: bash server-bootstrap/runner/install-rotation-material.sh ssh-pubkey
      - name: Install new deployment trust as additive second root
        run: bash server-bootstrap/runner/install-rotation-material.sh signing-key-next
      - name: Install dual-trust pull agent and prove old signature still accepted
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/70-key-rotation-stage1.sh
      - name: Prove fresh root SSH with new private key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY_NEW }}
        run: VPS_TEST_USER="$VPS_SSH_USER" REQUIRE_SUDO=no bash server-bootstrap/runner/ssh-test.sh
      - name: Prove fresh admin SSH and sudo with new private key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY_NEW }}
        run: VPS_TEST_USER="$CF_ADMIN_USER" REQUIRE_SUDO=yes bash server-bootstrap/runner/ssh-test.sh

  activate:
    needs: resolve
    if: needs.resolve.outputs.action == 'activate'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KEY_NEW: ${{ secrets.VPS_SSH_KEY_NEW }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
      CF_DEPLOY_SIGNING_PUBLIC_KEY: ${{ secrets.CF_DEPLOY_SIGNING_PUBLIC_KEY_NEW }}
      CF_DEPLOY_SIGNING_PRIVATE_KEY: ${{ secrets.CF_DEPLOY_SIGNING_PRIVATE_KEY_NEW }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mask endpoint and derive existing non-root admin
        run: |
          set -euo pipefail
          for v in VPS_SSH_KEY VPS_SSH_KEY_NEW VPS_HOST VPS_SSH_USER VPS_HOST_KEY CF_REPO_READ_TOKEN CF_DEPLOY_SIGNING_PUBLIC_KEY CF_DEPLOY_SIGNING_PRIVATE_KEY; do
            [[ -n "${!v:-}" ]] || { echo "missing required rotation Secret: $v" >&2; exit 2; }
          done
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)
          suffix="$(printf '%s' "$VPS_HOST" | sha256sum | awk '{print substr($1,1,10)}')"
          admin_user="cfop_${suffix}"
          printf '::add-mask::%s\n' "$admin_user"
          printf 'CF_ADMIN_USER=%s\n' "$admin_user" >> "$GITHUB_ENV"
      - name: Sign canonical candidate with new signing key and install detached signature
        run: bash server-bootstrap/runner/sign-and-install-release-v2.sh
      - name: Activate canonical release and verify specifically against new trust
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/71-key-rotation-activate.sh
      - name: Re-prove fresh root SSH with new private key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY_NEW }}
        run: VPS_TEST_USER="$VPS_SSH_USER" REQUIRE_SUDO=no bash server-bootstrap/runner/ssh-test.sh
      - name: Re-prove fresh admin SSH and sudo with new private key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY_NEW }}
        run: VPS_TEST_USER="$CF_ADMIN_USER" REQUIRE_SUDO=yes bash server-bootstrap/runner/ssh-test.sh
      - name: Confirm old root SSH still works
        run: VPS_TEST_USER="$VPS_SSH_USER" REQUIRE_SUDO=no bash server-bootstrap/runner/ssh-test.sh
      - name: Confirm old admin SSH and sudo still work
        run: VPS_TEST_USER="$CF_ADMIN_USER" REQUIRE_SUDO=yes bash server-bootstrap/runner/ssh-test.sh


  verify-old-access:
    needs: resolve
    if: needs.resolve.outputs.action == 'verify-old'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mask endpoint and derive existing non-root admin
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" && -n "$VPS_SSH_USER" ]] || { echo "required SSH endpoint/login Secret missing" >&2; exit 2; }
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)
          suffix="$(printf '%s' "$VPS_HOST" | sha256sum | awk '{print substr($1,1,10)}')"
          admin_user="cfop_${suffix}"
          printf '::add-mask::%s\n' "$admin_user"
          printf 'CF_ADMIN_USER=%s\n' "$admin_user" >> "$GITHUB_ENV"
      - name: Cool down SSH rate-limit window
        run: sleep 35
      - name: Verify old privileged SSH credential still works
        run: VPS_TEST_USER="$VPS_SSH_USER" REQUIRE_SUDO=no bash server-bootstrap/runner/ssh-test.sh
      - name: Verify old non-root admin SSH and sudo still work
        run: VPS_TEST_USER="$CF_ADMIN_USER" REQUIRE_SUDO=yes bash server-bootstrap/runner/ssh-test.sh
