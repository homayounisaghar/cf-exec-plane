name: Onshape Fabric Candidate Qualification

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/onshape-fabric-candidate-ci/*.request

permissions:
  contents: read

jobs:
  qualify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable qualification request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/onshape-fabric-candidate-ci/*.request ]] || { echo "unexpected request path" >&2; exit 12; }
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_sequence="$(awk -F= '$1=="expected_sequence"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_release="$(awk -F= '$1=="expected_release"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 13
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]] || exit 14
          [[ "$expected_sequence" =~ ^[0-9]+$ ]] || exit 15
          [[ "$expected_release" =~ ^[A-Za-z0-9_.-]{8,120}$ ]] || exit 16
          {
            echo "CANDIDATE_COMMIT=$candidate_commit"
            echo "EXPECTED_SEQUENCE=$expected_sequence"
            echo "EXPECTED_RELEASE=$expected_release"
          } >> "$GITHUB_ENV"

      - name: Checkout exact private Capability Fabric candidate
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/capability-fabric"
          askpass="$RUNNER_TEMP/cf-askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$CF_REPO_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 0700 "$askpass"
          git init "$tmp" >/dev/null
          git -C "$tmp" remote add origin https://github.com/homayounisaghar/capability-fabric.git
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$tmp" fetch --quiet --depth=1 origin "$CANDIDATE_COMMIT"
          git -C "$tmp" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$tmp" rev-parse HEAD)" == "$CANDIDATE_COMMIT" ]]
          printf 'CF_CANDIDATE_CHECKOUT=pass\n'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install canonical Python package
        working-directory: ${{ runner.temp }}/capability-fabric
        run: python -m pip install -e .

      - name: Node 24 syntax and agent gate
        working-directory: ${{ runner.temp }}/capability-fabric
        run: |
          node --check server-deploy/current/browser.js
          node --check server-deploy/current/browser-native.js
          node --check server-deploy/current/core.js
          node --check server-deploy/current/server.js
          node --check server-deploy/current/fabric-agent.js
          node --test server-deploy/current/fabric-agent.test.mjs

      - name: Canonical Python regression
        working-directory: ${{ runner.temp }}/capability-fabric
        run: |
          python -m compileall -q src/capability_fabric tests/v1_kernel tests/v1_persistence tests/onshape_vps_fabric
          python -m unittest discover -s tests/v1_kernel -p 'test_*.py' -v
          python -m unittest discover -s tests/v1_persistence -p 'test_*.py' -v
          python -m unittest discover -s tests/onshape_vps_fabric -p 'test_*.py' -v

      - name: Verify staged source mirrors canonical source
        working-directory: ${{ runner.temp }}/capability-fabric
        shell: bash
        run: |
          set -euo pipefail
          for f in control_ingress.py domain.py enforcement.py execution_agents.py kernel.py onshape_vps.py onshape_vps_sidecar.py onshape_vps_transport.py persistence.py policy_kernel.py ports.py; do
            cmp "src/capability_fabric/$f" "server-deploy/current/fabric-src/capability_fabric/$f"
          done
          cmp tests/onshape_vps_fabric/test_onshape_vps_runtime.py server-deploy/current/fabric-tests/test_onshape_vps_runtime.py
          cmp tests/onshape_vps_fabric/test_onshape_vps_transport.py server-deploy/current/fabric-tests/test_onshape_vps_transport.py
          cmp tests/onshape_vps_fabric/test_onshape_vps_sidecar_json.py server-deploy/current/fabric-tests/test_onshape_vps_sidecar_json.py

      - name: Staged Python regression
        working-directory: ${{ runner.temp }}/capability-fabric
        env:
          PYTHONPATH: server-deploy/current/fabric-src
        run: |
          python -m compileall -q server-deploy/current/fabric-src server-deploy/current/fabric-tests
          python -m unittest discover -s server-deploy/current/fabric-tests -p 'test_*.py' -v

      - name: Confirm immutable candidate identity
        working-directory: ${{ runner.temp }}/capability-fabric
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          m=json.loads(Path("server-deploy/current/manifest.json").read_text())
          assert m["sequence"] == int(os.environ["EXPECTED_SEQUENCE"])
          assert m["release_id"] == os.environ["EXPECTED_RELEASE"]
          for name, expected in m["files"].items():
              actual=hashlib.sha256((Path("server-deploy/current")/name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          print("CF_CANDIDATE_MANIFEST=pass")
          PY
