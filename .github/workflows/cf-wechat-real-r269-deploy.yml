name: CF WeChat r269 Real File Send Guarded Release
on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/cf-wechat-real-r269/*.request
permissions:
  contents: read
concurrency:
  group: cf-wechat-real-r269
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNAP: qualification/cf-wechat-real-r269/f574f5c9a3df74b979609fd2e15e65f09390cfae
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exactly one immutable owner instruction
        shell: bash
        run: |
          set -euo pipefail
          request=server-bootstrap/control/cf-wechat-real-r269/cf-wechat-real-r269-20261031-v1.request
          [[ "$(git diff --name-status HEAD^ HEAD)" == "$(printf 'A\t%s' "$request")" ]] || exit 10
          [[ "$(wc -l < "$request")" -eq 4 ]] || exit 11
          grep -Fxq 'request_id=cf-wechat-real-r269-20261031-v1' "$request"
          grep -Fxq 'candidate_commit=f574f5c9a3df74b979609fd2e15e65f09390cfae' "$request"
          grep -Fxq 'expected_sequence=269' "$request"
          grep -Fxq 'expected_release=onshape-vps-fast-r100-direct-orbit1-paa-storage-r269-wechat-real-file-send-20261031' "$request"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify minimal secret-free snapshot and dry-run-only tool gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$SNAP"
          printf '%s  %s\n' '32f96e63675f680d2d4ecef8367529f37dbf676b5b7442cb1ee9850d48768e73' wechat-media-tools.mjs | sha256sum -c -
          printf '%s  %s\n' '281aa17eb6916e52276e4b92bb65bbc1e7858be2ca86c6133a491e035c4ac390' wechat_media_cache_adapter_v1.mjs | sha256sum -c -
          printf '%s  %s\n' 'e58242ce0d8539564552ffa93040fe981af4375087e78ac00ab390631d4331ef' manifest.json | sha256sum -c -
          printf '%s  %s\n' '95808be3d3a4148d345acf4023cb06286e2b1cb6f5a5bf43708b35f34d30039e' release-closure.json | sha256sum -c -
          printf '%s  %s\n' '97347ee1af75cc895a4fabd2dbd921f075632727eff54bd27fc54c48743af18a' test_r267_stable_public.mjs | sha256sum -c -
          printf '%s  %s\n' '75cee2819528bc9b16504429464a2bcfd0911866fa22c60e74a4670ba5e55214' test_wechat_file_dryrun_bridge.mjs | sha256sum -c -
          printf '%s  %s\n' '12930969cef862fb55022828f1cd45848988b63fc949db8fb8e92112ea90b8c9' wechat_semantic_helper_r268_stream_dryrun.py | sha256sum -c -
          printf '%s  %s\n' '2a3ee95c9b820fc348bd38dbf19a3f11381d64b9e5936f252983be3d3fcfa262' test_wechat_helper_r268_stream_dryrun.py | sha256sum -c -
          printf '%s  %s\n' 'ee2cc0044811fc3036b9e029fe2699b57e6155c461fab81a2f77ac30fa4f97b1' activate-cf-r269-real-file-send-guarded.sh | sha256sum -c -
          node --check wechat-media-tools.mjs
          python3 -m py_compile wechat_semantic_helper_r268_stream_dryrun.py
          bash -n activate-cf-r269-real-file-send-guarded.sh
          node --test test_r267_stable_public.mjs test_wechat_file_dryrun_bridge.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          c=json.loads(Path('release-closure.json').read_text())
          assert m['sequence']==269
          assert m['release_id']=='onshape-vps-fast-r100-direct-orbit1-paa-storage-r269-wechat-real-file-send-20261031'
          assert c['build_id']==m['release_id']
          assert len(m['files'])==32 and set(c['files'])==set(m['files'])
          assert m['files']['wechat-media-tools.mjs']=='32f96e63675f680d2d4ecef8367529f37dbf676b5b7442cb1ee9850d48768e73'
          print('CF_WECHAT_R269_REAL_SEND_SOURCE_PASS')
          PY
          tar -czf "$RUNNER_TEMP/cf-wechat-real-r269-bundle.tgz" \
            wechat-media-tools.mjs wechat_media_cache_adapter_v1.mjs manifest.json release-closure.json \
            test_r267_stable_public.mjs test_wechat_file_dryrun_bridge.mjs \
            wechat_semantic_helper_r268_stream_dryrun.py test_wechat_helper_r268_stream_dryrun.py
      - name: Execute guarded scoped release via pinned owner SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 21
          dir="$RUNNER_TEMP/wechat-stream-r268-ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"
          chmod 0600 "$dir/key"
          read -r key_type key_data extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$dir/known_hosts"
          chmod 0600 "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          scp "${transport[@]}" -P "$port" "$RUNNER_TEMP/cf-wechat-real-r269-bundle.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-wechat-real-r269-bundle.tgz"
          scp "${transport[@]}" -P "$port" "$SNAP/activate-cf-r269-real-file-send-guarded.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/activate-cf-wechat-real-r269-guarded.sh"
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" \
            'set -e; test "$(id -u)" = 0; set +e; bash /tmp/activate-cf-wechat-real-r269-guarded.sh > /tmp/cf-wechat-real-r269-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/cf-wechat-real-r269-diagnostic.log; chmod 0640 /tmp/cf-wechat-real-r269-diagnostic.log; exit "$rc"' </dev/null
          echo CF_WECHAT_REAL_R269_GUARDED_SCRIPT_INVOKED_CONFIRM_LIVE_SERVER
