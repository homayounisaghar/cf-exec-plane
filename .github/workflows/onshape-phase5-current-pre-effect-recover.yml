name: Onshape Phase 5 Current Pre-Effect Recovery
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-phase5-current-pre-effect-recover/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-production-maintenance
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable current recovery request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r status p <<<"${c[0]}"
          [[ "$status" == A && "$p" == server-bootstrap/control/onshape-phase5-current-pre-effect-recover/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-phase5-current-pre-effect-recover-v1 ]]
          [[ "$(awk -F= '$1=="candidate_commit"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == ee6cecc2f23d40deeaeb19403f5f6cd790876714 ]]
          expected="$(awk -F= '$1=="expected_script_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          [[ "$expected" == 042c74bec31212c126c5e452a8fc43a4447f2799 ]]
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/305-onshape-phase5-current-pre-effect-recover.sh")" == "$expected" ]]
          bash -n server-bootstrap/305-onshape-phase5-current-pre-effect-recover.sh
      - name: Reconcile current preserved Attempt without replay
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/305-onshape-phase5-current-pre-effect-recover.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_PREFLIGHT_PRESERVED=unique-exact' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_PRE_EFFECT_PROOF=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_CONTEXT_RESOLUTION=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_RECOVERABLE=zero' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_DURABLE_TERMINAL=ABSENT' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_MARKER=cleared-after-terminal-proof' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_RECOVERY_RESTORE=production-green' <<<"$out"
