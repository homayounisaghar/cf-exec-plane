name: Onshape Session Pool R9 Precutover
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-session-pool-r9-precutover/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-session-pool-precutover
  cancel-in-progress: false
jobs:
  prove:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-session-pool-r9-precutover/*.request ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-session-pool-r9-precutover-v1 ]]
          bash -n server-bootstrap/284-onshape-session-pool-r9-precutover.sh
      - name: Prove signed candidate and current production boundary
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/284-onshape-session-pool-r9-precutover.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_POOL_R9_PREFLIGHT_READY_FOR_AUTHORIZATION=pass' <<<"$out"
