name: PCG r138 Telegram ASR Acquisition Repair
permissions:
  contents: read
concurrency:
  group: pcg-telegram-asr-r138
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      SNAP: qualification/pcg-telegram-asr-r138/3c1eef1aa8abe4afcd81be71e27795e1c799b4c9
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Authorize one immutable owner request
      shell: bash
      run: 'set -euo pipefail

        change="$(git diff --name-status HEAD^ HEAD)"

        [[ "$change" == $''A\tserver-bootstrap/control/pcg-telegram-asr-r138/pcg-telegram-asr-r138-20261026.request'' ]] || exit 11

        req=server-bootstrap/control/pcg-telegram-asr-r138/pcg-telegram-asr-r138-20261026.request

        grep -Fxq ''request_id=pcg-telegram-asr-r138-20261026'' "$req"

        grep -Fxq ''candidate_commit=3c1eef1aa8abe4afcd81be71e27795e1c799b4c9'' "$req"

        grep -Fxq ''expected_sequence=138'' "$req"

        grep -Fxq ''manifest_sha256=177c32b28afc6b9459bdb6f576c30d6cbf859220bd98113b202833c46268e9ae'' "$req"

        [[ "$(wc -l < "$req")" == 4 ]] || exit 12'
    - name: Rebuild and test only the PCG web r138 release
      shell: bash
      run: "set -euo pipefail\nPRIOR=qualification/pcg-telegram-bridge/629875b4b6f1a5f7bdc17011d02834d13dfb8d51/pcg-r137.patch\nBASE=qualification/pcg-web/4d12bcea796fe5c0a7c4e1b64d1e8f2e74d6b571\n\
        printf '%s  %s\\n' 427b16010399546df3fa7cf8b927412dd325cd1eb9b0a69417fcd30ec735bfd2 \"$PRIOR\" | sha256sum -c -\nprintf '%s\
        \  %s\\n' b1b4cd70055aca377f9192c5957434f0ea25caaec12b6d49b3aba108320029e3 \"$SNAP/pcg-r138-telegram-asr.patch\" | sha256sum\
        \ -c -\nprintf '%s  %s\\n' 7059ac8d0729d91e009c8be35f10fb951726da2232785c9af3c5c50769d2879b \"$SNAP/pcg_telegram_asr_material.mjs\"\
        \ | sha256sum -c -\nprintf '%s  %s\\n' bd0126a90981c47355a8695200884335f5db917489d9803cbc39ebe48462a206 \"$SNAP/pcg_telegram_asr_material.test.mjs\"\
        \ | sha256sum -c -\nprintf '%s  %s\\n' 898e24c5a0a04da23441557b1c49e5907b26bb7643f4f998aac3ccdde0952f10 \"$SNAP/activate-r138-web-only.sh\"\
        \ | sha256sum -c -\nprintf '%s  %s\\n' 177c32b28afc6b9459bdb6f576c30d6cbf859220bd98113b202833c46268e9ae \"$SNAP/manifest.json\"\
        \ | sha256sum -c -\ncp -a \"$BASE\" \"$RUNNER_TEMP/r138\"\npatch --batch --fuzz=0 -p1 -d \"$RUNNER_TEMP/r138\" < \"$PRIOR\"\n\
        printf '%s  %s\\n' fdd542629f3411ad1f68721f89f06ca4754cbf2908d809c239d1fed2712b320e \"$RUNNER_TEMP/r138/pcg_web_semantic_ops.mjs\"\
        \ | sha256sum -c -\npatch --batch --fuzz=0 -p1 -d \"$RUNNER_TEMP/r138\" < \"$SNAP/pcg-r138-telegram-asr.patch\"\ncp \"$SNAP/pcg_telegram_asr_material.mjs\"\
        \ \"$SNAP/pcg_telegram_asr_material.test.mjs\" \"$SNAP/activate-r138-web-only.sh\" \"$SNAP/manifest.json\" \"$RUNNER_TEMP/r138/\"\
        \nprintf '%s  %s\\n' 0acd14f45c08a5e9660a0260b88103c8331d41b74a35310451b3f74be5b72270 \"$RUNNER_TEMP/r138/pcg_web_semantic_ops.mjs\"\
        \ | sha256sum -c -\npython3 - <<'PY'\nimport os,json,hashlib,pathlib\np=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"r138\"\n\
        m=json.loads((p/\"manifest.json\").read_text())\nassert m[\"schema\"]==\"capability-fabric.deploy.v1\"\nassert m[\"sequence\"\
        ]==138 and m[\"release_id\"]==\"pcg-web-stage6-soniox-telegram-download-r138\"\nfor f,h in m[\"files\"].items():\n    assert\
        \ hashlib.sha256((p/f).read_bytes()).hexdigest()==h,f\ns=(p/\"pcg_web_semantic_ops.mjs\").read_text()\nassert \"acquireTelegramAudioMaterialDirect\"\
        \ in s\nassert \"webKPrepareLargeAttachmentDownload\" in s\nassert \"length:Math.min(2,files.length)\" in s\nprint(\"PCG_R138_INTEGRITY_AND_SOURCE_PASS\"\
        )\nPY\nnode --check \"$RUNNER_TEMP/r138/pcg_web_semantic_ops.mjs\"\nnode --check \"$RUNNER_TEMP/r138/pcg_telegram_asr_material.mjs\"\
        \nnode --test \"$RUNNER_TEMP/r138/pcg_telegram_asr_material.test.mjs\" \"$RUNNER_TEMP/r138/pcg_soniox_7sec.test.mjs\"\nbash\
        \ -n \"$SNAP/activate-r138-web-only.sh\"\ntar -czf \"$RUNNER_TEMP/pcg-r138-release.tgz\" -C \"$RUNNER_TEMP/r138\" ."
    - name: Publish PCG web only; preserve Soniox/Telegram/CF container identities
      shell: bash
      run: 'set -euo pipefail

        [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20

        port="$VPS_PORT";test -n "$port" || port=22

        case "$port" in *[!0-9]*) exit 21 ;; esac

        dir="$RUNNER_TEMP/ssh"

        install -d -m 0700 "$dir"

        printf ''%s\n'' "$VPS_SSH_KEY" > "$dir/key"

        chmod 0600 "$dir/key"

        read -r key_type key_data extra < <(printf ''%s\n'' "$VPS_HOST_KEY" | tr -d ''\r'')

        [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]] || exit 22

        printf ''%s %s %s\n'' "$VPS_HOST" "$key_type" "$key_data" > "$dir/known_hosts"

        printf ''[%s]:%s %s %s\n'' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$dir/known_hosts"

        transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")

        scp "${transport[@]}" -P "$port" "$RUNNER_TEMP/pcg-r138-release.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/pcg-r138-release.tgz"

        scp "${transport[@]}" -P "$port" "$SNAP/activate-r138-web-only.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/pcg-r138-activate.sh"

        ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" ''set -e; test "$(id -u)" = 0; bash /tmp/pcg-r138-activate.sh'' </dev/null

        echo "PCG_R138_WEB_ONLY_DEPLOY_COMPLETED"'
'on':
  push:
    branches:
    - main
    paths:
    - server-bootstrap/control/pcg-telegram-asr-r138/*.request
