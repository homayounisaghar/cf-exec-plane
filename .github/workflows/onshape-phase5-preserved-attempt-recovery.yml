name: Onshape Phase 5 Preserved Attempt Recovery

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-phase5-preserved-attempt-recovery/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-production-maintenance
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable recovery request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/onshape-phase5-preserved-attempt-recovery/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          attempt_id="$(awk -F= '$1=="attempt_id"{print substr($0,index($0,"=")+1)}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          context_id="$(awk -F= '$1=="context_id"{print substr($0,index($0,"=")+1)}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$action" == "onshape-phase5-preserved-attempt-recovery-v1" ]] || exit 14
          [[ "$expected_script_blob" == "8969608726ef4abc82a7f50d65ded071087f2986" ]] || exit 15
          [[ "$(git hash-object server-bootstrap/302-onshape-phase5-preserved-attempt-recovery.sh)" == "$expected_script_blob" ]] || exit 16
          [[ "$candidate_commit" == "c9e8104cfa2bebfc42bf4adddb458d66e60f67fc" ]] || exit 17
          [[ "$attempt_id" == "attempt:259ecb51-acdb-420b-a2fa-8f7ffc315750" ]] || exit 18
          [[ "$context_id" == "ctx_636105927daa35594f44d1fb5700348c" ]] || exit 19
          bash -n server-bootstrap/302-onshape-phase5-preserved-attempt-recovery.sh
          echo CF_PHASE5_RECOVERY_REQUEST=validated

      - name: Recover exact preserved Attempt
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/302-onshape-phase5-preserved-attempt-recovery.sh
