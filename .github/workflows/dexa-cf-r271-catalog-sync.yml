name: Dexa CF r271 Catalog Sync
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-cf-r271-catalog-sync/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-cf-r271-catalog-sync
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check immutable request and secret-free delta
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-cf-r271-catalog-sync/dexa-cf-r271-catalog-sync-20261101-v2.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          grep -Fxq 'request_id=dexa-cf-r271-catalog-sync-20261101-v2' "$req"
          grep -Fxq 'expected_cf=193' "$req"
          grep -Fxq 'expected_catalog=297' "$req"
          [[ "$(wc -l < "$req")" -eq 5 ]]
          grep -Fxq "catalog_blob_sha=5be062e7b07a775e69f5ec9119119b58ce548090" "$req"
          grep -Fxq "script_blob_sha=c0a7b2af291a42123814bedee6c065049f41a6e3" "$req"
          [[ "$(git hash-object qualification/dexa-cf-r271-catalog-sync-20261101/catalog-delta.json)" == "5be062e7b07a775e69f5ec9119119b58ce548090" ]]
          [[ "$(git hash-object qualification/dexa-cf-r271-catalog-sync-20261101/deploy-v2.sh)" == "c0a7b2af291a42123814bedee6c065049f41a6e3" ]]
          sh -n qualification/dexa-cf-r271-catalog-sync-20261101/deploy-v2.sh
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('qualification/dexa-cf-r271-catalog-sync-20261101/catalog-delta.json').read_text())
          assert d['schema']=='dexa.cf-catalog-r271-delta.v1'
          assert len(d['new_tools'])==6
          assert len({x['name'] for x in d['new_tools']})==6
          assert all(x['card']['fa_description'].strip() and x['card']['en_description'].strip() for x in d['new_tools'])
          print('DEXA_CF_R271_DELTA_VERIFIED')
          PY
      - name: Pin and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Apply exact catalog delta with backup, guarded restarts and readback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          scp "${opts[@]}" -P "$SSH_PORT" qualification/dexa-cf-r271-catalog-sync-20261101/catalog-delta.json "$VPS_SSH_USER@$VPS_HOST:/tmp/dexa-cf-r271-catalog-delta-20261101.json"
          scp "${opts[@]}" -P "$SSH_PORT" qualification/dexa-cf-r271-catalog-sync-20261101/deploy-v2.sh "$VPS_SSH_USER@$VPS_HOST:/tmp/dexa-cf-r271-catalog-deploy-20261101-v2.sh"
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'sh /tmp/dexa-cf-r271-catalog-deploy-20261101-v2.sh' </dev/null
