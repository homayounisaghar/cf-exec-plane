name: Dexa Contextual Kata Followup V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-contextual-kata-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-contextual-kata-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and secret-free snapshot
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-contextual-kata-v1-20261101
          req=server-bootstrap/control/dexa-contextual-kata-v1/dexa-contextual-kata-v1-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 4 ]]
          grep -Fxq 'request_id=dexa-contextual-kata-v1-20261101-v1' "$req"
          grep -Fxq 'source_commit=fb6940e1301ee32041d695ebe755829c9c49b43e' "$req"
          manifest_sha="$(git hash-object "$dir/manifest.json")"
          deploy_sha="$(git hash-object "$dir/deploy.sh")"
          grep -Fxq "manifest_sha=$manifest_sha" "$req"
          grep -Fxq "deploy_sha=$deploy_sha" "$req"
          [[ "$(git hash-object "$dir/dexa/kata_rank.py")" == "fc0337a3bf72bea4fe8f5f3b35d10bcaf1091663" ]]
          [[ "$(git hash-object "$dir/dexa/test_dexa_unified_provider_scope_v1.py")" == "2c368e65e6f2dd647db37aa0c60c8b6d6a48921a" ]]
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('qualification/dexa-contextual-kata-v1-20261101')
          m=json.loads((p/'manifest.json').read_text())
          assert m['schema']=='dexa.contextual-kata.v1'
          assert m['source_commit']=='fb6940e1301ee32041d695ebe755829c9c49b43e'
          assert len(m['files'])==2 and m['no_catalog_change'] and m['no_cf_change'] and m['no_service_restart']
          for f,item in m['files'].items():
           assert hashlib.sha256((p/f).read_bytes()).hexdigest()==item['candidate'],f
          print('CONTEXTUAL_KATA_SNAPSHOT_VERIFIED')
          PY
          bash -n "$dir/deploy.sh"
      - name: Prepare pinned SSH target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Install narrowed Kata scope without restarting services
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          dir=qualification/dexa-contextual-kata-v1-20261101
          remote=/tmp/dexa-contextual-kata-v1-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 755 $remote/dexa"
          for file in manifest.json deploy.sh dexa/kata_rank.py dexa/test_dexa_unified_provider_scope_v1.py;do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "bash $remote/deploy.sh" </dev/null
          echo DEXA_CONTEXTUAL_KATA_REQUEST_SENT_VERIFY_LIVE_SERVICE
