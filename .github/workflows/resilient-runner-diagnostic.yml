name: Resilient Runner Diagnostic
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/resilient-runner-diagnostic/*.request']
permissions: {contents: read}
jobs:
  diagnose:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/resilient-runner-diagnostic/*.request ]]
          expected="$(awk -F= '$1=="expected_script_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/312-resilient-runner-diagnostic.sh")" == "$expected" ]]
          bash -n server-bootstrap/312-resilient-runner-diagnostic.sh
      - shell: bash
        run: |
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/312-resilient-runner-diagnostic.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_RESILIENT_DIAG=pass' <<<"$out"
