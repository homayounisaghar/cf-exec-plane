name: Onshape R6 Epoch17 Authority Sync
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-r6-epoch17-authority/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-r6-authority-rebind
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/190-onshape-r6-epoch17-authority.sh
