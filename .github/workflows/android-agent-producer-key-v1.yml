name: Personal Android Agent Producer Key v1

on:
  push:
    branches: [main]
    paths:
      - 'android-agent/control/producer-key/*.request'

permissions:
  contents: read

concurrency:
  group: personal-android-agent-producer-key
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ensure:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable request
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$path" == android-agent/control/producer-key/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$path" .request)" ]] || exit 13
          [[ "$action" == "ensure-producer-key-v1" ]] || exit 14

      - name: Mask VPS endpoint
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)

      - name: Ensure durable producer key and emit public identity
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/180-android-agent-producer-key.sh
