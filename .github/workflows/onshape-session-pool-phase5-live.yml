name: Onshape Session Pool Phase 5 Live Multi-Mutator
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-session-pool-phase5-live/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-production-maintenance
  cancel-in-progress: false
jobs:
  qualify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request and harness
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-session-pool-phase5-live/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-session-pool-phase5-live-v1 ]]
          [[ "$(awk -F= '$1=="candidate_commit"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == 9e7ec9948551c662e8bf7554f87552f32d035b3f ]]
          expected_script_blob="$(awk -F= '$1=="expected_script_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          expected_client_blob="$(awk -F= '$1=="expected_client_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/300-onshape-session-pool-phase5-live.sh")" == "$expected_script_blob" ]]
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/helpers/300-onshape-session-pool-phase5-live-client.mjs")" == "$expected_client_blob" ]]
          bash -n server-bootstrap/300-onshape-session-pool-phase5-live.sh
          node --check server-bootstrap/helpers/300-onshape-session-pool-phase5-live-client.mjs
      - name: Run isolated live multi-mutator qualification
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/300-onshape-session-pool-phase5-live.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_PHASE5_LIVE_TEST=pass' <<<"$out"
          grep -Fxq 'CF_PHASE5_LIVE_RESTORE=production-green' <<<"$out"
