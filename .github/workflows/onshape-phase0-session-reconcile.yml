name: Onshape Phase 0 Session Pre-effect Reconcile
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-phase0-session-reconcile/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-phase0-research-activate
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-phase0-session-reconcile/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == phase0-session-reconcile-v1 ]]
          [[ "$(awk -F= '$1=="attempt_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == attempt:465388f7-f1c7-4e99-b7a2-c8efa4d09d21 ]]
          bash -n server-bootstrap/235-onshape-phase0-session-reconcile.sh
      - name: Mask endpoint
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Reconcile exact pre-effect Attempt
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/235-onshape-phase0-session-reconcile.sh
