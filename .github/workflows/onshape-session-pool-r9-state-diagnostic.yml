name: Onshape Session Pool R9 State Diagnostic
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-session-pool-r9-state-diagnostic/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-production-maintenance
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-session-pool-r9-state-diagnostic/*.request ]]
          bash -n server-bootstrap/290-onshape-session-pool-r9-state-diagnostic.sh
      - name: Inspect state
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/290-onshape-session-pool-r9-state-diagnostic.sh
