name: Onshape R8 Current Cohort Recovery
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-r8-current-reauth/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-e9-mate
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${changes[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-r8-current-reauth/*.request ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p" | tail -n1 | tr -d '[:space:]')" == "recover-r8-cohort" ]]
          bash -n server-bootstrap/215-onshape-r8-current-reauth.sh
      - name: Recover cohort
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/215-onshape-r8-current-reauth.sh
