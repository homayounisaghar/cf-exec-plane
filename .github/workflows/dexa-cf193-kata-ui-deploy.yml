name: Dexa CF193 Kata and Mobile Catalog Live Repair
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-cf193-kata-ui/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-cf193-kata-ui
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: \${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: \${{ secrets.VPS_HOST }}
      VPS_PORT: \${{ secrets.VPS_PORT }}
      VPS_SSH_USER: \${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: \${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact immutable and pinned source
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-cf193-kata-ui/dexa-cf193-kata-ui-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          grep -Fxq 'request_id=dexa-cf193-kata-ui-20261101-v1' "$req"
          grep -Fxq 'expected_catalog=297' "$req"
          grep -Fxq 'expected_cf=193' "$req"
          grep -Fxq 'script_blob_sha=239e5fff7a90b4c21553a45b400eaec75c0550f7' "$req"
          [[ "$(wc -l < "$req")" -eq 4 ]]
          [[ "$(git hash-object qualification/dexa-cf193-kata-ui-20261101-v1/deploy.sh)" == '239e5fff7a90b4c21553a45b400eaec75c0550f7' ]]
          sh -n qualification/dexa-cf193-kata-ui-20261101-v1/deploy.sh
          echo DEXA_CF193_KATA_UI_SOURCE_VERIFIED
      - name: Pin owner VPS transport
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == root || "$VPS_SSH_USER" == cfserver ]]
          port="\${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 0600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Deliver and execute guarded service-owner catalog-consumer fix
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          scp "\${opts[@]}" -P "$SSH_PORT" qualification/dexa-cf193-kata-ui-20261101-v1/deploy.sh "$VPS_SSH_USER@$VPS_HOST:/tmp/dexa-cf193-kata-ui-20261101-v1.sh"
          ssh "\${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'sh /tmp/dexa-cf193-kata-ui-20261101-v1.sh' </dev/null
