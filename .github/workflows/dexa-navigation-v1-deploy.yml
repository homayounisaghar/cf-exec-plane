name: Dexa WeChat Native Navigation Identity V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-navigation-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-navigation-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and signed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-navigation-v1-20261101
          req=server-bootstrap/control/dexa-navigation-v1/dexa-navigation-v1-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 4 ]]
          grep -Fxq 'request_id=dexa-navigation-v1-20261101-v1' "$req"
          grep -Fxq 'source_commit=dbea0cbe478f8ba730d87914ac96d20aed146242' "$req"
          grep -Fxq "manifest_sha=$(git hash-object "$dir/manifest.json")" "$req"
          grep -Fxq "deploy_sha=$(git hash-object "$dir/deploy.sh")" "$req"
          [[ "$(git hash-object "$dir/dexa/dexa_catalog_output_shapes_v1.json")" == "10e5971b8162fdab364657b9d9184df2967efc26" ]]
          [[ "$(git hash-object "$dir/dexa/test_dexa_wechat_navigation_identity_v1.mjs")" == "15cb3ce944505c673cb7d217b3f6ebef8fef479c" ]]
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('qualification/dexa-navigation-v1-20261101')
          m=json.loads((p/'manifest.json').read_text())
          assert m['schema']=='dexa.wechat-navigation-identity.v1'
          assert m['source_commit']=='dbea0cbe478f8ba730d87914ac96d20aed146242'
          assert hashlib.sha256((p/'dexa/dexa_catalog_output_shapes_v1.json').read_bytes()).hexdigest()==m['candidate_sha256']
          PY
          bash -n "$dir/deploy.sh"
      - name: Prepare pinned SSH target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Install scoped navigation contract
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          dir=qualification/dexa-navigation-v1-20261101
          remote=/tmp/dexa-navigation-v1-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 755 $remote/dexa"
          for file in manifest.json deploy.sh dexa/dexa_catalog_output_shapes_v1.json dexa/test_dexa_wechat_navigation_identity_v1.mjs;do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "bash $remote/deploy.sh" </dev/null
          echo DEXA_NAVIGATION_REQUEST_SENT_VERIFY_LIVE
