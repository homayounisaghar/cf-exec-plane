name: Onshape Authority Mirror Pull-Agent Refresh

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/onshape-authority-mirror-refresh/*.request

permissions:
  contents: read

concurrency:
  group: onshape-authority-mirror-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable refresh request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/onshape-authority-mirror-refresh/*.request ]] || { echo "unexpected request path" >&2; exit 12; }

          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_blob="$(awk -F= '$1=="expected_agent_blob"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"

          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ && "$file_request_id" == "$request_id" ]] || { echo "bad request id" >&2; exit 13; }
          [[ "$action" == "refresh-authority-mirror-agent" ]] || { echo "unsupported action" >&2; exit 14; }
          [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]] || { echo "bad expected agent blob" >&2; exit 15; }

          mapfile -t keys < <(awk -F= 'NF && $1 !~ /^#/ {print $1}' "$request_path" | sort)
          [[ "${#keys[@]}" -eq 3 ]] || { echo "unexpected request fields" >&2; exit 16; }
          [[ "${keys[0]}" == action && "${keys[1]}" == expected_agent_blob && "${keys[2]}" == request_id ]] || { echo "unexpected request schema" >&2; exit 16; }

          actual_blob="$(git rev-parse "$GITHUB_SHA:server-bootstrap/pull-agent/cf-pull-agent.sh")"
          [[ "$actual_blob" == "$expected_blob" ]] || { echo "agent blob does not match immutable request" >&2; exit 17; }

      - name: Mask endpoint and login
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" && -n "$VPS_SSH_USER" ]] || { echo "required SSH material missing" >&2; exit 20; }
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)

      - name: Refresh pull-agent and prove authority mirror without release activation
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/99-onshape-authority-mirror-refresh.sh
