name: Onshape Documents UI Inspect

on:
  push:
    branches:
      - main
    paths:
      - server-bootstrap/control/onshape-documents-ui-inspect/*.request

permissions:
  contents: read

concurrency:
  group: personal-server-onshape-documents-ui-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable inspect request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/onshape-documents-ui-inspect/*.request ]] || { echo "unexpected request path" >&2; exit 12; }
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ && "$file_request_id" == "$request_id" ]] || { echo "bad request id" >&2; exit 13; }
          document_id="$(awk -F= '$1=="document_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          workspace_id="$(awk -F= '$1=="workspace_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          element_id="$(awk -F= '$1=="element_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          browser_action="$(awk -F= '$1=="browser_action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          if [[ -n "$document_id$workspace_id$element_id" ]]; then
            [[ "$document_id" =~ ^[0-9a-fA-F]{24}$ && "$workspace_id" =~ ^[0-9a-fA-F]{24}$ && "$element_id" =~ ^[0-9a-fA-F]{24}$ ]] || { echo "bad browser-open target" >&2; exit 14; }
            [[ -z "$browser_action" || "$browser_action" == "open" || "$browser_action" == "top_view" || "$browser_action" == "mouse_probe" ]] || { echo "bad browser action" >&2; exit 15; }
            {
              echo "CF_ONSHAPE_BROWSER_OPEN_DOCUMENT_ID=$document_id"
              echo "CF_ONSHAPE_BROWSER_OPEN_WORKSPACE_ID=$workspace_id"
              echo "CF_ONSHAPE_BROWSER_OPEN_ELEMENT_ID=$element_id"
              [[ -n "$browser_action" ]] && echo "CF_ONSHAPE_BROWSER_ACTION=$browser_action"
            } >> "$GITHUB_ENV"
          fi
      - name: Mask host and login
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"; done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)
      - name: Inspect Documents UI through local MCP
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/84-onshape-documents-ui-inspect.sh
