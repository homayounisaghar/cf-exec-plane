name: Dexa Ignore WeChat Service Chat V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-ignore-service-chat-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-ignore-service-chat-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and secret-free source
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-ignore-service-chat-v1-20261102
          req=server-bootstrap/control/dexa-ignore-service-chat-v1/dexa-ignore-service-chat-v1-20261102-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == "A"$'\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 4 ]]
          grep -Fxq 'request_id=dexa-ignore-service-chat-v1-20261102-v1' "$req"
          grep -Fxq 'source_commit=438d5325a19d62847d7fc92806646c6bde32c388' "$req"
          grep -Fxq "manifest_sha=$(git hash-object "$dir/manifest.json")" "$req"
          grep -Fxq "deploy_sha=$(git hash-object "$dir/deploy.sh")" "$req"
          [[ "$(git hash-object "$dir/dexa/dexa_messaging_record_contract_v1.mjs")" == "b8e05c4964b46605c7f5d8c051642a10e72e74b8" ]]
          [[ "$(git hash-object "$dir/dexa/dexa_tool_plan_executor_v3.mjs")" == "c0651a0cef1359de1933455bd07227af5859b049" ]]
          [[ "$(git hash-object "$dir/dexa/test_dexa_wechat_ignored_chat_v1.mjs")" == "9920478501c03680141ff7c2cbeb170bd1f3b864" ]]
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('qualification/dexa-ignore-service-chat-v1-20261102')
          doc=json.loads((root/'manifest.json').read_text())
          assert doc['schema']=='dexa.ignore-wechat-service-chat.v1'
          assert doc['source_commit']=='438d5325a19d62847d7fc92806646c6bde32c388'
          assert doc['excluded_display_name']=='Service Notifications'
          assert len(doc['files'])==3
          for file,rec in doc['files'].items():
           assert hashlib.sha256((root/'dexa'/file).read_bytes()).hexdigest()==rec['after'],file
          PY
          bash -n "$dir/deploy.sh"
      - name: Establish pinned SSH target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Install Dexa-only policy and verify live rollback gate
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-ignore-service-chat-v1-20261102
          remote=/tmp/dexa-ignore-service-chat-v1-20261102
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 755 $remote/dexa"
          for file in manifest.json deploy.sh dexa/dexa_messaging_record_contract_v1.mjs dexa/dexa_tool_plan_executor_v3.mjs dexa/test_dexa_wechat_ignored_chat_v1.mjs;do
            scp -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -P "$SSH_PORT" "$dir/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "bash $remote/deploy.sh" </dev/null
          echo DEXA_IGNORE_CHAT_REQUEST_SENT_VERIFY_LIVE
