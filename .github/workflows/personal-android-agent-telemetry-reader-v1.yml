name: Personal Android Agent Telemetry Reader v1

on:
  push:
    branches: [main]
    paths:
      - 'android-agent/control/telemetry/*.request'

permissions:
  contents: read

jobs:
  telemetry:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: req
        name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == android-agent/control/telemetry/*.request ]] || exit 12
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          operation="$(awk -F= '$1=="operation"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          build_id="$(awk -F= '$1=="build_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$file_request_id" == "$request_id" ]] || exit 13
          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 14
          [[ "$operation" == "probe" || "$operation" == "read" ]] || exit 15
          [[ "$build_id" == "3" ]] || exit 16
          {
            echo "request_id=$request_id"
            echo "operation=$operation"
            echo "build_id=$build_id"
          } >> "$GITHUB_OUTPUT"

      - name: Load exact private build binding
        shell: bash
        run: |
          set -euo pipefail
          : "${CF_REPO_READ_TOKEN:?missing private repo read token}"
          api="https://api.github.com/repos/homayounisaghar/capability-fabric/contents/projects/personal-android-agent/private/remote-telemetry-alpha3.json?ref=project%2Fpersonal-android-agent"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp" /tmp/paa-binding.json' EXIT
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CF_REPO_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" > "$tmp"
          jq -r '.content' "$tmp" | tr -d '\n' | base64 -d > /tmp/paa-binding.json
          provider="$(jq -r '.provider' /tmp/paa-binding.json)"
          build="$(jq -r '.build_id' /tmp/paa-binding.json)"
          post_url="$(jq -r '.post_url' /tmp/paa-binding.json)"
          read_url="$(jq -r '.read_url' /tmp/paa-binding.json)"
          [[ "$provider" == "ntfy" && "$build" == "3" ]] || exit 20
          [[ "$post_url" =~ ^https://ntfy\.sh/paa-a3-[0-9a-f]{48}$ ]] || exit 21
          [[ "$read_url" == "$post_url/json?poll=1&since=all" ]] || exit 22
          {
            echo "POST_URL=$post_url"
            echo "READ_URL=$read_url"
          } >> "$GITHUB_ENV"

      - name: Probe or read telemetry
        shell: bash
        env:
          REQUEST_ID: ${{ steps.req.outputs.request_id }}
          OPERATION: ${{ steps.req.outputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "probe" ]]; then
            probe="$(jq -nc --arg rid "control-$REQUEST_ID" '{
              schema:"personal-android-agent.telemetry.v1",
              app_id:"personal-android-agent",
              version:"0.1.0-alpha3",
              build_id:"3",
              run_id:$rid,
              device_instance_id:"github-control-plane",
              seq:0,
              event_id:($rid+":0"),
              timestamp_ms:(now*1000|floor),
              category:"transport",
              phase:"CONTROL_PREFLIGHT",
              state:"terminal",
              action:"publish_poll",
              reason:"",
              status:"pass",
              metadata:{source:"github-actions"}
            }')"
            curl --fail --silent --show-error --max-time 20 \
              -H 'Content-Type: text/plain; charset=utf-8' \
              -H 'Firebase: no' \
              --data-binary "$probe" "$POST_URL" > /tmp/publish.json
            sleep 1
          fi

          curl --fail --silent --show-error --max-time 20 "$READ_URL" > /tmp/feed.jsonl
          echo "CF_PAA_TELEMETRY_READ_BEGIN"
          jq -Rrc 'fromjson? | select(.event=="message") | .message | fromjson? | select(.schema=="personal-android-agent.telemetry.v1")' /tmp/feed.jsonl \
            | sed 's/^/CF_PAA_TELEMETRY_EVENT=/'
          echo "CF_PAA_TELEMETRY_READ_END"

          count="$(jq -Rrc 'fromjson? | select(.event=="message") | .message | fromjson? | select(.schema=="personal-android-agent.telemetry.v1")' /tmp/feed.jsonl | wc -l | tr -d ' ')"
          echo "CF_PAA_TELEMETRY_FOUND=$count"

          if [[ "$OPERATION" == "probe" ]]; then
            jq -Rrc 'fromjson? | select(.event=="message") | .message | fromjson?' /tmp/feed.jsonl \
              | jq -e --arg rid "control-$REQUEST_ID" 'select(.run_id==$rid and .phase=="CONTROL_PREFLIGHT" and .status=="pass")' >/dev/null
            echo "CF_PAA_TELEMETRY_PROBE=PASS"
          fi
