name: Personal Android Agent Telemetry Reader v1

on:
  push:
    branches: [main]
    paths:
      - 'android-agent/control/telemetry/*.request'

permissions:
  contents: read

jobs:
  telemetry:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: req
        name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == android-agent/control/telemetry/*.request ]] || exit 12
          request_id="$(basename "$request_path" .request)"
          file_request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          operation="$(awk -F= '$1=="operation"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          build_id="$(awk -F= '$1=="build_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$file_request_id" == "$request_id" ]] || exit 13
          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 14
          [[ "$operation" == "probe" || "$operation" == "read" ]] || exit 15
          [[ "$build_id" == "3" || "$build_id" == "4" || "$build_id" == "5" || "$build_id" == "6" || "$build_id" == "7" || "$build_id" == "8" || "$build_id" == "9" || "$build_id" == "10" || "$build_id" == "11" || "$build_id" == "12" || "$build_id" == "13" || "$build_id" == "14" || "$build_id" == "15" || "$build_id" == "16" || "$build_id" == "17" || "$build_id" == "18" || "$build_id" == "19" ]] || exit 16
          {
            echo "request_id=$request_id"
            echo "operation=$operation"
            echo "build_id=$build_id"
          } >> "$GITHUB_OUTPUT"

      - name: Load exact private build binding
        shell: bash
        run: |
          set -euo pipefail
          : "${CF_REPO_READ_TOKEN:?missing private repo read token}"
          case "${{ steps.req.outputs.build_id }}" in
            3) binding_file="remote-telemetry-alpha3.json" ;;
            4) binding_file="remote-telemetry-alpha4.json" ;;
            5) binding_file="remote-telemetry-alpha5.json" ;;
            6) binding_file="remote-telemetry-alpha6.json" ;;
            7) binding_file="remote-telemetry-alpha7.json" ;;
            8) binding_file="remote-telemetry-alpha8.json" ;;
            9) binding_file="remote-telemetry-alpha9.json" ;;
            10) binding_file="remote-telemetry-alpha10.json" ;;
            11) binding_file="remote-telemetry-alpha11.json" ;;
            12) binding_file="remote-telemetry-alpha12.json" ;;
            13) binding_file="remote-telemetry-alpha13.json" ;;
            14) binding_file="remote-telemetry-alpha14.json" ;;
            15) binding_file="remote-telemetry-alpha15.json" ;;
            16) binding_file="remote-telemetry-alpha16.json" ;;
            17) binding_file="remote-telemetry-alpha17.json" ;;
            18) binding_file="remote-telemetry-alpha18.json" ;;
            19) binding_file="remote-telemetry-alpha19.json" ;;
            *) exit 19 ;;
          esac
          api="https://api.github.com/repos/homayounisaghar/capability-fabric/contents/projects/personal-android-agent/private/$binding_file?ref=project%2Fpersonal-android-agent"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp" /tmp/paa-binding.json' EXIT
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CF_REPO_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" > "$tmp"
          jq -r '.content' "$tmp" | tr -d '\n' | base64 -d > /tmp/paa-binding.json
          provider="$(jq -r '.provider' /tmp/paa-binding.json)"
          build="$(jq -r '.build_id' /tmp/paa-binding.json)"
          topic="$(jq -r '.topic' /tmp/paa-binding.json)"
          post_url="$(jq -r '.post_url' /tmp/paa-binding.json)"
          read_url="$(jq -r '.read_url' /tmp/paa-binding.json)"
          [[ "$provider" == "ntfy" && "$build" == "${{ steps.req.outputs.build_id }}" ]] || exit 20
          [[ "$topic" =~ ^paa-a3-[0-9a-f]{48}$ ]] || exit 21
          [[ "$post_url" == "https://ntfy.sh/$topic" ]] || exit 22
          [[ "$read_url" == "$post_url/json?poll=1&since=all" ]] || exit 23
          echo "::add-mask::$topic"
          echo "::add-mask::$post_url"
          echo "::add-mask::$read_url"
          {
            echo "POST_URL=$post_url"
            echo "READ_URL=$read_url"
          } >> "$GITHUB_ENV"

      - name: Probe or read telemetry
        shell: bash
        env:
          REQUEST_ID: ${{ steps.req.outputs.request_id }}
          OPERATION: ${{ steps.req.outputs.operation }}
          BUILD_ID: ${{ steps.req.outputs.build_id }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "probe" ]]; then
            probe="$(jq -nc --arg rid "control-$REQUEST_ID" '{
              schema:"personal-android-agent.telemetry.v1",
              app_id:"personal-android-agent",
              version:("0.1.0-alpha"+$ENV.BUILD_ID),
              build_id:$ENV.BUILD_ID,
              run_id:$rid,
              device_instance_id:"github-control-plane",
              seq:0,
              event_id:($rid+":0"),
              timestamp_ms:(now*1000|floor),
              category:"transport",
              phase:"CONTROL_PREFLIGHT",
              state:"terminal",
              action:"publish_poll",
              reason:"",
              status:"pass",
              metadata:{source:"github-actions"}
            }')"
            curl --fail --silent --show-error --max-time 20 \
              -H 'Content-Type: text/plain; charset=utf-8' \
              -H 'Firebase: no' \
              --data-binary "$probe" "$POST_URL" > /tmp/publish.json
            sleep 1
          fi

          if [[ "$OPERATION" == "probe" ]]; then
            pub_id="$(jq -r '.id // empty' /tmp/publish.json)"
            [[ "$pub_id" =~ ^[A-Za-z0-9_-]{6,32}$ ]] || { echo "publish response missing id" >&2; exit 30; }
            poll_url="$POST_URL/json?poll=1&since=10m"
            : > /tmp/paa-events.jsonl
            found=0
            for attempt in 1 2 3 4 5; do
              curl --fail --silent --show-error --max-time 20 "$poll_url" > /tmp/feed.jsonl
              jq -Rrc 'try (fromjson | select(.event=="message") | .message | fromjson | select(.schema=="personal-android-agent.telemetry.v1")) catch empty' /tmp/feed.jsonl > /tmp/paa-events.jsonl
              if jq -e --arg rid "control-$REQUEST_ID" 'select(.run_id==$rid and .phase=="CONTROL_PREFLIGHT" and .status=="pass")' /tmp/paa-events.jsonl >/dev/null; then
                found=1
                break
              fi
              sleep 2
            done
            [[ "$found" == 1 ]] || { echo "published probe not visible after bounded poll retries" >&2; exit 31; }
          else
            poll_url="$READ_URL"
            curl --fail --silent --show-error --max-time 20 "$poll_url" > /tmp/feed.jsonl
            jq -Rrc 'try (fromjson | select(.event=="message") | .message | fromjson | select(.schema=="personal-android-agent.telemetry.v1")) catch empty' /tmp/feed.jsonl > /tmp/paa-events.jsonl
          fi

          jq -Rrc 'try (fromjson | select(.event=="message") | .message | fromjson | select(.schema=="personal-android-agent.device-receipt.v1")) catch empty' /tmp/feed.jsonl > /tmp/paa-receipts.jsonl

          echo "CF_PAA_TELEMETRY_READ_BEGIN"
          sed 's/^/CF_PAA_TELEMETRY_EVENT=/' /tmp/paa-events.jsonl
          echo "CF_PAA_TELEMETRY_READ_END"

          count="$(wc -l < /tmp/paa-events.jsonl | tr -d ' ')"
          echo "CF_PAA_TELEMETRY_FOUND=$count"

          echo "CF_PAA_RECEIPT_READ_BEGIN"
          sed 's/^/CF_PAA_RECEIPT_EVENT=/' /tmp/paa-receipts.jsonl
          echo "CF_PAA_RECEIPT_READ_END"
          receipt_count="$(wc -l < /tmp/paa-receipts.jsonl | tr -d ' ')"
          echo "CF_PAA_RECEIPT_FOUND=$receipt_count"

          if [[ "$OPERATION" == "probe" ]]; then
            echo "CF_PAA_TELEMETRY_PROBE=PASS"
          fi
