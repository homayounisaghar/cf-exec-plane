name: PCG Telegram Fast Audio Acquisition r138
on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-fast-audio/*.request
permissions:
  contents: read
concurrency:
  group: pcg-fast-audio-r138
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      SNAP: qualification/pcg-fast-audio/73bbc1bec8ef3495359e6c359d5d59ed6cf023d6
      BASE: qualification/pcg-web/4d12bcea796fe5c0a7c4e1b64d1e8f2e74d6b571
      PREVIOUS: qualification/pcg-telegram-bridge/629875b4b6f1a5f7bdc17011d02834d13dfb8d51
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Admit one immutable owner deployment request
        shell: bash
        run: |
          set -euo pipefail
          change="$(git diff --name-status HEAD^ HEAD)"
          [[ "$change" == $'A\tserver-bootstrap/control/pcg-fast-audio/pcg-fast-audio-r138-20261026.request' ]] || exit 10
          file=server-bootstrap/control/pcg-fast-audio/pcg-fast-audio-r138-20261026.request
          grep -Fxq 'request_id=pcg-fast-audio-r138-20261026' "$file"
          grep -Fxq 'candidate_commit=73bbc1bec8ef3495359e6c359d5d59ed6cf023d6' "$file"
          grep -Fxq 'expected_pcg_sequence=138' "$file"
          grep -Fxq 'expected_cf_release=onshape-vps-fast-r100-direct-orbit1-paa-storage-r263-single-asr-tool' "$file"
          [[ "$(wc -l < "$file")" == 4 ]] || exit 11
      - name: Reconstruct source and validate unchanged Soniox engine
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 427b16010399546df3fa7cf8b927412dd325cd1eb9b0a69417fcd30ec735bfd2 "$PREVIOUS/pcg-r137.patch" | sha256sum -c -
          printf '%s  %s\n' fc2e8b0a488f04103ef492557bb8a5a46376f8b5096ad4edc2fed8722c320086 "$SNAP/pcg-r138-fastdownload.patch" | sha256sum -c -
          printf '%s  %s\n' bc316213a1765d53ddd680446b2568ebb1cb0360d1386642bd6b2ed24abff4b8 "$SNAP/pcg_r138_fast_audio.test.mjs" | sha256sum -c -
          printf '%s  %s\n' 259448038b16a1863b6560982c34798bfd594b8d2d50c3ae635a258a9265d576 "$SNAP/activate-r138-web-only.sh" | sha256sum -c -
          cp -a "$BASE" "$RUNNER_TEMP/r138"
          patch --batch --fuzz=0 -p1 -d "$RUNNER_TEMP/r138" < "$PREVIOUS/pcg-r137.patch"
          patch --batch --fuzz=0 -p1 -d "$RUNNER_TEMP/r138" < "$SNAP/pcg-r138-fastdownload.patch"
          cp "$SNAP/pcg_r138_fast_audio.test.mjs" "$RUNNER_TEMP/r138/"
          cp "$SNAP/activate-r138-web-only.sh" "$RUNNER_TEMP/r138/"
          python3 - <<'PY'
          import os,pathlib,json,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"r138"
          m=json.loads((p/"manifest.json").read_text())
          assert m["sequence"]==136
          assert hashlib.sha256((p/"pcg_web_semantic_ops.mjs").read_bytes()).hexdigest()=="d7839e74c13cfc9ddf3de7e9e952c186237c1340b57c419e471cb9cb8d97e532"
          assert hashlib.sha256((p/"pcg_soniox_fixed_overlap.mjs").read_bytes()).hexdigest()=="760741b91c1d156ae43857dc329ca805e81d3bdb703dd62488fe9cdc5ba76642"
          m["sequence"]=138
          m["release_id"]="pcg-web-stage6-soniox-multifile20-telegram-fastdownload-r138"
          for f in ("pcg_web_semantic_ops.mjs","activate-r138-web-only.sh","pcg_r138_fast_audio.test.mjs"):
            m["files"][f]=hashlib.sha256((p/f).read_bytes()).hexdigest()
          (p/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          for f,h in m["files"].items():
            assert hashlib.sha256((p/f).read_bytes()).hexdigest()==h,f
          print("PCG_R138_SCOPED_MANIFEST_OK",len(m["files"]))
          PY
          node --check "$RUNNER_TEMP/r138/pcg_web_semantic_ops.mjs"
          node --test "$RUNNER_TEMP/r138/pcg_r138_fast_audio.test.mjs"
          node --test "$RUNNER_TEMP/r138/pcg_soniox_7sec.test.mjs"
          bash -n "$SNAP/activate-r138-web-only.sh"
          tar -czf "$RUNNER_TEMP/pcg-r138-release.tgz" -C "$RUNNER_TEMP/r138" .
      - name: Owner-pinned SSH and PCG web-only deploy with rollback
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="$VPS_PORT";test -n "$port" || port=22
          case "$port" in *[!0-9]*) exit 21 ;; esac
          dir="$RUNNER_TEMP/ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"
          chmod 0600 "$dir/key"
          read -r key_type key_data extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          scp "${transport[@]}" -P "$port" "$RUNNER_TEMP/pcg-r138-release.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/pcg-r138-release.tgz"
          scp "${transport[@]}" -P "$port" "$SNAP/activate-r138-web-only.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/pcg-r138-activate.sh"
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" 'set -e; test "$(id -u)" = 0; bash /tmp/pcg-r138-activate.sh' </dev/null
          echo PCG_R138_SCOPED_DEPLOY_VERIFIED
