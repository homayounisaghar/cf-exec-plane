name: PCG Provisioning SSH Boundary

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/pcg-provision-ssh-requests/*.request'

permissions:
  contents: read

concurrency:
  group: personal-server-pcg-provision-ssh
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  install:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable provisioning-SSH request
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/pcg-provision-ssh-requests/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          phase="$(awk -F= '$1=="phase"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$phase" == pcg-provision-ssh-install ]] || exit 14

      - name: Mask endpoint and login
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
          while IFS= read -r addr; do
            [[ -n "$addr" ]] && printf '::add-mask::%s\n' "$addr"
          done < <(getent ahosts "$VPS_HOST" 2>/dev/null | awk '{print $1}' | sort -u)

      - name: Install restricted PCG forwarding principal with no key
        env:
          CF_PCG_PROVISION_SSH_MODE: install
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/43-pcg-provisioning-ssh.sh

      - name: Verify effective SSH restrictions
        env:
          CF_PCG_PROVISION_SSH_MODE: verify
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/43-pcg-provisioning-ssh.sh
