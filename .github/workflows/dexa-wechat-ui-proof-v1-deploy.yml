name: Dexa Native WeChat UI Witness V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-wechat-ui-proof-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-wechat-ui-proof-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one immutable SHA-pinned native/Dexa UI witness request
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-wechat-ui-proof-v1-20261101
          req=server-bootstrap/control/dexa-wechat-ui-proof-v1/dexa-wechat-ui-proof-v1-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 5 ]]
          grep -Fxq 'request_id=dexa-wechat-ui-proof-v1-20261101-v1' "$req"
          grep -Fxq 'expected_cf=193' "$req"
          grep -Fxq 'expected_catalog=297' "$req"
          grep -Fxq 'source_commit=11e63c9eb20ae2ac6173bfc1917947d0bedcdd7d' "$req"
          grep -Fxq 'manifest_blob_sha=ca832b89eb8bb04a3682b4628a9228bfdeff47b8' "$req"
          [[ "$(git hash-object "$dir/manifest.json")" == "ca832b89eb8bb04a3682b4628a9228bfdeff47b8" ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == "76cf79b4f6b9fd4e1cf1b93bd5e4ad0969ca938d" ]]
          sh -n "$dir/deploy.sh"
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('qualification/dexa-wechat-ui-proof-v1-20261101')
          m=json.loads((root/'manifest.json').read_text())
          assert m['schema']=='dexa.wechat-native-ui-witness.release.v1'
          assert m['release_id']=='dexa-wechat-ui-proof-v1-20261101'
          assert m['canonicalSource']['commit']=='11e63c9eb20ae2ac6173bfc1917947d0bedcdd7d'
          assert (m['expected']['catalog'],m['expected']['nativeCF'])==(297,193)
          assert (m['expected']['jsTests'],m['expected']['nativeTests'])==(104,5)
          assert m['noProviderSendDuringQualification'] is True
          assert m['wechatGuiRestart'] is False and m['cfServerContainerRestart'] is False
          assert m['cfServerToolsChanged'] is False
          assert set(m['patchSha256'])=={'native-helper.patch','dexa-ui-reconcile.patch'}
          assert len(m['candidateSha256'])==7 and len(m['liveBaselineSha256'])==3
          for n in ['native-helper.patch','dexa-ui-reconcile.patch',
                    'wechat_native_ui_receipt_v1.py','test_wechat_native_ui_receipt_v1.py',
                    'dexa_native_ui_observation_v1.mjs','test_dexa_native_ui_observation_v1.mjs']:
           assert (root/n).is_file()
          print('UI_WITNESS_IMMUTABLE_SOURCE_ADMITTED')
          PY
      - name: Pin and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Guarded native helper + Dexa install, preserved WeChat GUI and checked receipt, exact hash and health readback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          remote=/tmp/dexa-wechat-ui-proof-v1-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'mkdir -p -m 755 /tmp/dexa-wechat-ui-proof-v1-20261101'
          for file in manifest.json native-helper.patch dexa-ui-reconcile.patch wechat_native_ui_receipt_v1.py test_wechat_native_ui_receipt_v1.py dexa_native_ui_observation_v1.mjs test_dexa_native_ui_observation_v1.mjs deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "qualification/dexa-wechat-ui-proof-v1-20261101/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'sh /tmp/dexa-wechat-ui-proof-v1-20261101/deploy.sh' </dev/null
