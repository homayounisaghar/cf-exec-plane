name: Onshape V15 Architecture Selftest Diagnostic

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-fresh-holdout-v12/diagnostic-control/*.request

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run selftest diagnostic
        continue-on-error: true
        run: |
          mkdir -p artifacts/onshape-v15-arch-selftest
          cd qualification/onshape-fast-router-fresh-holdout-v12
          python evidence_architecture_selftest.py > "${{ github.workspace }}/artifacts/onshape-v15-arch-selftest/stdout.log" 2> "${{ github.workspace }}/artifacts/onshape-v15-arch-selftest/stderr.log" || true
      - name: Publish
        if: always()
        run: |
          src="artifacts/onshape-v15-arch-selftest"
          dst="reports/onshape-v15-arch-selftest"
          mkdir -p "$dst"
          for f in stdout.log stderr.log; do
            test -f "$src/$f" && cp "$src/$f" "$dst/$f" || true
          done
          printf '{"run_id":"%s","head_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: V15 architecture selftest diagnostic" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
