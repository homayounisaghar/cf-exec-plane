name: PCG Telegram Batch Bridge
on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-telegram-bridge/*.request
permissions:
  contents: read
concurrency:
  group: pcg-telegram-bridge
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      SNAP: qualification/pcg-telegram-bridge/629875b4b6f1a5f7bdc17011d02834d13dfb8d51
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          change="$(git diff --name-status HEAD^ HEAD)"
          [[ "$change" == $'A\tserver-bootstrap/control/pcg-telegram-bridge/telegram-audio-r137-r262-20261026.request' ]] || exit 10
          file=server-bootstrap/control/pcg-telegram-bridge/telegram-audio-r137-r262-20261026.request
          grep -Fxq "request_id=telegram-audio-r137-r262-20261026" "$file"
          grep -Fxq "candidate_commit=629875b4b6f1a5f7bdc17011d02834d13dfb8d51" "$file"
          grep -Fxq "expected_pcg_sequence=137" "$file"
          grep -Fxq "expected_cf_sequence=262" "$file"
          [[ "$(wc -l < "$file")" == 4 ]] || exit 11
      - name: Rebuild two scoped verified releases
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 427b16010399546df3fa7cf8b927412dd325cd1eb9b0a69417fcd30ec735bfd2 "$SNAP/pcg-r137.patch" | sha256sum -c -
          printf '%s  %s\n' 63512175947dfbcf51e7ecc00986d3dada797026f6749d751239e82c8a6c8c83 "$SNAP/cf-r262.patch" | sha256sum -c -
          printf '%s  %s\n' b67fb239bda2143aaac39e4e7eb95792eeef1ef52c5172a12afea2ab6057f7a4 "$SNAP/activate-r137-web-only.sh" | sha256sum -c -
          printf '%s  %s\n' 245b42d59931f8af2c6232bf74567029aee6ee1a4886a53bc6aec27a3b420889 "$SNAP/activate-cf-r262.sh" | sha256sum -c -
          cp -a qualification/pcg-web/4d12bcea796fe5c0a7c4e1b64d1e8f2e74d6b571 "$RUNNER_TEMP/r137"
          cp -a qualification/onshape-fast-r12/a9f36e69dfb380fbde796a8d9a2eab831152403e "$RUNNER_TEMP/r262"
          patch --batch --fuzz=0 -p1 -d "$RUNNER_TEMP/r137" < "$SNAP/pcg-r137.patch"
          patch --batch --fuzz=0 -p1 -d "$RUNNER_TEMP/r262" < "$SNAP/cf-r262.patch"
          cp "$SNAP/activate-r137-web-only.sh" "$RUNNER_TEMP/r137/activate-r137-web-only.sh"
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          t=pathlib.Path(os.environ["RUNNER_TEMP"])
          a=t/"r137";b=t/"r262"
          m=json.loads((a/"manifest.json").read_text());assert m["sequence"]==136
          m["sequence"]=137;m["release_id"]="pcg-web-stage6-soniox-multifile20-telegram-batch-r137"
          for f in ("pcg_web_semantic_ops.mjs","activate-r137-web-only.sh"):
              m["files"][f]=hashlib.sha256((a/f).read_bytes()).hexdigest()
          (a/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          m=json.loads((b/"manifest.json").read_text());assert m["sequence"]==261
          m["sequence"]=262;m["release_id"]="onshape-vps-fast-r100-direct-orbit1-paa-storage-r262-telegram-audio-batch"
          m["files"]["telegram-ingress.mjs"]=hashlib.sha256((b/"telegram-ingress.mjs").read_bytes()).hexdigest()
          c=json.loads((b/"release-closure.json").read_text());c["build_id"]=m["release_id"]
          (b/"release-closure.json").write_text(json.dumps(c,indent=2)+"\n")
          m["files"]["release-closure.json"]=hashlib.sha256((b/"release-closure.json").read_bytes()).hexdigest()
          (b/"manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          for root in (a,b):
              manifest=json.loads((root/"manifest.json").read_text())
              for f,h in manifest["files"].items():
                  assert hashlib.sha256((root/f).read_bytes()).hexdigest()==h,f
          print("SCOPED_SNAPSHOTS_VERIFIED")
          PY
          node --check "$RUNNER_TEMP/r137/pcg_web_semantic_ops.mjs"
          node --check "$RUNNER_TEMP/r262/telegram-ingress.mjs"
          node --test "$RUNNER_TEMP/r137/pcg_soniox_7sec.test.mjs"
          bash -n "$SNAP/activate-r137-web-only.sh" "$SNAP/activate-cf-r262.sh"
          tar -czf "$RUNNER_TEMP/r137.tgz" -C "$RUNNER_TEMP/r137" .
          tar -czf "$RUNNER_TEMP/r262.tgz" -C "$RUNNER_TEMP/r262" .
      - name: Authenticated scoped deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="$VPS_PORT";test -n "$port" || port=22
          case "$port" in *[!0-9]*) exit 21 ;; esac
          dir="$RUNNER_TEMP/ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"
          chmod 0600 "$dir/key"
          read -r key_type key_data extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          scp "${transport[@]}" -P "$port" "$RUNNER_TEMP/r137.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/pcg-r137-release.tgz"
          scp "${transport[@]}" -P "$port" "$RUNNER_TEMP/r262.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-r262-release.tgz"
          scp "${transport[@]}" -P "$port" "$SNAP/activate-r137-web-only.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/pcg-r137-activate.sh"
          scp "${transport[@]}" -P "$port" "$SNAP/activate-cf-r262.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-r262-activate.sh"
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" 'set -e; test "$(id -u)" = 0; bash /tmp/pcg-r137-activate.sh; bash /tmp/cf-r262-activate.sh' </dev/null
          echo "TELEGRAM_AUDIO_BATCH_BRIDGE_SCOPED_DEPLOY_COMPLETED"
