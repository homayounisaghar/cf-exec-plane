name: Remote Bundle Resilience Qualification
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/remote-bundle-resilient-selftest/*.request']
permissions: {contents: read}
jobs:
  qualify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      CF_REMOTE_BUNDLE_WAIT_SECONDS: 180
      CF_REMOTE_BUNDLE_RUNTIME_SECONDS: 240
      CF_REMOTE_BUNDLE_POLL_SECONDS: 2
      CF_REMOTE_BUNDLE_INJECT_POLL_FAILURES: 4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable self-test request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/remote-bundle-resilient-selftest/*.request ]]
          id="$(basename "$p" .request)"
          [[ "$(awk -F= '$1=="request_id"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == "$id" ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == remote-bundle-resilient-selftest-v1 ]]
          expected_runner="$(awk -F= '$1=="expected_runner_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          expected_script="$(awk -F= '$1=="expected_script_blob"{print $2}' "$p"|tail -1|tr -d '[:space:]')"
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/runner/remote-bundle-exec-resilient.sh")" == "$expected_runner" ]]
          [[ "$(git rev-parse "${GITHUB_SHA}:server-bootstrap/311-remote-bundle-resilient-selftest.sh")" == "$expected_script" ]]
          bash -n server-bootstrap/runner/remote-bundle-exec-resilient.sh
          bash -n server-bootstrap/311-remote-bundle-resilient-selftest.sh
      - name: Prove detached execution survives poll loss
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash server-bootstrap/runner/remote-bundle-exec-resilient.sh server-bootstrap/311-remote-bundle-resilient-selftest.sh)"
          printf '%s\n' "$out"
          grep -Fxq 'CF_REMOTE_BUNDLE_EXECUTION=detached-systemd' <<<"$out"
          grep -Fxq 'CF_REMOTE_RESILIENT_SELFTEST=pass' <<<"$out"
