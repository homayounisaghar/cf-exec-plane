name: PCG WeChat Exact Modal Cancel

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-wechat-modal-cancel/*.request

permissions:
  contents: read

concurrency:
  group: pcg-wechat-modal-cancel
  cancel-in-progress: false

jobs:
  cancel:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]]
          [[ "$request_path" == server-bootstrap/control/pcg-wechat-modal-cancel/*.request ]]
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]]

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          tmp="${RUNNER_TEMP}/ssh"
          install -d -m 0700 "$tmp"
          printf '%s\n' "$VPS_SSH_KEY" > "$tmp/key"
          chmod 0600 "$tmp/key"
          read -r hkt hkd extra <<< "${VPS_HOST_KEY//$'\r'/}"
          [[ "$hkt" == ssh-ed25519 && -n "$hkd" && -z "${extra:-}" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$hkt" "$hkd" > "$tmp/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$hkt" "$hkd" >> "$tmp/known_hosts"
          echo "SSH_DIR=$tmp" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Cancel exact WeChat logout confirmation
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" "${VPS_SSH_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -u)" -eq 0 ]]
          final=capability-fabric-pcg-wechat.service
          bridge=capability-fabric-pcg-login-bridge-wechat.service
          owner=cfop_e79aa1fde5
          state=/var/lib/capability-fabric/pcg/wechat
          systemctl is-active --quiet "$final"
          ! systemctl is-active --quiet "$bridge"
          snap=/tmp/pcg-wechat-exact-modal.json
          curl -fsS --max-time 3 http://127.0.0.1:9336/accessibility > "$snap"
          read -r cx cy count < <(python3 - "$snap" <<'PY'
          import json,sys
          prompt="You won't be notified of any new messages after logging out. Log out?"
          j=json.load(open(sys.argv[1]))
          def visible(n):
              st=set(n.get("states",[]))
              return "showing" in st and "visible" in st
          prompts=[n for n in j.get("nodes",[]) if n.get("role")=="label" and n.get("name")==prompt and visible(n)]
          cancels=[n for n in j.get("nodes",[]) if n.get("role")=="button" and n.get("name")=="Cancel" and visible(n)]
          if len(prompts)!=1 or len(cancels)!=1:
              print("0 0 0")
          else:
              b=cancels[0].get("bounds") or {}
              if int(b.get("width",0))<20 or int(b.get("height",0))<15:
                  print("0 0 0")
              else:
                  print(int(b["x"])+int(b["width"])//2,int(b["y"])+int(b["height"])//2,1)
          PY
          )
          [[ "$count" -eq 1 ]]
          runuser -u "$owner" -- env DISPLAY=:97 XAUTHORITY="$state/Xauthority" xdotool mousemove "$cx" "$cy" click 1
          sleep 0.8
          curl -fsS --max-time 3 http://127.0.0.1:9336/accessibility > "$snap"
          python3 - "$snap" <<'PY'
          import json,sys
          prompt="You won't be notified of any new messages after logging out. Log out?"
          j=json.load(open(sys.argv[1]))
          names=[n.get("name") for n in j.get("nodes",[]) if "showing" in set(n.get("states",[]))]
          assert prompt not in names
          assert not any(x in names for x in ("Log In","Confirm on Phone","Scan to log in"))
          assert any(n.get("role")=="list" and n.get("name")=="Chats" and "showing" in set(n.get("states",[])) for n in j.get("nodes",[]))
          PY
          echo PCG_WECHAT_EXACT_MODAL_CANCEL=success
          REMOTE
