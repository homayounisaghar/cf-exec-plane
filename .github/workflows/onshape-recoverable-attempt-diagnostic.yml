name: Onshape Recoverable Attempt Diagnostic
on:
  push:
    branches: [main]
    paths: ['server-bootstrap/control/onshape-recoverable-attempt-diagnostic/*.request']
permissions: {contents: read}
concurrency:
  group: onshape-recoverable-attempt-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t c < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#c[@]}" -eq 1 ]]
          IFS=$'\t' read -r s p <<<"${c[0]}"
          [[ "$s" == A && "$p" == server-bootstrap/control/onshape-recoverable-attempt-diagnostic/*.request ]]
          [[ "$(awk -F= '$1=="action"{print $2}' "$p"|tail -1|tr -d '[:space:]')" == onshape-recoverable-attempt-diagnostic-v1 ]]
          bash -n server-bootstrap/286-onshape-recoverable-attempt-diagnostic.sh
      - name: Inspect exact recoverable attempt
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/286-onshape-recoverable-attempt-diagnostic.sh
