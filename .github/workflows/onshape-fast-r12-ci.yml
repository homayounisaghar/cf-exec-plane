name: Onshape Fast R12 Public Qualification

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/onshape-fast-r12-ci/*.request

permissions:
  contents: read

jobs:
  qualify:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable public request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "request commit must add exactly one file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || { echo "request must be newly added" >&2; exit 11; }
          [[ "$request_path" == server-bootstrap/control/onshape-fast-r12-ci/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_sequence="$(awk -F= '$1=="expected_sequence"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          expected_release="$(awk -F= '$1=="expected_release"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" =~ ^[A-Za-z0-9_.-]{8,96}$ ]] || exit 13
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]] || exit 14
          [[ "$expected_sequence" =~ ^[0-9]+$ ]] || exit 15
          [[ "$expected_release" =~ ^[A-Za-z0-9_.-]{8,120}$ ]] || exit 16
          snapshot="qualification/onshape-fast-r12/$candidate_commit"
          [[ -d "$snapshot" ]] || { echo "public snapshot missing: $snapshot" >&2; exit 17; }
          {
            echo "SNAPSHOT=$snapshot"
            echo "CANDIDATE_COMMIT=$candidate_commit"
            echo "EXPECTED_SEQUENCE=$expected_sequence"
            echo "EXPECTED_RELEASE=$expected_release"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          for f in browser.js core.js server.js gateway.js onshape-agent.js telegram-ingress.mjs; do
            node --check "$SNAPSHOT/$f"
          done
          node --check "$SNAPSHOT/onshape-request.cjs"
          node --check "$SNAPSHOT/owner-auth.mjs"

      - name: Owner authorization security gate
        shell: bash
        run: |
          set -euo pipefail
          node security/cf-owner-auth/verify-owner-auth-snapshot.mjs "$SNAPSHOT"
          node --test "$SNAPSHOT/owner-auth.test.mjs"

      - name: Lean direct-agent unit gate
        shell: bash
        run: |
          set -euo pipefail
          node --test "$SNAPSHOT/onshape-agent.test.mjs"

      - name: Reject retired architecture
        shell: bash
        run: |
          set -euo pipefail
          runtime_files=(
            "$SNAPSHOT/onshape-agent.js"
            "$SNAPSHOT/server.js"
            "$SNAPSHOT/core.js"
            "$SNAPSHOT/browser.js"
            "$SNAPSHOT/compose.yaml"
            "$SNAPSHOT/release-closure.json"
          )
          if grep -Ein 'Session Bridge|productionGuard|mutationBudget|PolicyBoundKernel|fabricSidecar|onshape_vps_sidecar|onshape-session:production|Android rollback' "${runtime_files[@]}"; then
            echo "retired architecture reference found" >&2
            exit 20
          fi
          ! grep -q 'fabric_sidecar:' "$SNAPSHOT/compose.yaml"
          ! grep -q 'CF_FABRIC_REQUIRE_PRODUCTION_AUTHORITY' "$SNAPSHOT/compose.yaml"
          ! grep -q 'CF_ONSHAPE_RUNTIME_CONTROL_FILE' "$SNAPSHOT/compose.yaml"

      - name: Validate manifest and release closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ["SNAPSHOT"])
          manifest = json.loads((root / "manifest.json").read_text())
          closure = json.loads((root / "release-closure.json").read_text())

          assert manifest["sequence"] == int(os.environ["EXPECTED_SEQUENCE"])
          assert manifest["release_id"] == os.environ["EXPECTED_RELEASE"]
          assert closure["build_id"] == os.environ["EXPECTED_RELEASE"]

          cfg = closure["required_runtime_config"]
          assert cfg == {
              "browser_topology": "SINGLE_SESSION",
              "browser_contexts": 1,
              "api_maximum_concurrency": 1,
              "api_minimum_interval_ms": 1000,
              "documented_operation_path": "DIRECT_NODE_AGENT",
              "operation_registry": "STARTUP_PREINDEXED",
              "request_journal": "MUTATIONS_ONLY",
          }

          assert set(manifest["files"]) == set(closure["files"])
          assert manifest["images"] == closure["images"]

          for rel, expected in manifest["files"].items():
              p = root / rel
              assert p.is_file(), rel
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == expected, (rel, actual, expected)

          server = (root / "server.js").read_text()
          assert "agent.executeIntent(args)" in server
          assert 'execution_path: "mcp->semantic-contract->onshape-agent->browser-session->onshape"' in server
          assert 'server.registerTool("onshape_operation_execute"' in server
          assert 'server.registerTool("onshape_intent_execute"' not in server

          telegram = (root / "telegram-ingress.mjs").read_text()
          assert 'server.registerTool("audio_upload"' in telegram
          assert '"openai/fileParams": ["file"]' in telegram
          assert "CHAT_FILE_CLIENT_HANDOFF_UNAVAILABLE" in telegram
          assert 'server.registerTool("voice_convert"' in telegram
          assert 'CF_RVC_WORKER_URL' in telegram
          assert 'RVC_SOURCE_DIGEST_MISMATCH' in telegram
          compose = (root / "compose.yaml").read_text()
          assert 'CF_RVC_WORKER_URL: http://127.0.0.1:8794' in compose
          assert '/var/lib/capability-fabric/rvc:/rvc:ro' not in compose
          health = (root / "health.sh").read_text()
          assert 'RVC_OPTIONAL_LOOPBACK_GUARD=pass' in health
          server = (root / "server.js").read_text()
          assert 'voice_conversion: await voiceRuntimeStatus()' in server
          assert 'RVC_WORKER_STATUS_URL' in server

          agent = (root / "onshape-agent.js").read_text()
          assert "_buildOperationRegistry()" in agent
          assert "_buildSemanticRegistry()" in agent
          assert "executeIntent" in agent
          assert "executeDocumentedOperation" in agent
          assert "startup-precompiled-semantic" in agent
          assert "provider_acknowledged" in agent

          print("CF_ONSHAPE_FAST_R12_PUBLIC_QUALIFICATION=pass")
          PY
