name: Onshape Fast Router Groq V04 Hybrid Broad

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-groq-v04-hybrid/control/*.request

permissions:
  contents: read

concurrency:
  group: onshape-fast-router-groq-v04-hybrid
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-groq-v04-hybrid/benchmark.py
          python -m py_compile qualification/onshape-fast-router-groq-v04-hybrid/corpus_v02.py
          python -m py_compile qualification/onshape-fast-router-groq-v04-hybrid/hybrid_broad.py

      - name: Require Groq credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: test -n "$GROQ_API_KEY"

      - name: Run token-efficient hybrid broad benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: '12'
          MAX_BATCH_RETRIES: '12'
          OUT_DIR: artifacts/onshape-fast-router-groq-v04-hybrid
        run: python qualification/onshape-fast-router-groq-v04-hybrid/hybrid_broad.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onshape-fast-router-groq-v04-hybrid-${{ github.run_id }}
          path: artifacts/onshape-fast-router-groq-v04-hybrid/
          if-no-files-found: warn
          retention-days: 14
