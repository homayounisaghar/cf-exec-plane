name: Samsung Internet Green Clone Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'samsung-internet-clone/**'
      - '.github/workflows/samsung-internet-green-clone.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout execution snapshot
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "build-tools;35.0.0" "platform-tools"

      - name: Fetch verified official Samsung Internet source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fetched
          npm init -y >/dev/null
          npm install --no-audit --no-fund cheerio@1.0.0-rc.12

          node --input-type=module - <<'NODE'
          import * as cheerio from "cheerio";
          import {createWriteStream} from "node:fs";
          import {Readable} from "node:stream";
          import {finished} from "node:stream/promises";

          const base="https://www.apkmirror.com";
          const variant=base+"/apk/samsung-electronics-co-ltd/samsung-internet-for-android/samsung-browser-30-0-0-67-release/samsung-browser-30-0-0-67-3-android-apk-download/";
          const headers={
            "user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36",
            "accept-language":"en-US,en;q=0.9"
          };
          const abs=(u)=>u.startsWith("http")?u:(u.startsWith("/")?base+u:base+"/"+u);

          const r1=await fetch(variant,{headers,redirect:"follow"});
          console.log("variant_status",r1.status,r1.url);
          if(!r1.ok) throw new Error("variant page HTTP "+r1.status);
          const h1=await r1.text();
          const href1=cheerio.load(h1)("a.downloadButton").attr("href");
          if(!href1) throw new Error("downloadButton href missing");
          const gate=abs(href1);
          console.log("gate_url",gate);

          await new Promise(resolve=>setTimeout(resolve,16000));
          const r2=await fetch(gate,{headers:{...headers,referer:variant},redirect:"follow"});
          console.log("gate_status",r2.status,r2.url);
          if(!r2.ok) throw new Error("gate page HTTP "+r2.status);
          const h2=await r2.text();
          const $2=cheerio.load(h2);
          let href2=$2(".card-with-tabs a[href]").first().attr("href");
          if(!href2) href2=$2('a[href*="download"]').filter((i,e)=>$2(e).text().toLowerCase().includes("download")).first().attr("href");
          if(!href2) throw new Error("final download href missing");
          const finalUrl=abs(href2);
          console.log("final_url",finalUrl);

          const r3=await fetch(finalUrl,{headers:{...headers,referer:r2.url},redirect:"follow"});
          console.log("apk_status",r3.status,r3.url,r3.headers.get("content-length"),r3.headers.get("content-type"));
          if(!r3.ok||!r3.body) throw new Error("APK HTTP "+r3.status);
          await finished(Readable.fromWeb(r3.body).pipe(createWriteStream("fetched/source.apk")));
          NODE

          BT="$ANDROID_HOME/build-tools/35.0.0"
          SRC="fetched/source.apk"
          test -s "$SRC"
          sha256sum "$SRC" | tee source-downloaded-sha256.txt
          "$BT/aapt" dump badging "$SRC" | tee source-badging.txt
          grep -q "package: name='com.sec.android.app.sbrowser'" source-badging.txt
          grep -q "versionName='30.0.0.67'" source-badging.txt
          grep -q "versionCode='1300067502'" source-badging.txt

          "$BT/apksigner" verify --print-certs "$SRC" | tee source-cert.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 34df0e7a9f1cf1892e45c056b4973cd81ccf148a4050d11aea4ac5a65f900a42' source-cert.txt

          python3 - "$SRC" <<'PY'
          import sys, zipfile
          p=sys.argv[1]
          z=zipfile.ZipFile(p)
          dex=sorted(n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          libs=sorted(n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so'))
          print('dex_files',len(dex),dex)
          print('native_libs',len(libs))
          assert len(dex)==5, len(dex)
          assert len(libs)==13, len(libs)
          PY

          cp "$SRC" source.apk
          echo "verified_source_sha256=$(sha256sum source.apk | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Fetch pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
            -o apktool.jar
          java -jar apktool.jar --version

      - name: Decode without resource/source rewriting
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f -r -s source.apk -o work
          test -f work/AndroidManifest.xml
          test "$(find work -maxdepth 1 -name 'classes*.dex' | wc -l)" -eq 5

      - name: Apply precise clone/provider remap
        shell: bash
        run: |
          set -euo pipefail
          python3 samsung-internet-clone/build_clone.py work
          cat work/CLONE_PATCH_REPORT.txt
          grep -q '^provider_authorities_active_in_dex=19$' work/CLONE_PATCH_REPORT.txt
          grep -q 'com.sec.android.app.sbrowser.mostvisited -> com.sec.android.app.sbrowser.mostvisite3' work/CLONE_PATCH_REPORT.txt

      - name: Rebuild unsigned clone
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b work -o clone-unsigned-unaligned.apk

      - name: Verify native payloads preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          src=zipfile.ZipFile('source.apk')
          out=zipfile.ZipFile('clone-unsigned-unaligned.apk')
          libs=sorted(n for n in src.namelist() if n.startswith('lib/') and n.endswith('.so'))
          assert len(libs)==13, len(libs)
          for n in libs:
              a=hashlib.sha256(src.read(n)).hexdigest()
              b=hashlib.sha256(out.read(n)).hexdigest()
              assert a==b,(n,a,b)
          print('native_payloads_byte_exact=13')
          PY

      - name: Align and verify clone metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 clone-unsigned-unaligned.apk Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk
          "$BT/zipalign" -c 4 Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk
          "$BT/aapt" dump badging Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk | tee badging.txt
          grep -q "package: name='com.sec.android.app.sbrowse3'" badging.txt
          grep -q "versionCode='1300067502'" badging.txt
          grep -q "versionName='30.0.0.67'" badging.txt
          sha256sum Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk > SHA256SUMS.txt
          cp work/CLONE_PATCH_REPORT.txt .
          {
            echo 'source_repo=homayounisaghar/capability-fabric'
            echo 'source_project=projects/samsung-internet-green-clone'
            echo "official_source_sha256=$verified_source_sha256"
            echo 'package=com.sec.android.app.sbrowse3'
            echo 'versionCode=1300067502'
            echo 'versionName=30.0.0.67'
            echo 'signing=unsigned-stage-a'
            echo "exec_commit=$GITHUB_SHA"
          } > BUILD-METADATA.txt

      - name: Upload unsigned signing kit
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Internet-Green-Clone-Rebuild-signing-kit
          retention-days: 30
          if-no-files-found: error
          path: |
            Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk
            CLONE_PATCH_REPORT.txt
            BUILD-METADATA.txt
            SHA256SUMS.txt
            badging.txt
