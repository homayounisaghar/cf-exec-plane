name: Samsung Internet Green Clone Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'samsung-internet-clone/**'
      - '.github/workflows/samsung-internet-green-clone.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout execution snapshot
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "build-tools;35.0.0" "platform-tools"

      - name: Resolve AppLoko download endpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fetched
          mkdir -p fetched/chunks
          PAGE='https://apploko.com/en/product/samsung-browser'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
            "$PAGE" -o fetched/page.html

          python3 - <<'PY'
          from pathlib import Path
          import re,html,subprocess
          page=Path('fetched/page.html').read_text(errors='replace')
          srcs=[]
          for m in re.finditer(r'<script[^>]+src="([^"]+)"',page,re.I):
              u=html.unescape(m.group(1))
              if '/_next/static/chunks/' in u and u not in srcs:
                  srcs.append(u)
          print('chunk_count',len(srcs))
          Path('fetched/chunk-urls.txt').write_text('\n'.join(srcs)+'\n')
          PY

          i=0
          while IFS= read -r SRC; do
            i=$((i+1))
            URL="$SRC"
            case "$URL" in
              http*) ;;
              *) URL="https://apploko.com$URL" ;;
            esac
            curl -fL --retry 2 --retry-all-errors --connect-timeout 20 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
              -e "$PAGE" "$URL" -o "fetched/chunks/$i.js"
          done < fetched/chunk-urls.txt

          python3 - <<'PY'
          from pathlib import Path
          import re,json
          hits=[]
          pats=[
              r'''["']([^"']*(?:download|Download|DOWNLOAD)[^"']*)["']''',
              r'''["']([^"']*(?:/api/|api/)[^"']*)["']''',
              r'''["']([^"']*(?:file|File)[^"']*(?:url|Url|URL)[^"']*)["']''',
          ]
          for p in sorted(Path('fetched/chunks').glob('*.js')):
              s=p.read_text(errors='replace')
              for pat in pats:
                  for m in re.finditer(pat,s):
                      v=m.group(1)
                      if len(v) <= 500:
                          hits.append((p.name,v))
          seen=set()
          out=[]
          for item in hits:
              if item in seen: continue
              seen.add(item); out.append(item)
          for p,v in out[:400]:
              print(f'{p}: {v}')
          Path('fetched/chunk-hits.txt').write_text(
              '\n'.join(f'{p}: {v}' for p,v in out)+'\n'
          )
          PY
          exit 42

      - name: Upload AppLoko endpoint diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-apploko-endpoint-diagnostic
          retention-days: 3
          if-no-files-found: error
          path: |
            fetched/page.html
            fetched/chunk-urls.txt
            fetched/chunk-hits.txt
            fetched/chunks/

      - name: Verify AppLoko Samsung source structure
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SRC="fetched/source.apk"
          test -s "$SRC"
          echo '1d93a2f72dede907d0430090b0edad1ce7c91797bd31b42c64035d1d65a14c27  fetched/source.apk' | sha256sum -c -
          "$BT/aapt" dump badging "$SRC" | tee source-badging.txt
          grep -q "package: name='com.sec.android.app.sbrowser'" source-badging.txt
          grep -q "versionName='30.0.0.67'" source-badging.txt
          grep -q "versionCode='1300067502'" source-badging.txt
          "$BT/apksigner" verify --print-certs "$SRC" | tee source-cert.txt
          python3 - "$SRC" <<'PY'
          import sys,zipfile
          z=zipfile.ZipFile(sys.argv[1])
          dex=sorted(n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          libs=sorted(n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so'))
          print('dex_files',len(dex),dex)
          print('native_libs',len(libs))
          assert len(dex)==5, len(dex)
          assert len(libs)==13, len(libs)
          PY
          cp "$SRC" source.apk
          echo "verified_source_sha256=$(sha256sum source.apk | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "source_kind=apploko-repackaged-30.0.0.67" >> "$GITHUB_ENV"

      - name: Fetch pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' \
            -o apktool.jar
          java -jar apktool.jar --version

      - name: Decode without resource/source rewriting
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar d -f -r -s source.apk -o work
          test -f work/AndroidManifest.xml
          test "$(find work -maxdepth 1 -name 'classes*.dex' | wc -l)" -eq 5

      - name: Apply precise clone/provider remap
        shell: bash
        run: |
          set -euo pipefail
          python3 samsung-internet-clone/build_clone.py work
          cat work/CLONE_PATCH_REPORT.txt
          grep -q '^provider_authorities_active_in_dex=19$' work/CLONE_PATCH_REPORT.txt
          grep -q 'com.sec.android.app.sbrowser.mostvisited -> com.sec.android.app.sbrowser.mostvisite3' work/CLONE_PATCH_REPORT.txt

      - name: Rebuild unsigned clone
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b work -o clone-unsigned-unaligned.apk

      - name: Verify native payloads preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          src=zipfile.ZipFile('source.apk')
          out=zipfile.ZipFile('clone-unsigned-unaligned.apk')
          libs=sorted(n for n in src.namelist() if n.startswith('lib/') and n.endswith('.so'))
          assert len(libs)==13, len(libs)
          for n in libs:
              a=hashlib.sha256(src.read(n)).hexdigest()
              b=hashlib.sha256(out.read(n)).hexdigest()
              assert a==b,(n,a,b)
          print('native_payloads_byte_exact=13')
          PY

      - name: Align and verify clone metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 clone-unsigned-unaligned.apk Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk
          "$BT/zipalign" -c 4 Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk
          "$BT/aapt" dump badging Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk | tee badging.txt
          grep -q "package: name='com.sec.android.app.sbrowse3'" badging.txt
          grep -q "versionCode='1300067502'" badging.txt
          grep -q "versionName='30.0.0.67'" badging.txt
          sha256sum Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk > SHA256SUMS.txt
          cp work/CLONE_PATCH_REPORT.txt .
          {
            echo 'source_repo=homayounisaghar/capability-fabric'
            echo 'source_project=projects/samsung-internet-green-clone'
            echo "source_sha256=$verified_source_sha256"
            echo 'package=com.sec.android.app.sbrowse3'
            echo 'versionCode=1300067502'
            echo 'versionName=30.0.0.67'
            echo 'signing=unsigned-stage-a'
            echo "exec_commit=$GITHUB_SHA"
          } > BUILD-METADATA.txt

      - name: Upload unsigned signing kit
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Internet-Green-Clone-Rebuild-signing-kit
          retention-days: 30
          if-no-files-found: error
          path: |
            Samsung_Internet_Green_Clone_30.0.0.67_Rebuild_unsigned.apk
            CLONE_PATCH_REPORT.txt
            BUILD-METADATA.txt
            SHA256SUMS.txt
            badging.txt
