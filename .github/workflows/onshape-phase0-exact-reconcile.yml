name: Onshape Phase 0 Exact Attempt Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-phase0-exact-reconcile/*.request'

permissions:
  contents: read

concurrency:
  group: onshape-phase0-research-activate
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable reconcile request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "${GITHUB_SHA}")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-phase0-exact-reconcile/*.request ]] || exit 11
          request_id="$(basename "$request_path" .request)"
          file_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          action="$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          attempt="$(awk -F= '$1=="attempt_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$file_id" ]] || exit 12
          [[ "$action" == "phase0-exact-reconcile-v1" ]] || exit 13
          [[ "$attempt" == "attempt:1972dcac-fcfe-4772-a5ee-8296f1029e73" ]] || exit 14
          bash -n server-bootstrap/220-onshape-phase0-exact-reconcile.sh
      - name: Mask endpoint
        shell: bash
        run: |
          printf '::add-mask::%s\n' "$VPS_HOST"
          printf '::add-mask::%s\n' "$VPS_SSH_USER"
      - name: Reconcile same research Attempt without replay
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/220-onshape-phase0-exact-reconcile.sh
