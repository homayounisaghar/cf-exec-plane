name: Dexa Adaptive Observation V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-adaptive-observation-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-adaptive-observation-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and exact source
        shell: bash
        run: |
          set -euo pipefail
          req="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
          dir=qualification/dexa-adaptive-observation-v1-20261103
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == 
          [[ "$(git hash-object "$dir/change.patch")" == de069396dde8bedfce3372f3ab8600abb09c3c35 ]]
          [[ "$(git hash-object "$dir/test_dexa_adaptive_observation_workflow_v1.mjs")" == c2bd73bc92017f25ba1cd2514492a0d87eda4e8a ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == f1e6eac238ecc7aa7754f5a9f8dc97b5c3897010 ]]
          [[ "$(git hash-object "$dir/rollback.sh")" == 60a68f16930206365ea8ae1c00819ba37499c4ad ]]
          bash -n "$dir/deploy.sh"
          bash -n "$dir/rollback.sh"
      - name: Prepare pinned VPS access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mkdir -m 700 "$RUNNER_TEMP/dexa-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/dexa-ssh/key"
          chmod 600 "$RUNNER_TEMP/dexa-ssh/key"
          read -r alg key extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$alg" == ssh-ed25519 && -n "$key" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$key" > "$RUNNER_TEMP/dexa-ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$key" >> "$RUNNER_TEMP/dexa-ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Transfer and run guarded Dexa-only correction
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-adaptive-observation-v1-20261103
          remote=/tmp/dexa-adaptive-observation-v1-20261103
          opts=(-i "$RUNNER_TEMP/dexa-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dexa-ssh/known_hosts")
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 700 $remote"
          for f in change.patch test_dexa_adaptive_observation_workflow_v1.mjs deploy.sh rollback.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$f" "$VPS_SSH_USER@$VPS_HOST:$remote/$f"
          done
          script=deploy.sh
          if [[ "$DEXA_ACTION" == rollback ]]; then script=rollback.sh; fi
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "if [ \$(id -u) -eq 0 ]; then chown -R cfserver:cfserver $remote; runuser -u cfserver -- bash $remote/$script; else bash $remote/$script; fi" </dev/null
          echo CHECK_LIVE_SERVICE_NOT_WORKFLOW
A\t'"$req" ]]
          case "$req" in
            server-bootstrap/control/dexa-adaptive-observation-v1/dexa-adaptive-observation-v1-20261103-v1.request) action=deploy ;;
            server-bootstrap/control/dexa-adaptive-observation-v1/dexa-adaptive-observation-v1-rollback-20261103-v1.request) action=rollback ;;
            *) echo UNADMITTED_REQUEST; exit 2 ;;
          esac
          grep -Fxq "request_id=$(basename "$req" .request)" "$req"
          grep -Fxq "source_commit=07f5cfc58a3d9b0027e5c1bdb9bdb00b3fca5ce3" "$req"
          grep -Fxq "action=$action" "$req"
          [[ "$(wc -l < "$req")" -eq 3 ]]
          echo "DEXA_ACTION=$action" >> "$GITHUB_ENV"
          [[ "$(git hash-object "$dir/change.patch")" == de069396dde8bedfce3372f3ab8600abb09c3c35 ]]
          [[ "$(git hash-object "$dir/test_dexa_adaptive_observation_workflow_v1.mjs")" == c2bd73bc92017f25ba1cd2514492a0d87eda4e8a ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == f1e6eac238ecc7aa7754f5a9f8dc97b5c3897010 ]]
          bash -n "$dir/deploy.sh"
      - name: Prepare pinned VPS access
        shell: bash
