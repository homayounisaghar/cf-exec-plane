name: Android Build Tools Export v1

on:
  push:
    branches: [main]
    paths:
      - 'android-tools/control/export/*.request'

permissions:
  contents: read

jobs:
  export:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]]
          IFS=$'\t' read -r status path <<<"${changes[0]}"
          [[ "$status" == A ]]
          [[ "$path" == android-tools/control/export/*.request ]]
          grep -qx 'build_tools=35.0.0' "$path"

      - name: Resolve build-tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?missing Android SDK}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "build-tools;35.0.0"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner"
          test -f "$BT/lib/apksigner.jar"
          test -x "$BT/zipalign"
          test -x "$BT/aapt"
          mkdir -p "$RUNNER_TEMP/android-build-tools-35/lib"
          cp "$BT/apksigner" "$RUNNER_TEMP/android-build-tools-35/"
          cp "$BT/lib/apksigner.jar" "$RUNNER_TEMP/android-build-tools-35/lib/"
          cp "$BT/zipalign" "$RUNNER_TEMP/android-build-tools-35/"
          cp "$BT/aapt" "$RUNNER_TEMP/android-build-tools-35/"
          sha256sum "$RUNNER_TEMP/android-build-tools-35/apksigner" "$RUNNER_TEMP/android-build-tools-35/zipalign" "$RUNNER_TEMP/android-build-tools-35/aapt" "$RUNNER_TEMP/android-build-tools-35/lib/apksigner.jar" > "$RUNNER_TEMP/android-build-tools-35/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-minimal
          path: ${{ runner.temp }}/android-build-tools-35/
          retention-days: 7
          if-no-files-found: error
