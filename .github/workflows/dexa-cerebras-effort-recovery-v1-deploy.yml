name: Dexa Cerebras Effort Recovery V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-cerebras-effort-recovery-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-cerebras-effort-recovery-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable request and source hashes
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-cerebras-effort-recovery-v1-20261101
          req=server-bootstrap/control/dexa-cerebras-effort-recovery-v1/dexa-cerebras-effort-recovery-v1-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 4 ]]
          grep -Fxq 'request_id=dexa-cerebras-effort-recovery-v1-20261101-v1' "$req"
          grep -Fxq 'source_commit=d0cd4bf1f858536a5fb3220c9b54007dc19da2a0' "$req"
          grep -Fxq 'manifest_sha=69c43a758316161e049120c61a1b4ae07ec4ca17' "$req"
          grep -Fxq 'deploy_sha=2766dada304238d759339e785cbf3c596f81872f' "$req"
          [[ "$(git hash-object "$dir/manifest.json")" == "69c43a758316161e049120c61a1b4ae07ec4ca17" ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == "2766dada304238d759339e785cbf3c596f81872f" ]]
          [[ "$(git hash-object "$dir/dexa/cerebras_api_planner.mjs")" == "1d56fbde90a761c628a0d0f1c6b48538f2774b9b" ]]
          [[ "$(git hash-object "$dir/dexa/test_dexa_cerebras_api_planner_v1.mjs")" == "f94a351efcb6a74afa3ef9fc36c53c80c3ca7405" ]]
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          r=Path('qualification/dexa-cerebras-effort-recovery-v1-20261101')
          m=json.loads((r/'manifest.json').read_text())
          assert m['source_commit']=='d0cd4bf1f858536a5fb3220c9b54007dc19da2a0'
          assert m['schema']=='dexa.cerebras-effort-recovery.v1'
          assert len(m['files'])==2
          for name,item in m['files'].items():
           assert hashlib.sha256((r/name).read_bytes()).hexdigest()==item['candidate'],name
          print('DEXA_CEREBRAS_RECOVERY_SIGNED_SNAPSHOT_VERIFIED')
          PY
          bash -n "$dir/deploy.sh"
      - name: Pin SSH target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Install guarded Cerebras Qwen recovery to VPS
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          dir=qualification/dexa-cerebras-effort-recovery-v1-20261101
          remote=/tmp/dexa-cerebras-effort-recovery-v1-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 755 $remote/dexa"
          for file in manifest.json deploy.sh dexa/cerebras_api_planner.mjs dexa/test_dexa_cerebras_api_planner_v1.mjs; do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'set +e; bash /tmp/dexa-cerebras-effort-recovery-v1-20261101/deploy.sh > /tmp/dexa-cerebras-effort-recovery-v1-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/dexa-cerebras-effort-recovery-v1-diagnostic.log; chmod 0640 /tmp/dexa-cerebras-effort-recovery-v1-diagnostic.log; exit "$rc"' </dev/null
          echo DEXA_CEREBRAS_EFFORT_RECOVERY_REQUEST_EXECUTED_VERIFY_LIVE_SERVICE
