name: CF Telegram Link-Only r271 Guarded Release
on:
  push:
    branches: [main]
    paths: [server-bootstrap/control/cf-telegram-link-only-r271/*.request]
permissions: {contents: read}
concurrency: {group: cf-telegram-link-only-r271, cancel-in-progress: false}
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNAP: qualification/cf-telegram-link-only-r271/20261101
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Admit exact immutable request
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/cf-telegram-link-only-r271/cf-telegram-link-only-r271-20261101-v1.request
          [[ "$(git diff --name-status HEAD^ HEAD)" == "$(printf 'A\t%s' "$req")" ]] || exit 10
          [[ "$(wc -l < "$req")" == 4 ]] || exit 11
          grep -Fxq 'request_id=cf-telegram-link-only-r271-20261101-v1' "$req"
          grep -Fxq 'candidate_commit=c3b1f0efd45933e5015b040c6fee84a919090eae' "$req"
          grep -Fxq 'expected_sequence=271' "$req"
          grep -Fxq 'expected_release=onshape-vps-fast-r100-direct-orbit1-paa-storage-r271-telegram-link-only-20261101' "$req"
      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SNAP"
          printf '%s  %s\n' '29c1d40fd2c9c2beae48816b1ac54fa2e5c54a3b4beb1cc6e3ef7a1e4009abd8' activate-r271.sh | sha256sum -c -
          bash -n activate-r271.sh
      - name: Scoped authenticated release and rollback
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 21
          dir="$RUNNER_TEMP/r271-ssh"; install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"; chmod 0600 "$dir/key"
          read -r kt kd extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$kt" == ssh-ed25519 && -n "$kd" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$kt" "$kd" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$kt" "$kd" >> "$dir/known_hosts"
          chmod 0600 "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          scp "${transport[@]}" -P "$port" "$SNAP/activate-r271.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-telegram-r271-activate.sh"
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" 'set +e; bash /tmp/cf-telegram-r271-activate.sh > /tmp/cf-telegram-r271-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/cf-telegram-r271-diagnostic.log; chmod 0640 /tmp/cf-telegram-r271-diagnostic.log; exit "$rc"' </dev/null
          echo CF_TELEGRAM_R271_REQUEST_EXECUTED_VERIFY_LIVE_SERVER
