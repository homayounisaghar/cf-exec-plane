name: CF WeChat Cached Media r267 Scoped Deploy
on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/cf-wechat-cache-r267/*.request
permissions:
  contents: read
concurrency:
  group: cf-wechat-cache-r267
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNAP: qualification/cf-wechat-cache-r267/e23783f4ae8ff58cbf70cb09b5889c2cbe69f03b
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require one immutable, owner-authored request
        shell: bash
        run: |
          set -euo pipefail
          request=server-bootstrap/control/cf-wechat-cache-r267/cf-wechat-cache-r267-20261030-v1.request
          change="$(git diff --name-status HEAD^ HEAD)"
          expected="$(printf 'A\t%s' "$request")"
          [[ "$change" == "$expected" ]] || exit 10
          [[ "$(wc -l < "$request")" -eq 4 ]] || exit 11
          grep -Fxq 'request_id=cf-wechat-cache-r267-20261030-v1' "$request"
          grep -Fxq 'candidate_commit=e23783f4ae8ff58cbf70cb09b5889c2cbe69f03b' "$request"
          grep -Fxq 'expected_sequence=267' "$request"
          grep -Fxq 'expected_release=onshape-vps-fast-r100-direct-orbit1-paa-storage-r267-wa-caption-wechat-stable-ref-20261030' "$request"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify pinned minimal source and synthetic per-request cache test
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' d406cdbdbe101e3b05bee701e947c4ff390abe8dce607d9ccc8c636325cf7bc2 "$SNAP/wechat-media-tools.mjs" | sha256sum -c -
          printf '%s  %s\n' 281aa17eb6916e52276e4b92bb65bbc1e7858be2ca86c6133a491e035c4ac390 "$SNAP/wechat_media_cache_adapter_v1.mjs" | sha256sum -c -
          printf '%s  %s\n' 55994a63eee9e5b06f7e94437f04f4b758631022b20de91895b5cac47175a399 "$SNAP/manifest.json" | sha256sum -c -
          printf '%s  %s\n' 849dd469852bf5699e10e9e8d1468ee1f93a83b522bde066f423f1b27e3bfa33 "$SNAP/release-closure.json" | sha256sum -c -
          printf '%s  %s\n' 1d199ffe152dd3e070133a1d999e66db57119ed55603cd27dbbe3f3222a5b142 "$SNAP/activate-cf-r267-stable-ref-guarded.sh" | sha256sum -c -
          printf '%s  %s\n' 97347ee1af75cc895a4fabd2dbd921f075632727eff54bd27fc54c48743af18a "$SNAP/test_r267_stable_public.mjs" | sha256sum -c -
          bash -n "$SNAP/activate-cf-r267-stable-ref-guarded.sh"
          node --check "$SNAP/wechat-media-tools.mjs"
          node --check "$SNAP/wechat_media_cache_adapter_v1.mjs"
          node --test "$SNAP/test_r267_stable_public.mjs"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['SNAP'])
          m=json.loads((p/'manifest.json').read_text())
          c=json.loads((p/'release-closure.json').read_text())
          assert m['sequence']==267
          assert m['release_id']=='onshape-vps-fast-r100-direct-orbit1-paa-storage-r267-wa-caption-wechat-stable-ref-20261030'
          assert c['build_id']==m['release_id']
          assert len(m['files'])==32 and set(m['files'])==set(c['files'])
          assert m['files']['whatsapp-ingress.mjs']=='264c4d9614551f2586dfcc157db61d8c99d81c6326e8d7b51123de37052c733d'
          assert m['files']['wechat-media-tools.mjs']=='d406cdbdbe101e3b05bee701e947c4ff390abe8dce607d9ccc8c636325cf7bc2'
          print('CF_R267_PUBLIC_SOURCE_PINNED')
          PY
          tar -C "$SNAP" -czf "$RUNNER_TEMP/cf-wechat-cache-r267-bundle.tgz" \
            wechat-media-tools.mjs wechat_media_cache_adapter_v1.mjs \
            manifest.json release-closure.json test_r267_stable_public.mjs
      - name: Deliver secret-free snapshot to owner VPS using pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 21
          dir="$RUNNER_TEMP/wechat-r267-ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"
          chmod 0600 "$dir/key"
          read -r key_type key_data extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$dir/known_hosts"
          chmod 0600 "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          scp "${transport[@]}" -P "$port" "$RUNNER_TEMP/cf-wechat-cache-r267-bundle.tgz" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-wechat-cache-r267-bundle.tgz"
          scp "${transport[@]}" -P "$port" "$SNAP/activate-cf-r267-stable-ref-guarded.sh" "$VPS_SSH_USER@$VPS_HOST:/tmp/activate-cf-wechat-cache-r267.sh"
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" \
            'set -e; test "$(id -u)" = 0; set +e; bash /tmp/activate-cf-wechat-cache-r267.sh > /tmp/cf-wechat-cache-r267-deploy-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/cf-wechat-cache-r267-deploy-diagnostic.log; chmod 0640 /tmp/cf-wechat-cache-r267-deploy-diagnostic.log; exit "$rc"' </dev/null
          echo CF_R267_ROOT_SCRIPT_INVOKED_CONFIRM_DIRECT_SERVICE
