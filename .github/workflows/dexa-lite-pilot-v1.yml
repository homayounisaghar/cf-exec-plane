name: Dexa Lite isolated pilot deployment
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-lite-pilot-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-lite-pilot-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate one immutable request and pinned secret-free snapshot
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/dexa-lite-pilot-v1/dexa-lite-pilot-v1-20261103-v1.request
          dir=qualification/dexa-lite-20261103
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          grep -Fxq "request_id=dexa-lite-pilot-v1-20261103-v1" "$req"
          grep -Fxq "source_repo=homayounisaghar/capability-fabric" "$req"
          [[ "$(wc -l < "$req")" -eq 3 ]]
          echo 'f672e0ad4e7b109f0b3d03cfc9ba762efc990b5fa55448de42a5d82592fb2e3c  qualification/dexa-lite-20261103/lite-gateway.mjs' | sha256sum -c -
          echo '1e4b4777b63b4bcf3812760a4ee3475ea73dfd601276b2cbcfeda752502179de  qualification/dexa-lite-20261103/lite.css' | sha256sum -c -
          echo '166a0c50ff7bcd4bdb4e0859e8fe0513a926f382c85ec1a08bc56fe0994d7070  qualification/dexa-lite-20261103/ensure_lite_route.py' | sha256sum -c -
          node --check "$dir/lite-gateway.mjs"
          python3 -m py_compile "$dir/ensure_lite_route.py" "$dir/test_lite_real_http.py"
          bash -n "$dir/deploy.sh"
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mkdir -m 700 "$RUNNER_TEMP/dexa-lite-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/dexa-lite-ssh/key"
          chmod 600 "$RUNNER_TEMP/dexa-lite-ssh/key"
          read -r alg key extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$alg" == ssh-ed25519 && -n "$key" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$alg" "$key" > "$RUNNER_TEMP/dexa-lite-ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$alg" "$key" >> "$RUNNER_TEMP/dexa-lite-ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Deploy isolated pilot and verify via service
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-lite-20261103
          remote=/tmp/dexa-lite-pilot-20261103
          opts=(-i "$RUNNER_TEMP/dexa-lite-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dexa-lite-ssh/known_hosts")
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 700 $remote"
          for f in lite-gateway.mjs lite.css ensure_lite_route.py deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "$dir/$f" "$VPS_SSH_USER@$VPS_HOST:$remote/$f"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" "bash $remote/deploy.sh" </dev/null
          echo "VERIFY_LIVE_SERVICE_EXTERNALLY"
