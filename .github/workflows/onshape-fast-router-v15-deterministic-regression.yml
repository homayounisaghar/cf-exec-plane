name: Onshape V15 Deterministic Regression

on:
  push:
    branches: [main]
    paths:
      - qualification/onshape-fast-router-divergent-v15-10000/deterministic-control/*.request

permissions:
  contents: write

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax gate
        run: |
          python -m py_compile qualification/onshape-fast-router-divergent-v15-10000/evidence_v06.py
          python -m py_compile qualification/onshape-fast-router-divergent-v15-10000/fresh_holdout_v15_10000.py
          python -m py_compile qualification/onshape-fast-router-divergent-v15-10000/run_deterministic_regression.py
      - name: Run deterministic known-V15 regression
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/onshape-fast-router-v15-deterministic
        run: |
          cd qualification/onshape-fast-router-divergent-v15-10000
          python run_deterministic_regression.py
      - name: Publish
        if: always()
        run: |
          src="artifacts/onshape-fast-router-v15-deterministic"
          dst="reports/onshape-fast-router-v15-deterministic"
          mkdir -p "$dst"
          for f in summary.json failure-samples.json; do
            test -f "$src/$f" && cp "$src/$f" "$dst/$f" || true
          done
          if test -f "$src/summary.json"; then rm -f "$dst/latest-error.json"; else printf '{"state":"NO_SUMMARY"}\n' > "$dst/latest-error.json"; fi
          printf '{"run_id":"%s","head_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$dst/latest-meta.json"
          git config user.name "cf-exec-plane"
          git config user.email "actions@users.noreply.github.com"
          git add "$dst"
          git commit -m "Report: V15 deterministic regression" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
