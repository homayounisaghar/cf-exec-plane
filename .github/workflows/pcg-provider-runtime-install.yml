name: PCG Provider Runtime Install

on:
  push:
    branches: [main]
    paths:
      - server-bootstrap/control/pcg-provider-runtime-install/*.request

permissions:
  contents: read

concurrency:
  group: pcg-provider-runtime-install
  cancel-in-progress: false

jobs:
  install:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: request
        name: Validate immutable provider-runtime request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || { echo "provider runtime trigger must add exactly one request file" >&2; exit 10; }
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A ]] || exit 11
          [[ "$request_path" == server-bootstrap/control/pcg-provider-runtime-install/*.request ]] || exit 12
          request_id="$(awk -F= '$1=="request_id"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          candidate_commit="$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')"
          [[ "$request_id" == "$(basename "$request_path" .request)" ]] || exit 13
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]] || exit 14
          {
            echo "candidate_commit=$candidate_commit"
            echo "request_id=$request_id"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch exact private candidate then scrub credential
        env:
          CF_REPO_READ_TOKEN: ${{ secrets.CF_REPO_READ_TOKEN }}
          CANDIDATE_COMMIT: ${{ steps.request.outputs.candidate_commit }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CF_REPO_READ_TOKEN:?missing private repository read token}"
          work="${RUNNER_TEMP}/pcg-provider-private"
          rm -rf "$work"
          mkdir -m 700 "$work"
          git init "$work" >/dev/null
          askpass="${RUNNER_TEMP}/pcg-provider-askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$CF_REPO_READ_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C "$work" fetch --quiet --depth=1 \
            https://github.com/homayounisaghar/capability-fabric.git "$CANDIDATE_COMMIT"
          actual="$(git -C "$work" rev-parse FETCH_HEAD)"
          [[ "$actual" == "$CANDIDATE_COMMIT" ]] || exit 20
          git -C "$work" checkout --quiet --detach FETCH_HEAD
          rm -f "$askpass"
          unset CF_REPO_READ_TOKEN
          git -C "$work" remote remove origin >/dev/null 2>&1 || true
          echo "PCG_PRIVATE_WORKTREE=$work" >> "$GITHUB_ENV"

      - name: Static provider-runtime gate
        shell: bash
        run: |
          set -euo pipefail
          root="$PCG_PRIVATE_WORKTREE/server-deploy/channels/pcg/provider-runtime"
          test -d "$root"
          node --check "$root/pcg_browser_provider.mjs"
          node --check "$root/pcg_wechat_runtime.mjs"
          bash -n "$root/install.sh"
          grep -q 'PCG_PROVIDER_RUNTIME_DORMANT=1' "$root/install.sh"
          if grep -Eq '^systemctl enable ' "$root/install.sh"; then
            echo "install phase must not enable provider services" >&2
            exit 30
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 40
          port="${VPS_PORT:-22}"
          case "$port" in ''|*[!0-9]*) exit 41 ;; esac
          tmp="$RUNNER_TEMP/pcg-provider-ssh"
          install -d -m 0700 "$tmp"
          printf '%s\n' "$VPS_SSH_KEY" > "$tmp/key"
          chmod 0600 "$tmp/key"
          host_key_line="${VPS_HOST_KEY//$'\r'/}"
          read -r hkt hkd extra <<< "$host_key_line"
          [[ "$hkt" == ssh-ed25519 && -n "$hkd" && -z "${extra:-}" ]] || exit 42
          printf '%s %s %s\n' "$VPS_HOST" "$hkt" "$hkd" > "$tmp/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$hkt" "$hkd" >> "$tmp/known_hosts"
          chmod 0600 "$tmp/known_hosts"
          echo "SSH_DIR=$tmp" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Upload bounded provider-runtime payload
        shell: bash
        run: |
          set -euo pipefail
          root="$PCG_PRIVATE_WORKTREE/server-deploy/channels/pcg/provider-runtime"
          tar -C "$root" -czf "$RUNNER_TEMP/pcg-provider-runtime.tgz" .
          scp -q -i "$SSH_DIR/key" -P "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "$RUNNER_TEMP/pcg-provider-runtime.tgz" \
            "${VPS_SSH_USER}@${VPS_HOST}:/tmp/pcg-provider-runtime.tgz"

      - name: Install dormant runtime and verify host state
        env:
          CANDIDATE_COMMIT: ${{ steps.request.outputs.candidate_commit }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pcg-provider-remote.sh" <<'REMOTE'
          set -euo pipefail
          [[ "$(id -u)" -eq 0 ]] || { echo "PCG_PROVIDER_INSTALL_REQUIRES_ROOT" >&2; exit 50; }
          stage="/tmp/pcg-provider-runtime-$CANDIDATE_COMMIT"
          rm -rf "$stage"
          mkdir -m 0700 "$stage"
          tar -xzf /tmp/pcg-provider-runtime.tgz -C "$stage"
          rm -f /tmp/pcg-provider-runtime.tgz
          chmod 0750 "$stage/install.sh"
          bash "$stage/install.sh"

          command -v Xvfb >/dev/null
          command -v xvfb-run >/dev/null
          test -x /usr/local/lib/capability-fabric/pcg-provider-runtime/chrome-linux64/chrome
          test -f /etc/systemd/system/capability-fabric-pcg-browser@.service
          test -f /etc/systemd/system/capability-fabric-pcg-wechat.service
          for provider in bale whatsapp alibaba; do
            test -d "/var/lib/capability-fabric/pcg/$provider/profile"
            unit="capability-fabric-pcg-browser@$provider.service"
            if systemctl is-active --quiet "$unit"; then
              echo "PCG_PROVIDER_INSTALL_UNEXPECTED_ACTIVE provider=$provider" >&2
              exit 51
            fi
            if systemctl is-enabled --quiet "$unit"; then
              echo "PCG_PROVIDER_INSTALL_UNEXPECTED_ENABLED provider=$provider" >&2
              exit 52
            fi
          done
          test -d /var/lib/capability-fabric/pcg/wechat/home
          [[ "$(stat -c '%a' /var/lib/capability-fabric/pcg)" == 751 ]]
          if systemctl is-active --quiet capability-fabric-pcg-wechat.service; then
            echo "PCG_PROVIDER_INSTALL_UNEXPECTED_ACTIVE provider=wechat" >&2
            exit 53
          fi
          if systemctl is-enabled --quiet capability-fabric-pcg-wechat.service; then
            echo "PCG_PROVIDER_INSTALL_UNEXPECTED_ENABLED provider=wechat" >&2
            exit 54
          fi

          rm -rf "$stage"
          echo "PCG_PROVIDER_RUNTIME_INSTALL=success"
          echo "PCG_PROVIDER_RUNTIME_CANDIDATE=$CANDIDATE_COMMIT"
          echo "PCG_PROVIDER_RUNTIME_LIVE_RESTART=none"
          echo "PCG_PROVIDER_RUNTIME_SERVICES=dormant"
          REMOTE

          scp -q -i "$SSH_DIR/key" -P "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "$RUNNER_TEMP/pcg-provider-remote.sh" "${VPS_SSH_USER}@${VPS_HOST}:/tmp/pcg-provider-remote.sh"
          set +e
          ssh -i "$SSH_DIR/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${VPS_SSH_USER}@${VPS_HOST}" \
            "CANDIDATE_COMMIT='$CANDIDATE_COMMIT' bash /tmp/pcg-provider-remote.sh; rc=\$?; rm -f /tmp/pcg-provider-remote.sh; exit \$rc" </dev/null
          remote_rc=$?
          set -e
          echo "PCG_PROVIDER_RUNTIME_REMOTE_EXIT=$remote_rc"
          [[ "$remote_rc" -eq 0 ]] || exit "$remote_rc"
