name: CF WeChat Bounded Message List r273 Guarded Release
on:
  push:
    branches: [main]
    paths: [server-bootstrap/control/cf-wechat-message-list-r273/*.request]
permissions: {contents: read}
concurrency: {group: cf-wechat-message-list-r273, cancel-in-progress: false}
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNAP: qualification/cf-wechat-message-list-r273/20261101
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Admit exact immutable request
        shell: bash
        run: |
          set -euo pipefail
          req=server-bootstrap/control/cf-wechat-message-list-r273/cf-wechat-message-list-r273-20261101-v1.request
          [[ "$(git diff --name-status HEAD^ HEAD)" == "$(printf 'A\t%s' "$req")" ]] || exit 10
          [[ "$(wc -l < "$req")" == 4 ]] || exit 11
          grep -Fxq 'request_id=cf-wechat-message-list-r273-20261101-v1' "$req"
          grep -Fxq 'source_commit=bf762e7ba1f9ea0ee0bbdfdd6a00da146080ad3b' "$req"
          grep -Fxq 'expected_sequence=273' "$req"
          grep -Fxq 'expected_release=onshape-vps-fast-r100-direct-orbit1-paa-storage-r273-wechat-message-list-20261101' "$req"
      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          cd "$SNAP"
          [[ "$(git hash-object activate-r273.sh)" == '0ca0726baf12c9837ff1b4a9fb4ce269638ee837' ]]
          [[ "$(git hash-object patch.json)" == '168945fc49c0dc67b06b9909dfe0c2686d33bec5' ]]
          [[ "$(git hash-object test_wechat_message_list_cf_v1.mjs)" == 'd2eec6be584028325856d72ab95ea64d0f0dbd30' ]]
          bash -n activate-r273.sh
      - name: Scoped authenticated release and rollback
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]] || exit 20
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 21
          dir="$RUNNER_TEMP/r273-ssh"; install -d -m 0700 "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/key"; chmod 0600 "$dir/key"
          read -r kt kd extra < <(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')
          [[ "$kt" == ssh-ed25519 && -n "$kd" && -z "${extra:-}" ]] || exit 22
          printf '%s %s %s\n' "$VPS_HOST" "$kt" "$kd" > "$dir/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$kt" "$kd" >> "$dir/known_hosts"
          chmod 0600 "$dir/known_hosts"
          transport=(-i "$dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts")
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p -m 755 /tmp/cf-wechat-message-list-r273-payload"
          for f in activate-r273.sh patch.json test_wechat_message_list_cf_v1.mjs; do
            scp "${transport[@]}" -P "$port" "$SNAP/$f" "$VPS_SSH_USER@$VPS_HOST:/tmp/cf-wechat-message-list-r273-payload/$f"
          done
          ssh "${transport[@]}" -p "$port" "$VPS_SSH_USER@$VPS_HOST" 'set +e; bash /tmp/cf-wechat-message-list-r273-payload/activate-r273.sh > /tmp/cf-wechat-r273-diagnostic.log 2>&1; rc=$?; set -e; chgrp 1000 /tmp/cf-wechat-r273-diagnostic.log; chmod 0640 /tmp/cf-wechat-r273-diagnostic.log; exit "$rc"' </dev/null
          echo CF_WECHAT_MESSAGE_LIST_R273_REQUEST_EXECUTED_VERIFY_LIVE_SERVER
