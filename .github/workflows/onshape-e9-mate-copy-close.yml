name: Onshape E9 Mate Copy Guard Close
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-e9-mate-copy-close/*.request'
permissions:
  contents: read
concurrency:
  group: onshape-e9-mate
  cancel-in-progress: false
jobs:
  close:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-e9-mate-copy-close/*.request ]] || exit 11
          [[ "$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "close-mate-copy-guard" ]] || exit 12
          bash -n server-bootstrap/210-onshape-e9-mate-copy-close.sh
      - name: Close source guard and reopen production ingress
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/210-onshape-e9-mate-copy-close.sh
