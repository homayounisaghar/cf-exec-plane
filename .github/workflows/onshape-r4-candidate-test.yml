name: Onshape R4 Candidate Unit Test

on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/onshape-r4-candidate-test/*.request'

permissions:
  contents: read

jobs:
  test:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate immutable test request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changes < <(git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA")
          [[ "${#changes[@]}" -eq 1 ]] || exit 10
          IFS=$'\t' read -r status request_path <<<"${changes[0]}"
          [[ "$status" == A && "$request_path" == server-bootstrap/control/onshape-r4-candidate-test/*.request ]] || exit 11
          [[ "$(awk -F= '$1=="action"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "test-r4-candidate" ]] || exit 12
          [[ "$(awk -F= '$1=="candidate_commit"{print $2}' "$request_path" | tail -n1 | tr -d '[:space:]')" == "2b440e016e934c15ae61f1934201a1dc4ebee846" ]] || exit 13
      - name: Test exact private candidate without deployment
        shell: bash
        run: bash server-bootstrap/runner/remote-bundle-exec.sh server-bootstrap/134-onshape-r4-candidate-test.sh
