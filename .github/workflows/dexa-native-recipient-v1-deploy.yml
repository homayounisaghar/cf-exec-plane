name: Dexa Native Recipient Identity V1
on:
  push:
    branches: [main]
    paths:
      - 'server-bootstrap/control/dexa-native-recipient-v1/*.request'
permissions:
  contents: read
concurrency:
  group: dexa-native-recipient-v1
  cancel-in-progress: false
jobs:
  deploy:
    if: github.actor == 'homayounisaghar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable source-pinned Dexa recipient contract request
        shell: bash
        run: |
          set -euo pipefail
          dir=qualification/dexa-native-recipient-v1-20261101
          req=server-bootstrap/control/dexa-native-recipient-v1/dexa-native-recipient-v1-20261101-v1.request
          [[ "$(git diff --name-status "$GITHUB_SHA^" "$GITHUB_SHA")" == $'A\t'"$req" ]]
          [[ "$(wc -l < "$req")" -eq 5 ]]
          grep -Fxq 'request_id=dexa-native-recipient-v1-20261101-v1' "$req"
          grep -Fxq 'expected_cf=193' "$req"
          grep -Fxq 'expected_catalog=297' "$req"
          grep -Fxq 'source_commit=1c0264d84601d92e3877ae99f6b45c6321b80931' "$req"
          grep -Fxq 'manifest_blob_sha=9b14681f6b488b7bb0c204840619ae9539b2ab14' "$req"
          [[ "$(git hash-object "$dir/manifest.json")" == "9b14681f6b488b7bb0c204840619ae9539b2ab14" ]]
          [[ "$(git hash-object "$dir/deploy.sh")" == "a7dca482ae3bd41416699f97a4074c46434576e9" ]]
          sh -n "$dir/deploy.sh"
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('qualification/dexa-native-recipient-v1-20261101/manifest.json').read_text())
          assert m['schema']=='dexa.native-recipient.release.v1'
          assert m['release_id']=='dexa-native-recipient-v1-20261101'
          assert m['canonicalSource']['commit']=='1c0264d84601d92e3877ae99f6b45c6321b80931'
          assert m['expected']['catalog']==297 and m['expected']['nativeCF']==193
          assert m['expected']['offlineTests']==116
          assert m['cfServerChanged'] is False and m['providerSendForQualification'] is False
          assert len(m['candidateSha256'])==6 and len(m['liveBaselineSha256'])==5
          assert all(len(v)==64 for v in m['candidateSha256'].values())
          assert all(len(v)==64 for v in m['liveBaselineSha256'].values())
          print('DEXA_NATIVE_RECIPIENT_IMMUTABLE_ADMISSION_PASS')
          PY
      - name: Pin and prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_HOST" && -n "$VPS_SSH_USER" && -n "$VPS_HOST_KEY" ]]
          [[ "$VPS_SSH_USER" == cfserver || "$VPS_SSH_USER" == root ]]
          port="${VPS_PORT:-22}"
          case "$port" in *[!0-9]*) exit 22 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          read -r key_type key_data extra <<< "$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r')"
          [[ "$key_type" == ssh-ed25519 && -n "$key_data" && -z "$extra" ]]
          printf '%s %s %s\n' "$VPS_HOST" "$key_type" "$key_data" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '[%s]:%s %s %s\n' "$VPS_HOST" "$port" "$key_type" "$key_data" >> "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
      - name: Guarded install, scoped Dexa restart, exact hash and health readback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          remote=/tmp/dexa-native-recipient-v1-20261101
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'mkdir -p -m 755 /tmp/dexa-native-recipient-v1-20261101'
          for file in manifest.json native-recipient.patch test_dexa_native_recipient_contract_v1.mjs deploy.sh; do
            scp "${opts[@]}" -P "$SSH_PORT" "qualification/dexa-native-recipient-v1-20261101/$file" "$VPS_SSH_USER@$VPS_HOST:$remote/$file"
          done
          ssh "${opts[@]}" -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" 'sh /tmp/dexa-native-recipient-v1-20261101/deploy.sh' </dev/null
