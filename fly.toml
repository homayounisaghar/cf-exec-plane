# Public, secret-free canary only. One shared 256 MB machine.
# Trial automatically stops a running machine after five minutes.
# Do not disable auto-stop until the owner explicitly accepts usage billing.
app = "dexa-fly-canary-20261104"
primary_region = "fra"
kill_signal = "SIGTERM"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
