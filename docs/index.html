<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>آزمایش دسترسی دکسا — گیت‌هاب پیجز</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f6f8fa;color:#182534;padding:24px;box-sizing:border-box}
main{max-width:430px;width:100%;background:white;border:1px solid #e5e9ef;border-radius:24px;box-sizing:border-box;padding:28px 24px;box-shadow:0 5px 25px #0d12210c}
h1{font-size:1.45rem;line-height:1.6;margin:0 0 8px}
p{font-size:1rem;line-height:1.9;color:#36465a}
.key{font:700 1rem ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;overflow-wrap:anywhere;background:#f0f5f1;padding:15px;border-radius:12px;text-align:center}
.out{padding:14px;border-radius:12px;background:#f0f5ff;border:1px solid #dee7fd}
small{font-size:.86rem;color:#627286}
button{display:block;width:100%;border:0;border-radius:12px;padding:13px;margin:16px 0;font-weight:700;background:#1968d2;color:white;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>آزمایش دسترسی دکسا</h1>
<p>اگر این صفحه با فیلترشکن خاموش باز شده، مسیر این صفحه روی گیت‌هاب پیجز در دسترس است.</p>
<div class="key">DEXA_GITHUB_PAGES_OK</div>
<p>مرحلهٔ دوم: دریافت یک فایل مستقل از همان دامنه.</p>
<button type="button" id="test">بررسی دریافت فایل</button>
<div class="out" id="result" aria-live="polite">هنوز آزمایش نشده است.</div>
<p><small>این صفحه فقط برای آزمایش شبکه است؛ به دکسای اصلی متصل نیست و هیچ اطلاعات یا رمزی دریافت نمی‌کند.</small></p>
</main>
<script>
const result=document.getElementById("result");
document.getElementById("test").addEventListener("click",async()=>{
result.textContent="در حال بررسی...";
try {
const r=await fetch("./dexa-probe.txt?v="+Date.now(),{cache:"no-store",redirect:"error"});
const s=await r.text();
if(r.ok&&s.includes("DEXA_GITHUB_PAGES_ASSET_OK")){
result.textContent="موفق: صفحه و فایل مستقل، هر دو از همین دامنه دریافت شدند.";
}else{result.textContent="صفحه باز شد، ولی دریافت فایل موفق نبود. کد پاسخ: "+r.status;}
} catch(e) { result.textContent="صفحه باز شد، ولی دریافت فایل دوم ممکن نشد."; }
});
</script>
</body></html>
