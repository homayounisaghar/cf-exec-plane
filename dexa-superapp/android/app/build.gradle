plugins { id 'com.android.application' }
android {
    namespace 'com.homayounisaghar.dexasuperdashboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.homayounisaghar.dexasuperdashboard'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
