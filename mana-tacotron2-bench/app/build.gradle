plugins { id 'com.android.application' }

android {
    namespace 'com.mana.local.tacotron2.bench'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mana.local.tacotron2.playground.maleformant.v7'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '0.7.0-formant-wordgap'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    testImplementation 'junit:junit:4.13.2'
}
