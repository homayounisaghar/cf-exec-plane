plugins { id 'com.android.application' }

android {
    namespace 'com.mana.local.tacotron2.bench'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mana.local.tacotron2.bench'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-phase3'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}
