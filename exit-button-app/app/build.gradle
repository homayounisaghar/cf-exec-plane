plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homayounisaghar.exitbutton'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homayounisaghar.exitbutton'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
        }
    }
}
